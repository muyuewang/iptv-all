<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>纯净电视 · Rust</title>
<style>
  :root {
    --bg-top: #181a24;
    --bg-mid: #12141c;
    --bg-bot: #0c0d13;
    --line: #2a2f3d;
    --fg: #e8ecf5;
    --fg-dim: #8f97a8;
    --hi: #ff4d6d;
    --lo: #ff6b35;
    --panel: rgba(255,255,255,.03);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-mid) 45%, var(--bg-bot));
    color: var(--fg);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  /* 顶栏 */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  h1 {
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .3px;
    background: linear-gradient(90deg, var(--hi), var(--lo));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--hi), var(--lo));
    flex: 0 0 auto;
  }
  .ver { color: var(--fg-dim); font-size: 12px; }

  /* 主体：左列表 + 右播放区 */
  main { flex: 1 1 auto; display: flex; min-height: 0; }

  /* 左侧频道列表 */
  aside {
    width: 260px; flex: 0 0 auto;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
    min-height: 0;
  }
  .cats {
    display: flex; gap: 6px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); flex: 0 0 auto;
    overflow-x: auto;
  }
  .cat {
    padding: 4px 14px; border-radius: 999px; cursor: pointer;
    font-size: 13px; color: var(--fg-dim); white-space: nowrap;
    border: 1px solid transparent; background: var(--panel);
    user-select: none;
  }
  .cat.active {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--hi), var(--lo));
  }
  #chans { flex: 1 1 auto; overflow-y: auto; margin: 0; padding: 8px; list-style: none; }
  #chans li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; margin-bottom: 4px; cursor: pointer;
    background: transparent; border: 1px solid transparent;
  }
  #chans li:hover { background: var(--panel); }
  #chans li.on {
    border-color: var(--line);
    background: linear-gradient(90deg, rgba(255,77,109,.12), rgba(255,107,53,.06));
  }
  .idx {
    width: 22px; height: 22px; border-radius: 6px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 11px;
    font-family: ui-monospace, monospace;
    background: linear-gradient(135deg, var(--hi), var(--lo)); color: #fff;
  }
  .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dim { color: var(--fg-dim); font-size: 12px; }

  /* 右侧播放区 */
  section {
    flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0;
  }
  .stage {
    flex: 1 1 auto; display: grid; place-items: center;
    position: relative; min-height: 0;
    background: #000;
  }
  .stage .ph {
    color: var(--fg-dim); font-size: 15px; text-align: center; line-height: 2;
  }
  .stage .ph b {
    display: block; font-size: 22px;
    background: linear-gradient(90deg, var(--hi), var(--lo));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .info {
    flex: 0 0 auto; padding: 10px 18px;
    border-top: 1px solid var(--line); color: var(--fg-dim); font-size: 12px;
    font-family: ui-monospace, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <header>
    <span class="brand-dot"></span>
    <h1>纯净电视 · Rust</h1>
    <span class="ver" id="ver">加载中…</span>
  </header>

  <main>
    <aside>
      <div class="cats" id="cats"></div>
      <ul id="chans"><li class="dim">加载中…</li></ul>
    </aside>

    <section>
      <div class="stage" id="stage">
        <div class="ph">
          <b>Pure TV · Rust</b>
          <span>里程碑 1 · 播放区占位</span><br>
          <span>选中左侧频道即可「播放」</span>
        </div>
      </div>
      <div class="info" id="info">数据层版本 —</div>
    </section>
  </main>

<script>
  const { invoke } = window.__TAURI__.core;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let curTid = 'tv';

  async function loadCats() {
    try {
      const cats = await invoke('list_categories');
      const el = document.getElementById('cats');
      el.innerHTML = cats.map((c, i) =>
        `<span class="cat${i === 0 ? ' active' : ''}" data-tid="${esc(c.tid)}">${esc(c.name)}</span>`
      ).join('');
      el.querySelectorAll('.cat').forEach((node) =>
        node.addEventListener('click', () => {
          el.querySelectorAll('.cat').forEach((n) => n.classList.remove('active'));
          node.classList.add('active');
          curTid = node.dataset.tid;
          loadChans();
        })
      );
    } catch (e) {
      document.getElementById('cats').innerHTML =
        `<span class="dim">分类加载失败：${esc(e)}</span>`;
    }
  }

  async function loadChans() {
    const list = document.getElementById('chans');
    list.innerHTML = '<li class="dim">加载中…</li>';
    try {
      const chans = await invoke('list_channels', { tid: curTid });
      if (!chans.length) {
        list.innerHTML = '<li class="dim">（空）</li>';
        return;
      }
      list.innerHTML = chans.map((c, i) =>
        `<li data-id="${esc(c.id)}" data-name="${esc(c.name)}">
           <span class="idx">${i + 1}</span>
           <span class="name">${esc(c.name)}</span>
         </li>`
      ).join('');
      list.querySelectorAll('li').forEach((node) =>
        node.addEventListener('click', () => {
          list.querySelectorAll('li').forEach((n) => n.classList.remove('on'));
          node.classList.add('on');
          const name = node.dataset.name;
          const stage = document.getElementById('stage');
          stage.innerHTML =
            `<div class="ph"><b>${esc(name)}</b>
             <span>里程碑 1 · 播放占位（播放层后续里程碑接入）</span></div>`;
        })
      );
    } catch (e) {
      list.innerHTML = `<li class="dim">加载失败：${esc(e)}</li>`;
    }
  }

  async function boot() {
    try {
      const info = await invoke('app_info');
      document.getElementById('ver').textContent =
        `v${info.app_version} · core ${info.core_version} · ${info.profile}`;
      document.getElementById('info').textContent =
        `数据层版本 ${info.core_version} · 编译目标 ${info.target} · 构建 ${info.profile}`;
    } catch (e) {
      document.getElementById('ver').textContent = `IPC 失败: ${e}`;
    }

    await loadCats();
    await loadChans();

    // 启动自检：回传渲染状态，区分「真白屏」与「抓图失败」
    try {
      const b = getComputedStyle(document.body);
      const aside = document.querySelector('aside');
      await invoke('self_check', {
        report: JSON.stringify({
          title: document.title,
          bodyBgImage: b.backgroundImage.slice(0, 60),
          catCount: document.querySelectorAll('.cat').length,
          chanCount: document.querySelectorAll('#chans li').length,
          hasStage: !!document.getElementById('stage'),
          asideBox: aside ? `${aside.clientWidth}x${aside.clientHeight}` : null,
          viewport: `${innerWidth}x${innerHeight}`,
          dpr: devicePixelRatio,
        }),
      });
    } catch (e) {
      console.error('self_check 上报失败', e);
    }
  }

  boot();
</script>
</body>
</html>
