<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>纯净电视直播</title>
<!-- 共享核心：频道/解密/EPG/台标/收藏，与桌面端 shared/core.py 逻辑对齐 -->
<script src="logos.js"></script>
<script src="mpegts.js"></script>
<script src="tv_core.js"></script>
<style>
  /* ==========================================================================
     设计令牌 —— 现代深色媒体应用语言
     层次：bg(最底) < surface(卡) < surface2(悬浮) ；品牌色为红→暖橙渐变
     ========================================================================*/
  :root{
    --bg:#0a0b0f;
    --bg-grad:radial-gradient(120% 80% at 50% -10%, #1b1220 0%, #0a0b0f 58%);
    --surface:rgba(255,255,255,.045);
    --surface-2:rgba(255,255,255,.085);
    --surface-solid:#16181f;
    --line:rgba(255,255,255,.075);
    --line-strong:rgba(255,255,255,.14);
    --fg:#f2f4f8;
    --fg-dim:#a2a9b8;
    --fg-mute:#6b7385;
    --brand:#ff2d55;
    --brand-2:#ff6b35;
    --brand-grad:linear-gradient(135deg,#ff2d55 0%,#ff6b35 100%);
    --gold:#ffc531;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 20px -6px rgba(0,0,0,.55);
    --shadow-lg:0 18px 48px -12px rgba(0,0,0,.7);
    --glow:0 0 0 1px rgba(255,45,85,.4), 0 6px 22px -4px rgba(255,45,85,.45);
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);background-image:var(--bg-grad);
    background-attachment:fixed;color:var(--fg);overflow:hidden;letter-spacing:.01em;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}

  /* ---------------- 顶栏（玻璃拟态） ---------------- */
  header{position:sticky;top:0;z-index:10;padding:14px 14px 10px;
    background:linear-gradient(180deg,rgba(10,11,15,.92) 0%,rgba(10,11,15,.72) 70%,transparent 100%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid var(--line);}
  #title{font-size:16px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;
    letter-spacing:-.01em;}
  #title b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand-grad);
    box-shadow:0 0 10px rgba(255,45,85,.8);}
  #title::before{content:"📺";font-size:15px;filter:saturate(1.1);}
  #cnt{color:var(--fg-mute);font-weight:500;font-size:.72em;letter-spacing:0;}
  #search{width:100%;padding:11px 14px;border-radius:var(--r-md);border:1px solid var(--line);
    background:var(--surface);color:var(--fg);font-size:14px;outline:none;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease);}
  #search::placeholder{color:var(--fg-mute);}
  #search:focus{border-color:rgba(255,45,85,.5);background:var(--surface-2);box-shadow:var(--glow);}

  #scroller{height:calc(100% - 104px);overflow:auto;overscroll-behavior:contain;}
  #tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none;}
  #tabs::-webkit-scrollbar,#scroller::-webkit-scrollbar{display:none;}

  /* ---------------- 分类胶囊 ---------------- */
  .tab{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--fg-dim);cursor:pointer;
    transition:all .22s var(--ease);}
  .tab:active{transform:scale(.96);}
  .tab.on{background:var(--brand-grad);border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 4px 16px -4px rgba(255,45,85,.6);}

  /* ---------------- 频道网格 ---------------- */
  #list{padding:2px 14px 40px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ch{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:10px 12px;font-size:13.5px;display:flex;align-items:center;gap:10px;color:var(--fg);
    cursor:pointer;position:relative;min-height:56px;overflow:hidden;
    transition:background .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease);}
  .ch::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,45,85,.14),transparent 55%);
    opacity:0;transition:opacity .22s var(--ease);}
  .ch:active{transform:scale(.975);background:var(--surface-2);}
  .ch .lg,.ch .bd{width:42px;height:30px;flex:0 0 42px;border-radius:var(--r-sm);}
  .ch .lg{object-fit:contain;background:radial-gradient(circle at 50% 40%,#20222b,#0d0e13);
    padding:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
  .ch .bd{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
    color:#cfd4de;letter-spacing:.02em;overflow:hidden;
    background:linear-gradient(160deg,#2b303c,#1b1e26);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .ch .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  .ch .star{position:absolute;right:6px;top:4px;font-size:13px;line-height:1;color:#33384a;
    padding:4px 6px;border-radius:var(--r-sm);transition:all .2s var(--ease);z-index:1;}
  .ch .star.on{color:var(--gold);text-shadow:0 0 10px rgba(255,197,49,.6);}
  #hint{color:var(--fg-mute);font-size:13px;padding:36px 8px;text-align:center;grid-column:1/-1;line-height:1.7;}

  /* 焦点环（TV/键盘） */
  .tab:focus,.ch:focus,.ln:focus,.btn:focus{outline:none;}
  .tab:focus-visible,.ch:focus-visible,.ln:focus-visible,.btn:focus-visible{
    outline:2.5px solid var(--gold);outline-offset:2px;background:var(--surface-2);}

  /* ---------------- 播放层 ---------------- */
  #player{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;}
  #player.show{display:flex;}
  #vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex:0 0 auto;overflow:hidden;}
  #vwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 60px rgba(0,0,0,.6);}
  video{width:100%;height:100%;background:#000;display:block;}
  #status{margin:auto;color:#e6e9f0;font-size:14px;font-weight:500;text-align:center;padding:0 30px;
    position:absolute;left:0;right:0;top:42%;text-shadow:0 2px 12px rgba(0,0,0,.8);}
  #ctrl{display:flex;flex-direction:column;
    background:rgba(12,13,18,.86);-webkit-backdrop-filter:blur(20px) saturate(160%);
    backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--line);
    transition:opacity .3s var(--ease);}
  #pbar{display:flex;align-items:center;gap:8px;padding:11px 14px;color:var(--fg);font-size:13px;flex-wrap:wrap;}
  #cname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
    min-width:120px;letter-spacing:-.01em;}
  .btn{padding:8px 13px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);
    color:var(--fg);font-size:13px;font-weight:500;cursor:pointer;
    transition:all .18s var(--ease);}
  .btn:active{transform:scale(.95);}
  .btn.act{background:var(--brand-grad);border-color:transparent;color:#fff;
    box-shadow:0 3px 14px -4px rgba(255,45,85,.65);}
  #lines{display:flex;gap:7px;overflow-x:auto;padding:9px 14px;scrollbar-width:none;}
  #lines::-webkit-scrollbar{display:none;}
  .ln{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);color:var(--fg-dim);font-size:12.5px;font-weight:500;cursor:pointer;
    transition:all .2s var(--ease);}
  .ln.on{background:var(--brand-grad);border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 3px 12px -3px rgba(255,45,85,.6);}
  #epg{display:none;overflow:auto;max-height:34vh;
    background:rgba(9,10,14,.6);}
  #epg.show{display:block;}
  #epg .row{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.045);
    font-size:13px;transition:background .2s var(--ease);}
  #epg .row.now{background:linear-gradient(90deg,rgba(255,45,85,.16),rgba(255,45,85,.03));
    color:#fff;box-shadow:inset 3px 0 0 var(--brand);}
  #epg .row .tm{color:var(--fg-mute);flex:0 0 48px;font-variant-numeric:tabular-nums;font-weight:500;}
  #epg .row.now .tm{color:var(--gold);font-weight:600;}
  #epg .row .pg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #epg .row .rb{color:#fff;font-size:10.5px;font-weight:700;background:var(--brand-grad);
    border-radius:999px;padding:2px 8px;letter-spacing:.03em;align-self:center;}
  #toast{position:fixed;left:50%;bottom:44px;transform:translate(-50%,10px);
    background:rgba(24,26,33,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:500;z-index:99;
    border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);
    opacity:0;transition:opacity .26s var(--ease),transform .26s var(--ease);pointer-events:none;}
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* ================= TV（大屏 10-foot）模式 ================= */
  body.tv{font-size:18px;}
  body.tv header{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;
    border-bottom:none;padding:0;}
  body.tv #title{font-size:26px;padding:22px 32px 0;margin:0;letter-spacing:-.02em;}
  body.tv #search{display:none;}
  body.tv #scroller{height:calc(100% - 92px);}
  body.tv #tabs{padding:18px 32px 12px;gap:14px;}
  body.tv .tab{font-size:19px;padding:13px 28px;border-width:1.5px;}
  body.tv #list{grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px;padding:8px 32px 44px;}
  body.tv .ch{min-height:100px;padding:16px 18px;border-radius:var(--r-lg);font-size:20px;gap:16px;
    border-width:1.5px;}
  body.tv .ch .lg,body.tv .ch .bd{width:88px;height:64px;flex:0 0 88px;border-radius:10px;}
  body.tv .ch .bd{font-size:27px;}
  body.tv .ch .star{font-size:22px;right:14px;top:10px;}
  /* TV 焦点：提亮 + 渐变描边 + 抬升，替代刺眼纯色描边 */
  body.tv .ch:focus{outline:2.5px solid transparent;background:var(--surface-2);
    border-color:transparent;transform:scale(1.045);
    box-shadow:var(--glow),var(--shadow-lg);}
  body.tv .ch:focus::after{opacity:1;}
  body.tv .tab:focus{background:var(--surface-2);box-shadow:var(--glow);}
  body.tv #hint{font-size:20px;padding:80px 10px;}
  body.tv #player{display:none;}
  body.tv #player.show{display:block;}
  body.tv #vwrap{position:absolute;inset:0;height:100%;aspect-ratio:auto;}
  body.tv #status{top:44%;font-size:22px;}
  body.tv #ctrl{position:absolute;left:0;right:0;bottom:0;border-top:none;
    background:linear-gradient(transparent,rgba(8,9,13,.75) 32%,rgba(8,9,13,.96));
    padding-top:56px;transition:opacity .34s var(--ease);}
  body.tv #ctrl.hide{opacity:0;pointer-events:none;}
  body.tv #pbar{padding:16px 36px;font-size:20px;gap:16px;}
  body.tv .btn{font-size:19px;padding:13px 24px;border-radius:var(--r-md);}
  body.tv .btn:focus{box-shadow:var(--glow);}
  body.tv #lines{padding:12px 36px 22px;gap:14px;}
  body.tv .ln{font-size:18px;padding:11px 22px;}
  body.tv .ln:focus{box-shadow:var(--glow);}
  body.tv #epg{max-height:48vh;font-size:20px;background:rgba(6,7,10,.82);}
  body.tv #epg .row{padding:16px 36px;}
  body.tv #epg .row .tm{flex:0 0 76px;}
</style>
</head>
<body>
<header>
  <div id="title">纯净电视直播 <b></b> <span id="cnt"></span></div>
  <input id="search" placeholder="搜索频道…" autocomplete="off">
</header>
<div id="scroller">
  <div id="tabs"></div>
  <div id="list"><div id="hint">正在加载频道…</div></div>
</div>

<div id="player">
  <div id="vwrap"><video id="v" controls playsinline webkit-playsinline tabindex="0"></video></div>
  <div id="status">正在解析线路…</div>
  <div id="ctrl">
    <div id="pbar">
      <div id="cname">—</div>
      <button class="btn" id="btnEpg" tabindex="0">节目单</button>
      <button class="btn" id="btnFs" tabindex="0">全屏</button>
      <button class="btn" id="btnFav" tabindex="0">收藏</button>
      <button class="btn" id="btnClose" tabindex="0">返回</button>
    </div>
    <div id="lines"></div>
    <div id="epg"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ==========================================================================
 * UI 层：只负责渲染 / 交互 / 播放器
 * 业务逻辑全部来自 TVCore（shared/web/tv_core.js），与桌面端 core.py 对齐
 * ========================================================================*/
var C = window.TVCore;
var CATS = C.CATS;
var IS_TV = /[?&]tv=1/.test(location.search) || window.innerWidth >= 960 || window.innerHeight >= 960;
var cur = { tid:null, id:null, name:null, urls:[], idx:0, epg:[] };
var player = null, ctrlTimer = null;
var curCat = "tv", allChans = [];

function $(id){ return document.getElementById(id); }
function toast(t){ var e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove("show");},1600); }
function logoSrc(n){ return C.logoSrc(n, window.LOGOS); }
function favArr(){ return C.favArr(); }
function isFav(t,i){ return C.isFav(t,i); }

/* ---------- 收藏 ---------- */
function toggleFav(tid,id,name){
  var added = C.toggleFav(tid,id,name);
  toast(added ? "已收藏" : "已取消收藏");
  if(curCat==="fav") loadCat("fav");
}

/* ---------- EPG ---------- */
function renderEpg(){
  var box=$("epg"); box.innerHTML="";
  if(!cur.epg.length){ box.innerHTML='<div class="row"><div class="pg">暂无节目单</div></div>'; return; }
  var now=new Date(), hm=("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2), idx=-1;
  for(var i=0;i<cur.epg.length;i++){ if(cur.epg[i].time<=hm) idx=i; }
  cur.epg.forEach(function(p,i){
    var d=document.createElement("div"); d.className="row"+(i===idx?" now":"");
    d.innerHTML='<div class="tm">'+p.time+'</div><div class="pg">'+p.name+'</div>'+(i===idx?'<div class="rb">直播中</div>':'');
    box.appendChild(d);
  });
}

/* ---------- 播放 ---------- */
function openChannel(tid, id, name){
  cur.tid=tid; cur.id=id; cur.name=name; cur.urls=[]; cur.idx=0; cur.epg=[];
  $("cname").textContent=name;
  $("btnFav").className="btn"+(isFav(tid,id)?" act":"");
  $("btnFav").textContent=isFav(tid,id)?"★ 已收藏":"☆ 收藏";
  $("btnEpg").className="btn"; $("epg").classList.remove("show");
  $("ctrl").classList.remove("hide"); resetCtrlTimer();
  $("player").classList.add("show");
  $("status").style.display="block"; $("status").textContent="正在解析线路…";
  $("lines").innerHTML="";
  C.fetchPlay(tid, id).then(function(res){
    cur.epg = res.epg || [];
    if(!res.urls.length){ $("status").textContent="线路解析失败，请返回重进刷新令牌"; return; }
    cur.urls=res.urls; renderLines(); playIdx(0);
    if(IS_TV){ var f=document.querySelector("#lines .ln"); if(f) f.focus(); }
  }).catch(function(e){ $("status").textContent="网络错误："+e; });
}
function renderLines(){
  var w=$("lines"); w.innerHTML="";
  cur.urls.forEach(function(u,i){
    var d=document.createElement("div"); d.className="ln"+(i===cur.idx?" on":""); d.textContent="线路"+(i+1);
    d.tabIndex=0; d.onclick=function(){ playIdx(i); };
    w.appendChild(d);
  });
}
function setLineUI(){ var ls=$("lines").children; for(var i=0;i<ls.length;i++) ls[i].className="ln"+(i===cur.idx?" on":""); }
function playIdx(i){
  cur.idx=i; setLineUI();
  var url=cur.urls[i]; if(!url) return;
  if(player){ try{player.destroy();}catch(e){} player=null; }
  var v=$("v"); try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
  $("status").style.display="block"; $("status").textContent="连接线路"+(i+1)+"…";
  if(!window.mpegts || !mpegts.getFeatureList().mseLivePlayback){ $("status").textContent="当前设备不支持 FLV 直播播放"; return; }
  player=mpegts.createPlayer({type:"flv", isLive:true, url:url},
      {enableWorker:true, liveBufferLatencyChasing:true, lazyLoad:false, stashInitialSize:128, autoCleanupSourceBuffer:true});
  player.on(mpegts.Events.ERROR, function(){ nextLine(); });
  v.onplaying=function(){ $("status").style.display="none"; };
  v.onended=function(){ nextLine(); };
  v.onerror=function(){ nextLine(); };
  player.attachMediaElement(v);
  try{ player.load(); v.play(); }catch(e){ nextLine(); }
}
function nextLine(){
  if(cur.idx+1 < cur.urls.length){ toast("线路"+(cur.idx+1)+"失败，切换下一条"); playIdx(cur.idx+1); }
  else { $("status").style.display="block"; $("status").textContent="所有线路均失败，请返回重进刷新令牌"; }
}
function closePlayer(){
  if(player){ try{player.destroy();}catch(e){} player=null; }
  var v=$("v"); try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
  $("player").classList.remove("show");
  if(IS_TV){ var f=document.querySelector(".ch"); if(f) f.focus(); }
}
function toggleFs(){
  var v=$("v");
  if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  else { (v.requestFullscreen||v.webkitRequestFullscreen||v.webkitEnterFullscreen).call(v); }
}
function resetCtrlTimer(){
  clearTimeout(ctrlTimer);
  ctrlTimer=setTimeout(function(){
    var p=$("player");
    if(p.classList.contains("show") && !$("epg").classList.contains("show")){
      $("ctrl").classList.add("hide");
      if($("ctrl").contains(document.activeElement)){ try{ $("v").focus(); }catch(e){} }
    }
  }, 6000);
}

/* ---------- 列表渲染 ---------- */
function renderChannels(){
  var kw=IS_TV?"":($("search").value||"").trim().toLowerCase();
  var list=$("list"); list.innerHTML="";
  var src=(curCat==="fav")?favArr().map(function(f){return {id:f.id,name:f.name};}):allChans;
  var arr=src.filter(function(c){ return !kw || c.name.toLowerCase().indexOf(kw)>=0; });
  if(!arr.length){ list.innerHTML='<div id="hint">'+(curCat==="fav"?"还没有收藏，按★键收藏频道":"无匹配频道")+'</div>'; return; }
  arr.forEach(function(c){
    var d=document.createElement("div"); d.className="ch"; d.tabIndex=0;
    var lg=logoSrc(c.name);
    d.innerHTML=(lg?'<img class="lg" src="'+lg+'" onerror="this.style.display=\'none\'">':'<div class="bd">'+c.name.slice(0,2)+'</div>')
              + '<div class="nm">'+c.name+'</div>'
              + '<div class="star'+(isFav(curCat,c.id)?" on":"")+'" tabindex="-1">★</div>';
    d.onclick=function(){ openChannel(curCat, c.id, c.name); };
    var st=d.querySelector(".star");
    st.onclick=function(ev){ ev.stopPropagation(); toggleFav(curCat,c.id,c.name); st.className="star"+(isFav(curCat,c.id)?" on":""); };
    d.oncontextmenu=function(ev){ ev.preventDefault(); toggleFav(curCat,c.id,c.name); return false; };
    list.appendChild(d);
  });
}
function loadCat(tid){
  curCat=tid;
  var ts=$("tabs").children; for(var i=0;i<ts.length;i++) ts[i].className="tab"+(ts[i].dataset.tid===tid?" on":"");
  if(tid==="fav"){ allChans=[]; renderChannels(); $("cnt").textContent=favArr().length+" 个收藏"; if(IS_TV){var f=document.querySelector(".ch");if(f)f.focus();} return; }
  $("list").innerHTML='<div id="hint">正在加载…</div>';
  C.fetchChannels(tid).then(function(arr){
    allChans=arr||[]; renderChannels(); $("cnt").textContent=allChans.length+" 个频道";
    if(IS_TV){ var f=document.querySelector(".ch"); if(f) f.focus(); }
  }).catch(function(){ $("list").innerHTML='<div id="hint">加载失败，请检查网络</div>'; });
}

/* ---------- 初始化 ---------- */
function init(){
  if(IS_TV) document.body.classList.add("tv");
  var t=$("tabs");
  var fav=document.createElement("div"); fav.className="tab"; fav.textContent="⭐ 收藏"; fav.dataset.tid="fav"; fav.tabIndex=0;
  fav.onclick=function(){ loadCat("fav"); }; t.appendChild(fav);
  CATS.forEach(function(c){
    var d=document.createElement("div"); d.className="tab"; d.textContent=c[1]; d.dataset.tid=c[0]; d.tabIndex=0;
    d.onclick=function(){ loadCat(c[0]); };
    t.appendChild(d);
  });
  $("search").oninput=renderChannels;
  $("btnClose").onclick=closePlayer;
  $("btnFs").onclick=toggleFs;
  $("btnEpg").onclick=function(){ var b=$("epg"); b.classList.toggle("show"); if(b.classList.contains("show")) renderEpg(); $("btnEpg").className="btn"+(b.classList.contains("show")?" act":""); resetCtrlTimer(); };
  $("btnFav").onclick=function(){ toggleFav(cur.tid,cur.id,cur.name); $("btnFav").className="btn"+(isFav(cur.tid,cur.id)?" act":""); $("btnFav").textContent=isFav(cur.tid,cur.id)?"★ 已收藏":"☆ 收藏"; };

  /* ===== 遥控器 / 键盘方向键导航（TV 版核心） ===== */
  function listOf(sel){ return [].slice.call(document.querySelectorAll(sel)); }
  function colsCount(){
    var it=listOf("#list .ch"); if(!it.length) return 1;
    var top=it[0].offsetTop, c=0;
    for(var i=0;i<it.length;i++){ if(it[i].offsetTop===top) c++; else break; }
    return c||1;
  }
  var OK=[23,13,66,160];
  document.addEventListener("keydown", function(e){
    var k=e.keyCode, ae=document.activeElement, inPlayer=$("player").classList.contains("show");
    if(inPlayer){ $("ctrl").classList.remove("hide"); resetCtrlTimer();
      var plist=listOf("#pbar .btn").concat(listOf("#lines .ln"));
      if(plist.indexOf(ae)<0){
        var fl=listOf("#lines .ln")[cur.idx]||listOf("#lines .ln")[0]; if(fl){ fl.focus(); return; }
      }
      var pi=plist.indexOf(ae);
      if(OK.indexOf(k)>=0){ if(ae&&typeof ae.click==="function"&&ae.tagName!=="INPUT"){ ae.click(); } e.preventDefault(); return; }
      if(k===37||k===38||k===39||k===40){ e.preventDefault();
        if(pi<0){ if(plist[0]) plist[0].focus(); return; }
        var np=plist[pi+((k===39||k===40)?1:-1)]; if(np) np.focus(); return; }
      return;
    }
    var tabs=listOf("#tabs .tab"), chs=listOf("#list .ch");
    var ti=tabs.indexOf(ae), ci=chs.indexOf(ae);
    if(OK.indexOf(k)>=0){ e.preventDefault(); if(ae&&typeof ae.click==="function"&&ae.tagName!=="INPUT") ae.click(); return; }
    if(k===37||k===39){
      e.preventDefault();
      var d=(k===39)?1:-1;
      if(ti>=0){ var nt2=tabs[ti+d]; if(nt2) nt2.focus(); }
      else if(ci>=0){ var nc=chs[ci+d]; if(nc) nc.focus(); }
    } else if(k===40){
      e.preventDefault();
      if(ti>=0){ if(chs[0]) chs[0].focus(); }
      else if(ci>=0){ var c=colsCount(), nd=chs[ci+c]; if(nd) nd.focus(); }
    } else if(k===38){
      e.preventDefault();
      if(ci>=0){ var up=chs[ci-colsCount()]; if(up) up.focus(); else if(tabs[0]) tabs[0].focus(); }
    }
  });
  loadCat("tv");
}
window.addEventListener("load", init);
</script>
</body>
