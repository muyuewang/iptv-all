[package]
name = "clean-tv-app"
version = "2.10.54"
edition = "2021"
description = "纯净电视 · Tauri 壳（里程碑 0：验证 MSVC + WebView2 + 数据层打通）"
license = "MIT"

[dependencies]
# 数据层（纯逻辑，无 GUI 依赖）
clean-tv-core = { path = ".." }
serde = { workspace = true }
serde_json = { workspace = true }
# 网络抓取（与 core 的 net 模块同款：native-tls/Schannel 放宽证书）
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "blocking"] }
# 异步运行时（tauri command async 用；与 core 对齐版本）
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
# Tauri 2 稳定线（2.12.x）。注意不要用 3.0.0-alpha：练手项目要踩稳，
# 而且 Tauri 3 目前对外 API 仍在变动。
# ★ custom-protocol 必需：否则 WebviewUrl::App("index.html") 无法在运行时
#   把嵌入的 frontendDist 资产（哈希命名 + brotli 压缩）解析出来 → 前端白屏。
#   这是 release/debug 下「前端 boot() 不执行」的根因。
tauri = { version = "2", features = ["custom-protocol"] }
# ★ spike 专用：webview2-com 是 Tauri 在 Windows 上已经拉进来的依赖（0.39.1），
#   `PlatformWebview::controller()` 返回的 `ICoreWebView2Controller` 正是这个 crate
#   的类型。这里显式声明同版本，直接复用 Tauri 底层的 WebView2 COM 绑定，
#   不新增任何额外依赖，也不会多编译一套 bindings。
#   spike 结论见 WRY_NETWORK_SPIKE.md；若结论是「走官方 API」，可移除。
webview2-com = "0.39"
# 裸 COM 直调要用到的 windows 基础类型（PCWSTR / HSTRING / PWSTR 等）。
# ★ 必须与 webview2-com-sys 0.39.1 的 windows 依赖版本一致（0.62），
#   否则 cargo 会同时编译两套不兼容的 windows crate，COM 指针类型对不上。
# ★ Win32_UI_WindowsAndMessaging：起播判据要用 EnumChildWindows/GetClassNameW
#   检测 mpv 是否已经创建了视频子窗口（= 真的解出了第一帧画面）。
# ★ Win32_Graphics_Gdi：ClientToScreen（把客户区原点换算成屏幕坐标）在这个模块下，
#   0.62 里它不在 UI::WindowsAndMessaging。
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
ureq = "3.5.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Tauri 在 Windows 上要求 GUI 子系统（否则会多弹一个控制台窗口）。
# debug 构建也这样设，方便直接双击 exe 看效果。
[[bin]]
name = "clean-tv-app"
path = "src/main.rs"

# ★★ 本 package **只允许这一个 bin**：Tauri 2 的 bundler 会把 package 里
#   所有 bin target 都打进安装包，开发期探针（probe_*/spike_net）会污染
#   交付包，还会在打包时报「找不到 xxx.exe」。它们已迁到 ../probes 独立 crate。
#
# 注意：[profile.*] 在 workspace 成员里会被 cargo 忽略（只有根 Cargo.toml 的
# profile 生效），所以优化配置统一写在 ../Cargo.toml 的 [profile.dev.package."*"]。
