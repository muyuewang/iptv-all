[package]
name = "clean-tv-core"
version = "2.10.53"
edition = "2021"
description = "纯净电视 · Rust 数据层（从 shared/core.py / wvt.py 移植的纯逻辑）"
license = "MIT"

[dependencies]
base64 = "0.22"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
# AES-CBC 解密：用成熟 crate 替代 Python 版的手写 AES（更安全、更符合 Rust 惯例）。
# Python 版手写 AES 是为了「零第三方依赖、不撑大 exe」；Rust 侧静态链接后体积可控。
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# 真实网络抓取层（迁移 core.py 的 api_get/fetch_channels/fetch_play）。
# ★ TLS 后端用 native-tls（Windows Schannel）：rustls 的 ring provider 在
#   WebView2 进程里首次 TLS 握手会死锁（app 端实测），Schannel 是系统自带、无此问题。
#   源站证书链不完整用 danger_accept_invalid_certs 放宽即可。
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "blocking"] }
# 异步运行时（Tauri 也用 tokio，workspace 内版本对齐）
# macros 供 #[tokio::main] 用；rt-multi-thread 供多线程调度。
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }

# ==================================================================
# workspace
# ==================================================================
# 采用「root package + workspace」的混合写法：本 Cargo.toml 既是
# clean-tv-core 这个包，也是 workspace 根。好处是数据层的 src/ 不必
# 搬家（保持已有 git 历史和上面的文档注释路径不变），只需把 app/
# 挂进来即可共享依赖解析与 target 目录。
#
# 目录结构：
#   tv_rs/Cargo.toml       <- 本文件（core 包 + workspace 根）
#   tv_rs/src/             <- 数据层（无 GUI）
#   tv_rs/tests/           <- 与 Python 的对拍测试
#   tv_rs/app/             <- Tauri 壳（GUI）
[workspace]
members = ["app", "probes"]
# app 里的依赖（tauri 全家桶）解析结果与 core 无关，
# 但共享 target 能省一份增量编译缓存。
resolver = "2"

[workspace.dependencies]
# 数据层对外暴露的类型都基于 serde，GUI 侧复用同一版本避免类型不兼容
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ==================================================================
# profile（必须在 workspace 根，写在成员 crate 里会被忽略）
# ==================================================================
# tauri 依赖树很深，dev 构建若对依赖全不做优化会明显拖慢启动；
# 对第三方依赖单独开 opt-level=2，自己的代码仍保持 0 以便快速迭代。
# 这是 Tauri 官方的推荐配置。
[profile.dev.package."*"]
opt-level = 2