/* ---------- 线路智能测速选优 ----------
   探测每条线路的「首字节延迟」与「视频分辨率/码率」。
   低端设备解不动 1080p@2.4Mbps —— 优先选码率低的线路，避免解码跟不上导致卡顿。
   评分 = 延迟权重 + 码率惩罚（低端机惩罚系数更大）。                        */
function probeLine(url, timeoutMs){
  return new Promise(function(resolve){
    var t0=Date.now(), done=false, xhr=new XMLHttpRequest();
    var finish=function(rtt, br){
      if(done) return; done=true;
      try{xhr.abort();}catch(e){}
      resolve({rtt: rtt, br: br});   /* rtt=首字节ms, br=估算kbps(0=未知) */
    };
    var to=setTimeout(function(){ finish(1e9, 0); }, timeoutMs);
    try{
      xhr.open("GET", url, true);
      xhr.responseType="arraybuffer";
      xhr.onprogress=function(ev){
        /* 拿到首批数据 → 既算延迟也算瞬时速率 */
        if(!done && ev.loaded >= 2048){
          clearTimeout(to);
          var dt=(Date.now()-t0)/1000;
          var kbps = dt>0 ? Math.round(ev.loaded*8/1000/dt) : 0;
          finish(Date.now()-t0, kbps);
        }
      };
      xhr.onreadystatechange=function(){
        if(xhr.readyState===2){ /* 已收到响应头，记录首字节时间（下限） */
          if(!done){ /* 先记为候选，等 onprogress 拿更准的码率 */ }
        }
      };
      xhr.onerror=function(){ clearTimeout(to); finish(1e9, 0); };
      /* 取 64KB 头：足够覆盖 FLV metadata，能读到 width/height/videodatarate */
      try{ xhr.setRequestHeader("Range","bytes=0-65535"); }catch(e){}
      xhr.send();
    }catch(e){ clearTimeout(to); finish(1e9, 0); }
  });
}
function pickBestLine(urls){
  var n=Math.min(urls.length, 8), tasks=[];
  for(var i=0;i<n;i++) tasks.push(probeLine(urls[i], 2500));
  return Promise.all(tasks).then(function(rs){
    /* 低端机：码率惩罚 3 倍（宁可选低清也别卡）；中高端：只轻微考虑码率 */
    var wBr = (TIER === "low") ? 3.0 : 0.6;
    var best=0, bestScore=Infinity;
    for(var i=0;i<n;i++){
      var r=rs[i];
      var score;
      if(r.rtt>=1e9){ score = 1e7 + i; }              /* 失败线路垫底 */
      else {
        /* 归一化：延迟(s) + 码率(Mbps)*权重；低码率得分更低 → 更容易被选中 */
        var latS = r.rtt/1000;
        var mbps = r.br/1000;
        score = latS + mbps*wBr;
      }
      if(score<bestScore){ bestScore=score; best=i; }
    }
    return best;
  });
}

function renderLines(){
  var w=$("lineGrid"); w.innerHTML="";
  cur.urls.forEach(function(u,i){
    var d=document.createElement("div"); d.className="line-item"+(i===cur.idx?" on":"");
    d.innerHTML='<span class="ic">'+(i===cur.idx?"✅":"📡")+'</span><span class="lb">线路'+(i+1)+'</span>';
    d.tabIndex=0; d.onclick=function(){ playIdx(i); closeLinePanel(); };
    w.appendChild(d);
  });
}
function setLineUI(){
  var ls=$("lineGrid").children; for(var i=0;i<ls.length;i++){
    ls[i].className="line-item"+(i===cur.idx?" on":"");
    var ic=ls[i].querySelector(".ic"); if(ic) ic.textContent=(i===cur.idx?"✅":"📡");
  }
}
function openLinePanel(){ $("linePanel").classList.add("show"); resetCtrlTimer(); }
function closeLinePanel(){ $("linePanel").classList.remove("show"); }
/* ==================== 原生硬解通道（v1.4 新增） ====================
   为什么加：mpegts.js 是 JS 软解，1080p@2.4Mbps 在 4 核低端机上解不过来（实测 20 秒只推进 4.6 秒）。
   v1.2 靠调参把指标压到 106%，但那是软解天花板，源一重还是卡。

   现在的策略：优先走原生 ExoPlayer（MediaCodec 硬解，H.264/H.265 交给 DSP，CPU 几乎不参与）。
   画面由原生 SurfaceView 输出（铺在 WebView 之下），网页只负责画控制条浮层 + 发指令。
   mpegts.js 保留为兜底：老设备无原生桥、或原生播放直接报错时，自动回落到软解。

   判定顺序：hasNativePlay() → nativePlay(url)；任何一步抛错或返回 false → 走 mpegts 软解。 */
var NATIVE = {
  ok: false,        /* 原生桥是否可用（开机探测一次） */
  active: false,    /* 当前是否正在走原生播放 */
  probing: false,
  deadIdx: {},      /* ★ 硬解失败过的**线路下标**（v2.7 前是频道级 dead，见 playIdx 注释） */
  frozen: false,    /* 已退出播放层但画面层被保留（TextureView 上停着最后一帧） */
  firstFrame: false,/* 本次起播是否已出首帧（起播看门狗据此决定要不要换线） */
  lastUrl: "",
  timer: null,      /* 卡死看护定时器 */
  lastPos: 0,       /* 上一次读到的播放位置（判断是否零推进） */
  lastStats: null,  /* ★ 最近一次 nativeStats() 的结果（v2.8）：角标只读缓存，
                       否则每 2 秒再来一次 CountDownLatch(300ms) 会白白卡住 WebView */
  stallN: 0,
  stallT: 0
};

function hasNative(){
  try{
    return !!(window.NativeTV && NativeTV.hasNativePlay && NativeTV.hasNativePlay());
  }catch(e){ return false; }
}
NATIVE.ok = hasNative();

/* 原生「真的活了」的统一处理：收状态行、清重连计数、撤起播看门狗、复位卡顿计时。
   （v2.6 抽出来，是因为「ready / size（非 0x0）/ firstframe」三个信号都要走同一套收尾） */
function nativeLive(){
  hideStatus();
  hideErrCard();
  NATIVE.retry = 0;                     /* 连上了就清零重连计数 */
  markFirstFrame();                     /* ★ 出首帧：撤起播看门狗 + 清自动跳台计数 */
  /* ★ 复位卡顿计时（v2.7 修）：这里原来写的是**全局** `stallN/stallT`，而卡顿看护
     （bindNativeWatch）读的是 `NATIVE.stallN/NATIVE.stallT` —— 两套变量，等于这行
     从来没生效过。后果：起播耗时超过 8s 的线路，firstFrame 置位的**同一时刻**
     `Date.now() - NATIVE.stallT` 就已经 > 8000，下一个 2.5s 轮询就会把它当「起播后
     零推进」换掉 —— 明明刚起来就被换线。 */
  NATIVE.stallN = 0; NATIVE.stallT = Date.now();
}

/* 原生播放状态回调（由 MainActivity 注入：window.__onNativeState(state, detail)） */
window.__onNativeState = function(state, detail){
  try{
    if(!NATIVE.active) return;
    if(state === "buffering"){
      setStatus("连接线路"+(cur.idx+1)+"…", true);
    } else if(state === "ready" || state === "firstframe"){
      nativeLive();
    } else if(state === "size"){
      /* ★★ 只认「有真实宽高」的 size（v2.6 踩坑）：
         media3 在 setMediaItem 切换媒体项时会先发一次 VideoSize.UNKNOWN，detail 是
         "0x0" —— 那不是出帧。实测（tools/_probe_watchdog.py）正是这条假 size 让
         markFirstFrame() 在看门狗布防的同一帧把它撤掉，于是挂起线路永远等满超时：
             ['buffering','switch'] → ['tracks','0'] → ['size','0x0']
         所以 0x0 当没看见 —— 既不能撤看门狗，也不能顺手收掉状态行（那会让用户
         看着一张定格画面却没有任何「正在连接」的提示）。 */
      var mm = /^(\d+)x(\d+)$/.exec(String(detail || ""));
      if(mm && parseInt(mm[1],10) > 0 && parseInt(mm[2],10) > 0) nativeLive();
    } else if(state === "decoder"){
      /* 原生回传命中的解码器名（hw:xxx / sw-only），仅日志用途 */
      try{ console.log("[native decoder]", detail); }catch(e){}
    } else if(state === "ended"){
      /* 直播 FLV 的连接被 CDN 掐断时 ExoPlayer 会报 ended——这不是线路坏，
         重连同一条线路即可（比烧掉一条线路划算得多）。
         同一条线路连续重连 2 次仍断，才换下一条。 */
      NATIVE.retry = (NATIVE.retry || 0) + 1;
      if(NATIVE.retry <= 2 && NATIVE.active && NATIVE.lastUrl && NativeTV.nativeSwitch){
        toast("直播流断开，自动重连…", {type:"warn"});
        setTimeout(function(){
          try{ if(NATIVE.active && NativeTV.nativeSwitch) NativeTV.nativeSwitch(NATIVE.lastUrl); }catch(e){}
        }, 600);
      } else {
        NATIVE.retry = 0;
        nextLine();
      }
    } else if(state === "hlsskip"){
      /* 原生自己在原地重播了**同一条流**（HLS 分片级错误 → 跳到直播边缘，见
         Media3PlayerBackend.onPlayerError 的注释）。画面层不用动 —— 只把「正在重试」
         告诉用户，并把卡顿计时复位：否则 8s 卡顿看护会在自救期间抢跑换线，等于白救。 */
      setStatus("线路"+(cur.idx+1)+"分片异常，跳到直播位置重试…", true);
      NATIVE.stallN = 0; NATIVE.stallT = Date.now();
    } else if(state === "error"){
      /* ★ v2.10.15 直连缓存尝试中报 error：URL 已失效（token 过期/站点改版）——
         软解同一条 URL 也是死路，直接删缓存回退原网页链路，不走下面的换软解。
         （extcFail 自己清 trying/定时器；nativeStop 已把 active 置 false，
          回退期间迟到的回调都会被函数开头 !NATIVE.active 挡住，无竞态。） */
      if(EXTC.trying){
        NATIVE.active = false;
        setTimeout(function(){ extcFail(); }, 200);
        return;
      }
      /* ★ 换内核重播同一条 URL —— 「第 1 级兜底」（v2.7）
         判据来自 TVBoxOS 的 switchLivePlayerAndReplay（LivePlayActivity.java:2327-2343）：
         **「这个解码器解不了」≠「这条线路不通」**。换内核比换线路便宜得多
         （不用回接口重取 token、不用重新测速），而且能救回那些**线路本身完全正常**、
         只是 ExoPlayer 解不了的频道。第 2 级才是 nextLine（软解也失败时才会走到）。 */
      if(NATIVE.active && !NATIVE.probing){
        toast("硬解失败，换软解重播同一条线路", {type:"warn"});
        NATIVE.active = false;
        /* ★ 只把**这一条**线路记成「硬解不可用」（v2.7 收窄粒度）：
           以前是频道级 dead —— 线路 1 硬解失败后，本频道后续所有线路都直走软解，
           等于让一条坏线路连坐了本来原生能播的线路。 */
        NATIVE.deadIdx[cur.idx] = true;
        setTimeout(function(){ playSoft(cur.idx); }, 200);
      }
    }
  }catch(e){}
};

/* ==================== 起播看门狗（v2.6，借鉴 TVBoxOS） ====================
   问题（已记录在案）：挂起型线路会一直停在 CONNECTING / BUFFERING，我们过去
   没有任何东西在计时，只能干等 ExoPlayer 的 readTimeout(15s) —— 三条线路
   逐条等满，换台兜底整链可超 90s（e2e 步骤预算都被迫放宽到 150s）。

   TVBoxOS 的做法（LivePlayActivity.java:2266-2360）是把「等多久」的决策权
   从网络层收回到播放器状态机：进入 PREPARING/BUFFERING 起算
   (LIVE_CONNECT_TIMEOUT+1)*5s，到点不问原因直接换源。

   我们的等价实现：playIdx 起播前起一个定时器，出首帧（原生 ready/size、
   <video> playing、官网页 playing）就撤掉；到点还没出帧 → nextLine()。
   超时值跟「秒开 / 稳定」档联动：秒开 10s（激进换线，和 TVBoxOS 默认一致），
   稳定 15s（弱网多给一点耐心）。只在原生/软解路径上布防，官网网页线路
   有自己的页面看门狗与注入脚本兜底，不重复布置避免双跳。 */
function startWatchMs(){ return (TUNE === "stable") ? 15000 : 10000; }
function clearStartWatch(){ if(__startWatchT){ clearTimeout(__startWatchT); __startWatchT = null; } }
function armStartWatch(){
  clearStartWatch();
  NATIVE.firstFrame = false;
  __startWatchT = setTimeout(function(){
    __startWatchT = null;
    if(__sessionClosed) return;                      /* 已退出播放层：不折腾 */
    if(NATIVE.firstFrame) return;                    /* 竞态兜底：已经出帧了 */
    var n = (cur.urls || []).length;
    toast("线路"+(cur.idx+1)+"起播超时"+(n>1 ? "，切换下一条" : ""), {type:"warn"});
    nextLine(true);                                  /* 不看位置、不等 readTimeout（原因已报） */
  }, startWatchMs());
}
/* 出首帧了 —— 撤看门狗，并把「连续自动跳台」计数清零（能起播就说明源没问题） */
function markFirstFrame(){
  NATIVE.firstFrame = true; clearStartWatch(); __autoHopN = 0; hideStatus();
  /* ★ v2.10.15 直连缓存：首帧确认 → 撤快速回退定时器 + 给缓存续命 */
  if(EXTC.trying){
    EXTC.trying = false; clearTimeout(EXTC.t); EXTC.t = null; EXTC.webUrl = "";
    try{ extCacheTouch(cur.id, cur.idx); }catch(e){}
  }
}

/* 原生看护：定期读播放器统计，长时间零推进判定为卡死 → 切下一条线路。
   ★ 只管「起播之后」（v2.6）：起播阶段 pos 一直是 0，如果不加 firstFrame 闸门，
   这里会在第 8 秒就换线，把 10s 的起播看门狗永远挡在后面 —— 两个机制会互相抢。
   分工：起播没出帧 = armStartWatch 的事（10/15s，到点不问原因）；
        起播之后零推进 = 这里的事（8s）。 */
function bindNativeWatch(){
  clearInterval(NATIVE.timer);
  NATIVE.timer = setInterval(function(){
    if(!NATIVE.active) return;
    try{
      var raw = NativeTV.nativeStats ? NativeTV.nativeStats() : "{}";
      var s = (typeof raw === "string") ? JSON.parse(raw) : raw;
      NATIVE.lastStats = s;      /* ★ 缓存给底栏角标复用（v2.8，避免重复阻塞调用） */
      /* 位置长时间不动 → 判卡死。
         ★ 判据用「变化量的绝对值」而不是「只认前进」（v2.7 修）：
         直播流的 position 是相对当前 window 算的，playlist 滑动时**会往回跳**。
         实测（tools/_probe_hls_live.py，窗口只有 3 个分片）看到 pos 从 17220
         回绕到 13206 —— 旧判据 `pos > lastPos + 200` 会把它当成「零推进」，
         于是明明画面在动，8 秒后却被卡顿看护判死、弹出「卡顿，切换下一条」。
         有动静就是有动静，往前跳和往后跳都算。 */
      if(typeof s.pos === "number" && s.pos >= 0){
        if(Math.abs(s.pos - NATIVE.lastPos) > 200){
          NATIVE.lastPos = s.pos; NATIVE.stallN = 0; NATIVE.stallT = Date.now();
        } else if(NATIVE.firstFrame && Date.now() - NATIVE.stallT > 8000){
          toast("线路"+(cur.idx+1)+"卡顿，切换下一条", {type:"warn"});
          NATIVE.stallN = 0; NATIVE.stallT = Date.now();
          nextLine();
        }
      }
    }catch(e){}
  }, 2500);
}

/* ==================== 播放信息角标（v2.8，借鉴 TVBoxOS） ====================
   TVBoxOS 有 LIVE_SHOW_NET_SPEED / LIVE_SHOW_RESOLUTION / LIVE_SHOW_TIME 三个
   开关（HawkConfig.java:15-59），我们一直有 stats() 却没接到 UI 上 —— 这里补一个
   底栏小角标，让用户能一眼看出「现在这条线路是几路／清不清晰／缓冲够不够」。

   三态循环（点击角标切换，存 localStorage，重启仍生效）：
     0 关：只留一个很淡的 ⓘ 入口（否则关掉就再也点不开了）
     1 简：1080P · 硬解
     2 详：1920×1080 · 硬解 · ↓2.4M · 缓冲4.1s
   ★ 帧率只在源里声明了 FRAME-RATE 时才显示（国内 IPTV 源多数没声明，
     media3 报 Format.NO_VALUE=-1）→ 此时退化为「硬解 / 软解」标记：
     对用户更有用（软解 = 这条线路在烧 CPU，卡顿时能一眼看出根因）。

   数据来源分两路 —— **不新增阻塞调用**：
     · 原生硬解：复用 bindNativeWatch 每 2.5s 已经取回的 stats（NATIVE.lastStats），
       角标只读缓存。若在这里自己再调一次 nativeStats()，就会叠加一次
       CountDownLatch(最多 300ms) 的同步等待，白白把 WebView 主线程卡住。
     · 软解（mpegts.js）：直接读 <video> 的 videoWidth/videoHeight/buffered（非阻塞）。
     ⚠ 官网网页线路看不到这个角标 —— 那条路是 WebView 直接导航到官方页面
       （NativeTV.openPage），我们自己的播放层 UI 已经不在页面上。
   颜色：正常灰白；缓冲 <1s 或播放器不在播放状态 → 金色提醒（只是让人一眼看出快撑不住）。 */
var STATS_MODE = 1;   /* 0 关 / 1 简 / 2 详 */
try{ var _sm = parseInt(localStorage.getItem("tv_stats"), 10); if(_sm >= 0 && _sm <= 2) STATS_MODE = _sm; }catch(e){}
var __statT = null;

function cycleStatsMode(){
  STATS_MODE = (STATS_MODE + 1) % 3;
  try{ localStorage.setItem("tv_stats", String(STATS_MODE)); }catch(e){}
  toast(STATS_MODE === 0 ? "已关闭播放信息角标"
      : STATS_MODE === 1 ? "播放信息：简（分辨率 · 帧率）"
                         : "播放信息：详细（分辨率 · 帧率 · 带宽 · 缓冲）", {type:"ok"});
  updateStatBadge();
}
function fmtRes(w, h){
  var short = Math.min(w, h);
  if(w >= 3800 || short >= 2100) return "4K";
  if(w >= 1900 || short >= 1000) return "1080P";
  if(w >= 1200 || short >= 700)  return "720P";
  if(w >= 800)                   return "480P";
  return w + "×" + h;
}
function fmtBw(bps){
  if(bps >= 1000000) return (bps / 1000000).toFixed(1) + "M";
  return Math.round(bps / 1000) + "k";
}
function updateStatBadge(){
  var b = $("statBadge"); if(!b) return;
  if(STATS_MODE === 0){ b.className = "statbadge off"; b.textContent = "ⓘ"; return; }
  var w = 0, h = 0, fps = 0, bw = 0, buf = -1, playing = false, hw = -1;
  if(NATIVE.active && NATIVE.lastStats){
    var s = NATIVE.lastStats;
    w = s.w || 0; h = s.h || 0; bw = s.bw || 0;
    /* ★ fps 要过滤 Format.NO_VALUE(-1)：国内 IPTV 的 HLS 多数不在
       #EXT-X-STREAM-INF 里声明 FRAME-RATE，media3 就报 -1.0 —— 直接格式化
       会显示成「-1fps」（实测踩到）。同理码率 br 也常是 -1，所以不作展示。 */
    fps = Math.round(s.fps || 0); if(!(fps > 0)) fps = 0;
    if(typeof s.hw === "number") hw = s.hw;
    if(typeof s.bufferedMs === "number" && s.bufferedMs >= 0) buf = s.bufferedMs;
    playing = !!s.playing;
  } else {
    var v = $("v");
    if(v && v.videoWidth){
      w = v.videoWidth; h = v.videoHeight;
      try{
        var bf = v.buffered;
        if(bf && bf.length) buf = Math.max(0, Math.round((bf.end(bf.length - 1) - v.currentTime) * 1000));
      }catch(e){}
      playing = !v.paused;
    }
  }
  /* 还没拿到视频尺寸（刚起播 / 只有音频）：给个「…」占位，别显示半截信息 */
  if(!w || !h){ b.className = "statbadge"; b.textContent = "…"; return; }
  /* fps 拿不到时（很常见）改显示「硬解 / 软解」—— 对用户比一个空缺更有用：
     软解意味着这条线路在烧 CPU，卡顿/发热时能一眼看出根因。 */
  var tail = fps ? (fps + "fps") : (hw === 1 ? "硬解" : (hw === 0 ? "软解" : ""));
  var seg = [];
  if(STATS_MODE === 2){
    seg.push(w + "×" + h);
    if(tail) seg.push(tail);
    if(bw > 0) seg.push("↓" + fmtBw(bw));
    if(buf >= 0) seg.push("缓冲" + (buf / 1000).toFixed(1) + "s");
  } else {
    seg.push(fmtRes(w, h));
    if(tail) seg.push(tail);
  }
  b.textContent = seg.join(" · ");
  b.className = "statbadge" + (((buf >= 0 && buf < 1000) || !playing) ? " warn" : "");
}
function startStatWatch(){
  stopStatWatch();
  updateStatBadge();
  __statT = setInterval(updateStatBadge, 2000);
}
function stopStatWatch(){
  if(__statT){ clearInterval(__statT); __statT = null; }
  var b = $("statBadge"); if(b) b.className = "statbadge off";
}

/* 开始原生播放；返回 false 表示原生通道不可用（调用方回落软解） */
function playNative(url, headers){
  if(!NATIVE.ok || !window.NativeTV || !NativeTV.nativePlay) return false;
  try{
    NATIVE.active = true; NATIVE.probing = true; NATIVE.lastUrl = url;
    NATIVE.frozen = false; clearTimeout(__freezeT);   /* 播放器接管了画面层，保帧状态结束 */
    NATIVE.lastPos = 0; NATIVE.stallN = 0; NATIVE.stallT = Date.now();
    try{ document.documentElement.classList.add("native-on"); document.body.classList.add("native-on"); }catch(e){}
    setFrameOn();   /* 保帧模式下 frame-on 已由 showPlayerLayer 加过；这里再兜一次 */
    /* ★ headers（v2.9）：官网源提取到的直链要带 Referer/Cookie → 走 nativePlayExt
       （全量重建播放器，请求头在构建 DataSource 时设死）。
       本机源 / 官网源里的裸直链依旧走 nativePlay —— 老路径零改动。 */
    var r;
    if(headers && window.NativeTV.nativePlayExt){
      r = NativeTV.nativePlayExt(url, (typeof headers === "string") ? headers : JSON.stringify(headers));
    } else {
      r = NativeTV.nativePlay(url);
    }
    /* 切线路时用 nativeSwitch（保播放器实例，避免黑屏）；首次播放用 nativePlay */
    setStatus("连接线路"+(cur.idx+1)+"…", true);
    bindNativeWatch();
    NATIVE.probing = false;
    return (r === undefined) ? true : !!r;
  }catch(e){
    NATIVE.active = false; return false;
  }
}
function nativeSwitch(url){
  if(!NATIVE.active || !window.NativeTV || !NativeTV.nativeSwitch) return false;
  try{
    NATIVE.lastUrl = url; NATIVE.lastPos = 0; NATIVE.stallT = Date.now();
    NativeTV.nativeSwitch(url);
    setStatus("连接线路"+(cur.idx+1)+"…", true);
    return true;
  }catch(e){ return false; }
}
function nativeStop(){
  NATIVE.active = false;
  NATIVE.frozen = false;
  clearInterval(NATIVE.timer);
  clearTimeout(__freezeT);
  try{ document.documentElement.classList.remove("native-on"); document.body.classList.remove("native-on"); }catch(e){}
  clearFrameOn();
  try{ if(window.NativeTV && NativeTV.nativeStop) NativeTV.nativeStop(); }catch(e){}
  /* 注意：这里不能调 pauseWebMedia！nativeStop 也被 playSoft/playWebLine
     当「切线路/切源前清理」用，web.onPause() 会把 WebView 的网络/媒体管线
     挂起，后续线路的拉流全部卡死（实测 12 个频道连败的教训）。
     真正退出播放层（closePlayer）才需要停 WebView 媒体。 */
}

/* ==================== 无缝换台：画面层保帧（v2.5.1） ====================
   问题（实测）：BACK 退出播放层时 nativeStop 会把 TextureView 一起摘掉，
   而 MainActivity 的 WebView 是 setBackgroundColor(TRANSPARENT)、根视图是黑的 ——
   于是「BACK → 点另一个频道」中间要一直黑到新流首帧（_probe_seam.py 亮度采样）。

   做法：退出播放层改成 nativeFreeze() —— Java 侧先把最后一帧抓成 Bitmap
   钉在画面层与 WebView 之间，再释放播放器；下次 openChannel 时
   showPlayerLayer() 会把 WebView 转透明（frame-on），这一帧立刻透出来，
   状态行叠在它上面说「正在解析线路…」，新流 onRenderedFirstFrame 时才撤掉
   —— 全程没有黑屏。

   为什么不直接保留 TextureView：实测 release() 会把纹理内容一起清空
   （揭帧后整屏亮度 0.0），光留着 view 是白留。详见 FrozenFrame.java。

   代价：内存里多一张 Bitmap（本机 640x360，<1MB）。所以停在列表超过
   3 分钟就自动收掉（__freezeT）。 */

/* 退出播放层（保帧版）：返回「是否真的留住了画面层」 */
function nativeFreeze(){
  NATIVE.active = false;
  clearInterval(NATIVE.timer);
  clearTimeout(__freezeT);
  clearStartWatch();               /* 已退出播放层：起播看门狗必须撤，否则它会在列表上换线 */
  stopStatWatch();                 /* 角标同理：退出播放层就停刷新（v2.8） */
  /* 先撤透明类：把 WebView 变回不透明，列表才看得到（保帧画面就藏到后面去了） */
  try{ document.documentElement.classList.remove("native-on"); document.body.classList.remove("native-on"); }catch(e){}
  clearFrameOn();
  var kept = false;
  try{ if(window.NativeTV && NativeTV.nativeFreeze) kept = !!NativeTV.nativeFreeze(); }catch(e){}
  NATIVE.frozen = kept;
  if(kept){
    __freezeT = setTimeout(function(){
      /* 停在列表太久（3 分钟）→ 把保帧也收掉，别一直占着一张 Bitmap。
         用 nativeStop 收尾：此时 ExoPlayer 已经是 null，只剩 detach/回收是有效的。 */
      if(NATIVE.frozen && !$("player").classList.contains("show")){
        try{ if(window.NativeTV && NativeTV.nativeStop) NativeTV.nativeStop(); }catch(e){}
        NATIVE.frozen = false;
      }
    }, 180000);
  }
}

/* ---------- 设备分级：决定软解缓冲策略 ---------- */
/* 1080p@2.4Mbps FLV 软解对低端机压力大，按设备能力给不同参数 */
var TIER = (function(){
  try{
    var mem = navigator.deviceMemory || 4;           /* GB，Chrome/WebView 支持 */
    var hc  = navigator.hardwareConcurrency || 4;    /* 逻辑核数 */
    var px  = Math.max(screen.width, screen.height);
    /* 低端：小内存 或 少核 或 低分辨率屏 */
    if(mem <= 2 || hc <= 4 || px <= 1280) return "low";
    if(mem >= 6 && hc >= 8) return "high";
    return "mid";
  }catch(e){ return "mid"; }
})();

/* ---------- 播放档位：秒开 / 稳定 ----------
   fast（默认）：原生起播门槛 700ms —— 开台体感最快；软解沿用设备分级原参数。
   stable      ：原生起播门槛 1500ms + 更大缓冲；软解同步加倍 stash、放宽追帧阈值，
                 弱网 / 移动网络下更不容易卡。
   原生侧由 NativeTV.setTuneProfile 透传（Java 写进 SharedPreferences，重启仍生效）。 */
var TUNE = "fast";
try{ TUNE = localStorage.getItem("tv_tune") || "fast"; }catch(e){}
function applyTuneToNative(){
  try{ if(window.NativeTV && NativeTV.setTuneProfile) NativeTV.setTuneProfile(TUNE); }catch(e){}
}
function syncTuneUI(){
  var b=$("btnTune"); if(!b) return;
  var fast = (TUNE !== "stable");
  b.querySelector(".ic").textContent = fast ? "⚡" : "🛡";
  b.querySelector(".lb").textContent = fast ? "秒开" : "稳定";
}
function setTune(m){
  TUNE = (m === "stable") ? "stable" : "fast";
  try{ localStorage.setItem("tv_tune", TUNE); }catch(e){}
  applyTuneToNative(); syncTuneUI();
  toast(TUNE === "fast" ? "已切到「秒开」：起播更快、缓冲更浅"
                        : "已切到「稳定」：缓冲更大、弱网更少卡顿", {type:"ok"});
}

/* 按设备分级生成软解基础配置 —— 核心是别让缓冲区无限堆积、别用 Worker 反拖主线程 */
function baseMpegtsCfg(){
  if(TIER === "low"){
    /* 低端：关 Worker（避免线程切换开销与内存翻倍），延迟加载，浅缓冲，激进追帧 */
    return {enableWorker:false,
            lazyLoad:true, stashInitialSize:256,
            liveBufferLatencyChasing:true, liveBufferLatencyMaxLatency:1.2,
            liveBufferLatencyMinRemain:0.4,
            autoCleanupSourceBuffer:true, autoCleanupMaxBackwardDuration:14,
            autoCleanupMinBackwardDuration:8};
  }
  if(TIER === "high"){
    /* 高端：Worker 解封装不卡 UI，中等缓冲换取顺滑 */
    return {enableWorker:true,
            lazyLoad:true, stashInitialSize:512,
            liveBufferLatencyChasing:true, liveBufferLatencyMaxLatency:2.5,
            liveBufferLatencyMinRemain:0.8,
            autoCleanupSourceBuffer:true, autoCleanupMaxBackwardDuration:24,
            autoCleanupMinBackwardDuration:12};
  }
  /* 中端：Worker + 适中缓冲 */
  return {enableWorker:true,
          lazyLoad:true, stashInitialSize:384,
          liveBufferLatencyChasing:true, liveBufferLatencyMaxLatency:1.8,
          liveBufferLatencyMinRemain:0.6,
          autoCleanupSourceBuffer:true, autoCleanupMaxBackwardDuration:18,
          autoCleanupMinBackwardDuration:10};
}

/* 在设备分级之上再叠一层「播放档位」：稳定档加倍缓冲、放宽追帧阈值 */
function mpegtsCfg(){
  var c = baseMpegtsCfg();
  if(TUNE === "stable"){
    c.stashInitialSize = (c.stashInitialSize || 384) * 2;
    c.liveBufferLatencyMaxLatency = (c.liveBufferLatencyMaxLatency || 1.8) * 1.5;
    c.liveBufferLatencyMinRemain  = (c.liveBufferLatencyMinRemain  || 0.6) * 1.5;
  }
  return c;
}

function playIdx(i){
  /* ★ 会话闸门（兜底）：本函数是所有「点开频道 → 起播」异步链的汇聚点。
     请求/测速在途时用户按 BACK 的话，回调仍可能排到这里 —— 一旦放行，
     resumeWebMedia + 起播会在用户已经退回列表之后把声音拉起来。
     各调用点（nextLine / playSoft / playWebLine / openChannel.then）都已经
     各自查过闸门，这里是最后一道，防止以后新增异步调用点时漏掉。 */
  if(__sessionClosed) return;
  clearSniffCut();     /* ★ 换线路：撤掉上一条线路的「提取优选切换」延时器（v2.9） */
  extcAbort();         /* ★ v2.10.15：上一台若还在直连缓存尝试，静默终止（新起播接管） */
  cur.idx=i; setLineUI();
  var url=cur.urls[i]; if(!url) return;
  /* 起播前恢复 WebView 媒体处理（closePlayer 时被 pauseWebMedia 暂停过） */
  try{ if(window.NativeTV && NativeTV.resumeWebMedia) NativeTV.resumeWebMedia(); }catch(e){}
  /* ★ 官网源的网页线路：不是流地址，交给原生 WebView 打开官方直播页自己播
     （和 WebViewTV 同策略 —— CCTV 这类官网用 WASM+MSE，解出来的地址谁也用不了） */
  if(cur.tid==="wvt" && !WVTCore.isDirect(url)){ playWebLine(url, i); return; }
  /* ★ 起播看门狗（v2.6）：从这里起算，见 armStartWatch 的说明。
     放在官网网页线路之后 —— 那条路走页面自己的看门狗，不重复布防。 */
  armStartWatch();
  /* ★ 优先原生硬解。原生已在播 → 只换源（nativeSwitch）；否则尝试起播。
     两条路都失败才回落 mpegts 软解。
     ★ NATIVE.deadIdx[i]：**这条线路**硬解已失败过 → 直接软解、不再试原生。
     粒度是「线路」而不是「频道」（v2.7）：换到下一条线路时重新获得一次原生机会。
     用频道级 dead 时，一条坏线路会把整个频道后续所有线路都拖成软解 ——
     多线路频道上，用户会看到「明明别的线路硬解能播，却一直是软解」的莫名降级。 */
  if(NATIVE.ok && !NATIVE.deadIdx[i]){
    var ok = NATIVE.active ? nativeSwitch(url) : playNative(url);
    if(ok){
      /* 原生通道接管：把网页 <video> 彻底停掉，避免两路同时解码抢资源 */
      try{ if(player){ player.destroy(); player=null; } }catch(e){}
      var v0=$("v"); try{ v0.pause(); v0.removeAttribute("src"); v0.load(); }catch(e){}
      return;
    }
  }
  playSoft(i);
}

/* ==================== 老内核检测（v2.10.17） ====================
   2017 年前的 TV 盒子（Android 7.1.1 + 老安全补丁）系统 WebView 常冻结在
   Chrome 52~60 时代：MSE（MediaSource，网页播视频的基石）WebView 要
   Chrome 53+ 才默认开启，WebAssembly 要 57+。央视网这类直播页一检测
   到就自己弹「浏览器不支持视频播放」，页面根本不会起播 —— 我们的
   提取链（嗅探 m3u8）也完全没机会跑。这类设备上官网线路注定全挂，
   与其让用户看 60s 静默换线 + 一句「官网线路均不可用」，不如一开始
   就说清原因、给出可行的补救（装新 WebView / 改看本机源）。 */
var CORE = { old:false, why:"" };
(function(){
  try{
    if(!window.MediaSource || !window.SourceBuffer){
      CORE.old = true; CORE.why = "缺 MSE 网页视频能力";
    } else if(typeof WebAssembly === "undefined"){
      CORE.old = true; CORE.why = "缺 WebAssembly";
    }
  }catch(e){ CORE.old = true; CORE.why = "内核特性检测异常"; }
})();
window.__coreInfo = function(){
  return JSON.stringify({old:CORE.old, why:CORE.why, ua:navigator.userAgent});
};

/* ==================== 直链缓存直连（v2.10.15） ====================
   网页线路起播 10-20s 的大头是「打开官方页→站点自己的重页面+广告脚本→软解出画」。
   而提取链（SNIFF）成功后拿到的直链其实还能用很久（白名单站点 token 一般 30min+）。
   做法：playSniffed 切原生成功时把 {频道,线路→直链+headers} 存进 localStorage；
   下次再播同一台·同一条线路，先直接让 ExoPlayer 放缓存直链（1-3s 起播），
   4.5s 内没出首帧或报 error → 删缓存、自动回退原网页链路。全程零 Java 改动。
   ★ 只对 SNIFF_SAFE 白名单域生效（与优选切换同一份安全名单，央视系加扰流进不来）。 */
var EXTC = { trying:false, t:null, key:"", webUrl:"" };
function extCacheAll(){
  try{ return JSON.parse(localStorage.getItem("tv_ext_cache") || "{}"); }catch(e){ return {}; }
}
function extCacheSave(all){
  try{ localStorage.setItem("tv_ext_cache", JSON.stringify(all)); }catch(e){}
}
function extCachePut(chId, i, j){
  try{
    if(!j || !j.url) return;
    var all = extCacheAll();
    all["ext|"+chId+"|"+i] = { u: j.url, h: j.headers || {}, t: Date.now() };
    var ks = Object.keys(all);
    if(ks.length > 12){                       /* 上限 12 条，LRU 淘汰 */
      ks.sort(function(a,b){ return (all[a].t||0) - (all[b].t||0); });
      while(ks.length > 12) delete all[ks.shift()];
    }
    extCacheSave(all);
  }catch(e){}
}
function extCacheGet(chId, i){
  try{
    var e = extCacheAll()["ext|"+chId+"|"+i];
    if(!e || !e.u) return null;
    if(Date.now() - e.t > 1800000) return null;   /* TTL 30min：token 过期由失败淘汰兜底 */
    return e;
  }catch(e2){ return null; }
}
function extCacheDel(chId, i){
  try{ var all = extCacheAll(); delete all["ext|"+chId+"|"+i]; extCacheSave(all); }catch(e){}
}
function extCacheTouch(chId, i){
  try{ var all = extCacheAll(), e = all["ext|"+chId+"|"+i];
       if(e){ e.t = Date.now(); extCacheSave(all); } }catch(e){}
}
/* 直连失败/换台清理：删缓存 + 回退原网页链路（playWebLine 自带 __sessionClosed 闸门） */
function extcFail(){
  if(!EXTC.trying) return;
  EXTC.trying = false;
  clearTimeout(EXTC.t); EXTC.t = null;
  clearStartWatch();                 /* 网页链路走页面自己的看门狗，原生起播看门狗必须撤 */
  try{ extCacheDel(cur.id, cur.idx); }catch(e){}
  var wu = EXTC.webUrl; EXTC.webUrl = "";
  if(__sessionClosed || !wu) return;
  playWebLine(wu, cur.idx);
}
/* 换台/换线/关播时静默复位直连尝试（不删缓存、不回退）——新的起播马上接管 */
function extcAbort(){
  if(!EXTC.trying) return;
  EXTC.trying = false;
  clearTimeout(EXTC.t); EXTC.t = null;
  EXTC.webUrl = "";
  clearStartWatch();
}

/* ★ v2.10.16 页面预热：同频道其余官方线路的域名提前握手（DNS+TCP+TLS）。
   全 App 的 WebView 共用同一套 Chromium 网络栈，这里一次 favicon 级的 <img>
   请求就把握手缓存暖好，之后 openPage 打开这条线路时省 0.5-1.5s。
   · 只暖白名单域（与优选切换同一份名单），绝不对陌生站点乱发请求；
   · favicon 404 也没关系 —— 握手已经完成，目的就达到了；
   · fire-and-forget，onload/onerror 都吞掉，失败静默。 */
function preconnOtherLines(curUrl){
  try{
    if(!cur.urls || cur.urls.length < 2) return;
    var seen = {};
    for(var k=0;k<cur.urls.length && k<5;k++){
      var u = cur.urls[k];
      if(!u || u === curUrl) continue;
      var m = String(u).match(/^(https?:)\/\/([^\/?#]+)/i);
      if(!m) continue;
      var host = m[2].toLowerCase();
      if(seen[host]) continue;
      seen[host] = 1;
      if(!sniffIsSafe(host)) continue;
      var img = new Image();
      img.onload = img.onerror = function(){};
      img.src = m[1] + "//" + host + "/favicon.ico";
    }
  }catch(e){}
}

/* 官网源 · 网页线路：让原生开一个全屏 WebView 加载官方页面并注入取流脚本 */
function playWebLine(url, i){
  if(__sessionClosed) return;    /* 同 playSoft：挡住卸载后的延时重连 */
  /* ★ v2.10.17 老内核一次性提示：别让用户在黑屏换线里猜原因 */
  if(CORE.old && !window.__coreWarned){
    window.__coreWarned = true;
    toast("本机 WebView 内核过旧（"+CORE.why+"），官网线路可能放不了；建议升级系统 WebView 或改看本机源", {type:"info"});
  }
  /* ★ v2.10.15 直链缓存直连：这台·这条线路 30min 内提取成功过 → 跳过整个官方页，
     直接原生放缓存直链。失败由 extcFail 回退到这里再走网页（缓存已删）。 */
  if(window.NativeTV && NativeTV.nativePlayExt && SNIFF.on){
    var ec = extCacheGet(cur.id, i);
    if(ec && sniffIsSafe(ec.u)){
      nativeStop();
      if(player){ try{player.destroy();}catch(e){} player=null; }
      var ve=$("v"); try{ ve.pause(); ve.removeAttribute("src"); ve.load(); }catch(e){}
      if(webState !== 2) webState = 1;
      window.__userExit = false;
      EXTC.trying = true; EXTC.key = cur.id+"|"+i; EXTC.webUrl = url;
      setStatus("正在连接…（直连缓存）", true);
      armStartWatch();
      EXTC.t = setTimeout(function(){       /* 快速回退：网页链路至少还要再花 8s，别陪它等满 10s */
        if(__sessionClosed || !EXTC.trying) return;
        if(NATIVE.firstFrame) return;       /* 竞态兜底：首帧刚到 */
        if((cur.id+"|"+cur.idx) !== EXTC.key) return;   /* 已换台：旧尝试作废 */
        toast("直连缓存失效，改走官方页…", {type:"info"});
        extcFail();
      }, 4500);
      if(playNative(ec.u, ec.h || {})) return;
      /* playNative 本身失败（桥不可用等）：清状态走原网页流程 */
      EXTC.trying = false; clearTimeout(EXTC.t); EXTC.t = null;
      clearStartWatch();
    }
  }
  nativeStop();
  if(player){ try{player.destroy();}catch(e){} player=null; }
  var v=$("v"); try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
  if(window.NativeTV && NativeTV.openPage){
    var ad = WVTCore.matchAdapter(url, WVT.adapters) || WVTCore.defaultAdapter();
    var extra = (cur.extra && cur.extra[i]) || "";
    if(webState !== 2) webState = 1;         /* 2 = 正在自动切线路，保留原状态 */
    window.__userExit = false;               /* ★ 新开一页：清掉上一轮的「用户退出」标志 */
    $("webmask").classList.add("show");
    /* ★ v2.10.8：状态页统一接管加载期视觉（z500 盖住 webmask）——
       频道号 + 频道名 + 渐进状态行，黑底无转圈海报。webmask 留着是
       桌面端/无原生页环境的兜底，安卓端永远被 status 盖在上面。 */
    setStatus("正在打开官方直播页…（第"+(i+1)+"条线路）", true);
    $("webmaskTxt").textContent = "正在打开官方直播页…（第"+(i+1)+"条线路）";
    preconnOtherLines(url);                  /* ★ 顺带把其余线路的域名握手暖上 */
    try{ NativeTV.openPage(url, JSON.stringify(ad), extra); }
    catch(e){
      $("webmask").classList.remove("show");
      setStatus(null);
      showErrCard({ title:"无法打开官方页面", reason:String(e),
        btns:[{label:"换一条线路", primary:true, fn:function(){ nextLine(); }},
              {label:"换频道", fn:closePlayer}] });
    }
    return;
  }
  setStatus(null);
  showErrCard({ title:"当前环境不支持官网页面播放", desc:"该线路需要在原生 WebView 里打开官方直播页",
    btns:[{label:"换一条线路", primary:true, fn:function(){ nextLine(); }},
          {label:"换频道", fn:closePlayer}] });
}

/* 原生页面层回调（由 MainActivity 调用）
   webState: 0=空闲  1=网页线路播放中  2=正在自动切下一条线路  3=官网线路全部失败 */
var webState = 0;

/* ==================== 官网页流地址提取（v2.9） ====================
   原生在官方页 WebView 上拦截到 *.m3u8 / *.mpd 后会后台探测「是否明文可播」，
   结论通过 __onSniffResult 送到这里。两种用法：

     · 优选（默认，仅限实测干净的白名单域名）：探测通过 1s 后切到原生硬解。
       官网页用 WASM+MSE 软解，盒子/低端机 CPU 吃满；原生硬解几乎不占 CPU。
     · 兜底（始终启用）：这条网页线路起播失败时，若已有可播的提取地址就直接原生播
       —— 不必再重载一遍官网页（桌面端要为这一步冷启动浏览器，30s+）。

   ★ 为什么只对白名单域名做优选：央视系是 TS 载荷**私有加扰**（路径带 cdrm）——
     探测会「通过」（无 EXT-X-KEY、分片首字节也是 0x47），但原生播出来全是花屏；
     而花屏是**静默的**（播放器不报错也不报错码），没法自动回退。
     白名单 = tools/_probe_wvt_hitrate.py 15 站抽样实测「嗅到就能干净播」的域名。
     详见 官网源m3u8提取实测.md。
   ★ 关闭：localStorage.setItem("tv_sniff","0") 后重启（或运行时 __sniffOff()）。 */
var SNIFF = {
  on: true,
  last: null,      /* 最近一次提取结果 {ok,url,kind,reason,page,headers} */
  cutT: null,      /* 优选切换的延时定时器 */
  cutFor: ""       /* 已因提取切换过的流地址（同一条不重复切） */
};
try{ if(localStorage.getItem("tv_sniff") === "0") SNIFF.on = false; }catch(e){}
window.__sniffOff = function(){ SNIFF.on = false; try{ localStorage.setItem("tv_sniff","0"); }catch(e){} return "off"; };
window.__sniffOn  = function(){ SNIFF.on = true;  try{ localStorage.setItem("tv_sniff","1"); }catch(e){} return "on"; };

/* 实测「嗅到就能干净可播」的域名（无 EXT-X-KEY、TS 分片干净、mpv 150 帧零解码错误） */
var SNIFF_SAFE = ["m.gdtv.cn","itouchtv.cn","nmtv.cn","hntv.tv","sxrtv.com",
                  "jlntv.cn","jstv.com","cztv.com","kankanews.com","mgtv.com",
                  "guangdianyun.tv"];
function sniffIsSafe(u){
  u = String(u || "").toLowerCase();
  for(var i=0;i<SNIFF_SAFE.length;i++){ if(u.indexOf(SNIFF_SAFE[i]) >= 0) return true; }
  return false;
}
function clearSniffCut(){
  if(typeof SNIFF === "undefined" || !SNIFF || !SNIFF.cutT) return;
  clearTimeout(SNIFF.cutT); SNIFF.cutT = null;
}

/* 安排「优选切换」（幂等：可被 __onSniffResult / __onWebPageReady / __onWebPagePlaying
   反复调用）。
   ★ 为什么要三条路都调：m3u8 请求与「页面加载完成」的先后是不确定的 ——
     有的站点边加载边拉流，提取结果会在 webState 还是 0 时到达；若只在
     __onSniffResult 里判 webState===1，这条线路就永远等不到优选。 */
function maybeArmSniffCut(){
  if(!SNIFF.on) return;
  var j = SNIFF.last;
  if(!j || !j.ok || !j.url) return;
  if(NATIVE.active || webState !== 1) return;
  var mine = cur.urls && cur.urls[cur.idx];
  if(j.page && mine && j.page !== mine) return;
  if(SNIFF.cutFor === j.url) return;
  if(!sniffIsSafe(j.url)) return;               /* 非白名单域只做兜底，不主动切 */
  clearSniffCut();
  /* ★ v2.10.16 优选切换 3s → 1s：等待窗口存在的意义是「让探测结论再稳一稳」，
     但 SniffProbe 的 PROBE-OK 本身已经做完了「下载首个分片 + 校验 TS/fMP4
     明文容器字节」的强验证（见 SniffProbe.java），拿到 ok 结论后不需要再陪
     网页跑 3 秒。早切 2s 意味着用户早 2s 看到硬解画面；万一原生起播失败，
     armStartWatch 看门狗（10s）兜底换线，与原路径殊途同归。 */
  SNIFF.cutT = setTimeout(function(){
    SNIFF.cutT = null;
    if(__sessionClosed || webState !== 1 || NATIVE.active) return;
    if(!SNIFF.last || !SNIFF.last.ok) return;
    var m2 = cur.urls && cur.urls[cur.idx];
    if(SNIFF.last.page && m2 && SNIFF.last.page !== m2) return;
    playSniffed();
  }, 1000);
}

/* 原生提取结论回调（由 MainActivity.pushSniffResult 调用） */
window.__onSniffResult = function(j){
  if(!j || typeof j !== "object") return;
  SNIFF.last = j;
  if(!SNIFF.on || !j.ok || !j.url) return;      /* 判定不可播：保持网页播放，什么都不做 */
  /* 只认「当前这条线路」的结果：换线后 page 对不上就作废 */
  var mine = cur.urls && cur.urls[cur.idx];
  if(j.page && mine && j.page !== mine) return;
  maybeArmSniffCut();
};

/* 用提取到的地址起原生硬解（带 Referer/Cookie），并关掉官网页层。
   ★ 走 nativePlayExt（全量重建播放器）——请求头是构建 DataSource 时设死的，
     不能用 nativeSwitch（复用实例改不了头）。
   ★ 起不来由 armStartWatch 看门狗兜底换线（原生首帧信号会撤它）。 */
function playSniffed(){
  var j = SNIFF.last;
  if(!j || !j.ok || !j.url) return false;
  if(__sessionClosed) return false;
  if(!window.NativeTV || !NativeTV.nativePlayExt) return false;
  SNIFF.cutFor = j.url;
  clearSniffCut();
  /* 关官网页层：hidePage 内部延迟 150ms 才拆 pageView —— 用 __sniffCut
     告诉 __onWebPageClosed「这是切换，不是用户退出」，别把播放层收了。 */
  window.__sniffCut = true;
  try{ if(window.NativeTV && NativeTV.closePage) NativeTV.closePage(); }catch(e){}
  setTimeout(function(){
    window.__sniffCut = false;
    if(__sessionClosed) return;
    nativeStop();
    if(player){ try{player.destroy();}catch(e){} player=null; }
    var v=$("v"); try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
    armStartWatch();
    if(playNative(j.url, j.headers || {})){
      toast("官网线路已切原生硬解", {type:"info"});
      /* ★ v2.10.15 直链缓存直连：这台·这条线路的直链记下来，下次直接原生播（1-3s） */
      try{ extCachePut(cur.id, cur.idx, j); }catch(e){}
    }
  }, 320);      /* > hidePage 的 150ms，等 pageView 真拆完再起原生 */
  return true;
}

/* 调试用：tvlab 探针读提取状态 */
window.__sniffState = function(){
  return JSON.stringify({on:SNIFF.on, cutFor:SNIFF.cutFor, nativeActive:NATIVE.active,
                         webState:webState, last:SNIFF.last});
};

window.__onWebPageClosed = function(){
  $("webmask").classList.remove("show");
  /* ★ 提取切换（v2.9）：关页面是「切原生」的内部动作，不是用户退出 —— 播放层要留着 */
  if(window.__sniffCut){ window.__sniffCut = false; return; }
  /* ★ v2.10.2：openChannel 里拆旧官方页（closePage）触发的关页回调 ——
     换台内部动作，播放层要留着（否则本机源频道点下去 150ms 后被弹回旧列表） */
  if(window.__pageSwap){ window.__pageSwap = false; return; }
  /* ★ webState===2 是「正在自动切下一条官网线路」——此时关页面是内部动作，
     不能顺手把播放层也收了（否则换线过程被自己打断）。
     但用户主动按返回时（原生先置 __userExit=true）必须退到底：
     实测 CCTV 这类多线路频道，前两条线路失败后 webState 停在 2，
     用户按 BACK 只关掉官方页、播放层却留着，得再按一次 —— 那次就直接
     退出 App 了，正是用户反馈的「再按返回直接退出软件」。 */
  if(webState === 2 && !window.__userExit) return;
  window.__userExit = false;
  var allFailed = (webState === 3);
  webState = 0;
  /* ★ 官网线路全部失败：保留播放层，把「失败卡」摆给用户自己选下一步
     （换线重试 / 回列表），比直接弹回列表 + 一句 toast 有用得多。 */
  if(allFailed){ showWebDeadCard(); return; }
  /* ★ 从官方页面退出来 → 回频道列表。
     不能停在这里：本机播放器这会儿是没有源的，留在播放层只会看到一个
     「大播放按钮」占位画面，用户以为死机了。 */
  closePlayer();
};
/* 官网线路全挂的失败卡（被 __onWebPageClosed 与 __onWebPageFailed 共用） */
function showWebDeadCard(){
  setStatus(null);
  var whyOld = CORE.old ?
    "。本机 WebView 内核过旧（"+CORE.why+"），官方页面自己会拒绝播放 ——\n" +
    "建议给盒子安装新版「Android System WebView」（Android 7.1 最高可装 109+ 内核）后重试，或改看「本机源」频道（不走浏览器）" : "";
  var opts = {
    title: "官网线路均不可用",
    reason: window.__lastReason || "",
    desc: "已尝试全部 " + cur.urls.length + " 条官网线路" + whyOld,
    btns: [
      { label:"重新尝试", primary:true, fn:function(){
          delete LINE_CACHE[cur.tid+"/"+cur.id];
          window.__lastReason = ""; cur.idx = 0; playIdx(0);
      }},
      { label:"换频道", fn:closePlayer }
    ]
  };
  var hop = hopOpts();                                /* 同 nextLine：能跳下一个频道就跳 */
  for(var k in hop){ if(hop.hasOwnProperty(k)) opts[k] = hop[k]; }
  showErrCard(opts);
}
window.__onWebPageReady = function(){
  /* ★ 文档加载完 ≠ 起播。官网页的播放器还要拉流、起 MSE。
     v2.10.8：pageView 起播前压黑（原生侧），用户看的是 #status 频道信息页 ——
     这里把状态行推进一格，让等待过程有清晰的阶段感。 */
  if(webState === 0) webState = 1;
  setStatus("页面已就绪，正在拉起播放…", true);
  maybeArmSniffCut();     /* v2.9：提取结果可能早于本回调到达，这里补一次布防 */
};
window.__onWebPagePlaying = function(){
  /* ★ v2.10.8：换台拆页竞态守卫 —— closePage 延迟 150ms 才拆旧官方页，
     这期间旧页的注入 tick 还在报 playing，会把刚亮出来的状态页 hideStatus()
     掉（实测换台后只见 webmask 转圈、频道号不显示）。换台标记期内直接早退。 */
  if(window.__pageSwap){ return; }
  webState = 1;
  window.__lastReason = "";
  markFirstFrame();                 /* 官网页起播也算出首帧：撤看门狗 + 清自动跳台计数 */
  $("webmask").classList.remove("show");
  hideErrCard();
  hideStatus();
  maybeArmSniffCut();     /* v2.9：真起播了，安排优选切换 */
};
/* 注入脚本判定这条线路起不来（站点提示了原因，或迟迟没有画面）：自动换下一条。
   多数频道有多条官网线路（CCTV 一般是 官网页 / 央视频 / 央视新闻页 三条），
   某条被「VIP 专享」「播出安排变更」之类的站点限制挡住时，换一条往往就能看。
   reason 是站点提示文本，展示出来让用户知道为什么，而不是黑屏干等。 */
window.__onWebPageFailed = function(reason){
  var why = reason ? ("（"+reason+"）") : "";
  window.__lastReason = reason || "";
  /* ★ 提取兜底（v2.9）：官网页这条线路起不来，但原生已经嗅到并探测通过一条明文直链 ——
     直接原生播，比「再开一遍官网页」快得多（桌面端这一步要冷启动浏览器 30s+）。
     只在结果对得上「当前这条线路」时用，避免拿上一条线路的流去播。 */
  if(SNIFF.on && SNIFF.last && SNIFF.last.ok && !NATIVE.active){
    var m = cur.urls && cur.urls[cur.idx];
    if(!SNIFF.last.page || !m || SNIFF.last.page === m){
      if(playSniffed()){
        toast("官网页起不来，改用提取到的直链" + why, {type:"warn"});
        return;
      }
    }
  }
  if(cur.idx+1 < cur.urls.length){
    webState = 2;
    toast("第"+(cur.idx+1)+"条线路无法播放"+why+"，自动切换", {type:"warn"});
    $("webmask").classList.add("show");
    setStatus(reason ? "这条线路不支持：换下一条…" : "正在尝试第"+(cur.idx+2)+"条线路…", true);
    $("webmaskTxt").textContent = reason ? reason+"，换下一条…" : "正在尝试第"+(cur.idx+2)+"条线路…";
    playIdx(cur.idx+1);            /* 复用同一个 WebView 换地址，不拆页面 */
  } else {
    webState = 3;
    $("webmask").classList.remove("show");
    try{ if(window.NativeTV && NativeTV.closePage) NativeTV.closePage(); }catch(e){}
    /* closePage 正常会回调 __onWebPageClosed 去摆失败卡；万一没有页面可关
       （例如 WebView 已经没了），兜个底，别让用户面对一片黑。 */
    setTimeout(function(){ if(!$("errCard").classList.contains("show")) showWebDeadCard(); }, 420);
  }
};

/* 软解兜底：mpegts.js（原 playIdx 的逻辑） */
function playSoft(i){
  /* ★ 会话已关闭（退出播放/切后台卸载）时挡住 —— 特别是 __onNativeState
     ("error") 里那个 setTimeout(playSoft,200)：HOME 卸载后才到期的定时器
     会在这里把软解重新拉起来，后台续响就是这么来的（实测真凶）。 */
  if(__sessionClosed) return;
  cur.idx=i; setLineUI();
  var url=cur.urls[i]; if(!url) return;
  nativeStop();
  if(player){ try{player.destroy();}catch(e){} player=null; }
  var v=$("v"); try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
  /* ★ 低端机限制解码输出尺寸：1080p 源缩到屏幕尺寸渲染，显著降低 GPU/合成压力 */
  try{
    var PX = Math.max(screen.width, screen.height);
    if(TIER === "low" && PX <= 1280){
      v.setAttribute("width", Math.round(PX));
      v.style.maxWidth = PX + "px";
    } else {
      v.removeAttribute("width"); v.style.maxWidth = "";
    }
  }catch(e){}
  setStatus("连接线路"+(i+1)+"…", true);
  if(!window.mpegts || !mpegts.getFeatureList().mseLivePlayback){
    setStatus(null);
    showErrCard({ title:"设备不支持软解播放", desc:"当前设备缺少 MSE 能力，无法播放 FLV 直播",
      btns:[{label:"换频道", primary:true, fn:closePlayer}] });
    return;
  }
  try{
    player=mpegts.createPlayer({type:"flv", isLive:true, url:url, cors:true}, mpegtsCfg());
  }catch(e){ nextLine(); return; }
  v.onplaying=function(){ stall.n=0; stall.t=Date.now(); hideStatus(); markFirstFrame(); };
  v.onended=function(){ nextLine(); };
  v.onerror=function(){ nextLine(); };
  bindStallWatch(v);
  player.on(mpegts.Events.ERROR, function(){ nextLine(); });
  player.attachMediaElement(v);
  try{ player.load(); v.play(); }catch(e){ nextLine(); }
}

/* 播放中卡顿看护：统计 waiting 次数，短时间密集卡顿 → 判定线路不稳，自动切下一条 */
var stall = {n:0, t:0, timer:null};
function bindStallWatch(v){
  stall.n=0; stall.t=Date.now();
  v.onwaiting = function(){
    stall.n++;
    if(stall.n>=4 && Date.now()-stall.t < 5000){
      toast("线路"+(cur.idx+1)+"卡顿，切换下一条", {type:"warn"});
      clearTimeout(stall.timer);
      stall.timer=setTimeout(function(){ nextLine(); }, 300);
    }
  };
}
/* ==================== 全源失败 → 自动换下一个频道（v2.6） ====================
   借鉴 TVBoxOS `mConnectTimeoutChangeSourceRun` 的第三级：本频道的源全试完
   → 取下一个频道继续播（LivePlayActivity.java:2351-2358）。

   为什么：这是无广告直播 App，用户多半是拿遥控器在刷台 —— 对直播来说
   「换台」常常比「重试同一个」更符合直觉（用户就是想看点什么）。所以失败卡
   保留，但加一行「8 秒后自动换下一个频道」的倒计时，按钮随时能接管。

   防雪崩：整源挂掉时（网络断、源站全灭）不能把列表从一个频道刷到另一个
   一直刷穿 —— 连续自动跳台超过 MAX_AUTO_HOP 次仍没起来就停手，把失败卡
   留给用户自己决定。计数在「出首帧」和「用户按返回」时清零。 */
function nextChannelTarget(){
  try{
    var arr = (window.RENDER && RENDER.arr) || [];
    for(var k=0;k<arr.length;k++){
      var cid = arr[k].tid || curCat;
      if(cid === cur.tid && arr[k].id === cur.id) return (k+1 < arr.length) ? arr[k+1] : null;
    }
  }catch(e){}
  return null;   /* 不在当前列表里 / 已经是最后一个 */
}
function autoNextChannel(){
  if(__autoHopN >= MAX_AUTO_HOP) return false;
  var n = nextChannelTarget();
  if(!n) return false;
  __autoHopN++;
  openChannel(n.tid || curCat, n.id, n.name);
  return true;
}
/* 失败卡的自动跳台参数：没有下一个频道、或已经跳太多次 → 不显示倒计时 */
function hopOpts(){
  var n = (__autoHopN < MAX_AUTO_HOP) ? nextChannelTarget() : null;
  return n ? { retrySec: 8, retryLabel: "自动换下一个频道", onRetry: autoNextChannel }
           : {};
}

function nextLine(silent){
  /* ★ 会话已关闭（退出播放/切后台卸载）时，mpegts 的 error/ended 回调
     还可能排队触发到这里 —— 必须挡住，否则后台又把线路拉起来续响。 */
  if(__sessionClosed) return;
  var i = cur.idx;
  if(i+1 < cur.urls.length){
    /* silent：调用方（起播看门狗）已经报过原因了，别叠两条 toast */
    if(!silent) toast("线路"+(i+1)+"失败，切换下一条", {type:"warn"});
    playIdx(i+1);
    return;
  }
  /* ★ 全部线路都试过了 → 给一张可操作的失败卡，而不是留一行冷文字。
     用户此刻要的是「下一步怎么办」：重试 / 手动挑线路 / 换个频道。 */
  setStatus(null);
  var opts = {
    title: cur.tid==="wvt" ? "官网线路均不可用" : "该频道暂时无法播放",
    reason: window.__lastReason || "",
    desc: "已尝试全部 " + cur.urls.length + " 条线路",
    btns: [
      { label:"重试", primary:true, fn:function(){
          delete LINE_CACHE[cur.tid+"/"+cur.id];      /* 清掉选路缓存，重新测速 */
          window.__lastReason = "";
          playIdx(0);
      }},
      { label:"手动选线路", fn:openLinePanel },
      { label:"换频道", fn:closePlayer }
    ]
  };
  var hop = hopOpts();                                /* 有下一个频道就给 8s 自动跳台倒计时 */
  for(var k in hop){ if(hop.hasOwnProperty(k)) opts[k] = hop[k]; }
  showErrCard(opts);
}
function closePlayer(){
  __sessionClosed = true;       /* ★ 挡住卸载引发的自动重连（同 __appPause） */
  clearTimeout(stall.timer);
  clearStartWatch();            /* ★ 起播看门狗：退出播放层就不该再计时换线 */
  clearSniffCut();              /* ★ 提取优选切换的延时器（v2.9） */
  extcAbort();                  /* ★ v2.10.15：直连缓存尝试随会话一起终止 */
  stopStatWatch();              /* ★ 播放信息角标：退出播放层停止刷新（v2.8） */
  __autoHopN = 0;               /* 自动跳台计数复位（下次开台重新开始数） */
  if(player){ try{player.destroy();}catch(e){} player=null; }
  /* ★ 保帧版释放：不摘画面层，最后一帧留在 TextureView 上给下次开台用 */
  var kept = nativeFreeze();
  /* ★ 真正退出播放层：强制停 WebView 内部媒体。实测（Chromium 91）
     v.pause()+load() 之后 OpenSL ES 播放器仍出声（audio_flinger active
     不归零），只有 web.onPause() 能真正停。恢复由下次 playIdx 起播时
     resumeWebMedia() 触发。切线路/换台不走这里（nativeStop），不影响拉流。
     ★ 停的时机（v2.5.1 新增）：web.onPause() 连「渲染」一起停，
     而 WebView 背景是透明的 —— 如果刚撤掉 native-on 就立刻停渲染，
     屏幕上留下的就是下层保帧画面，「返回后还看到视频」的旧 bug 会复活。
     所以保帧成功时必须等浏览器把不透明的列表真正画上屏（两帧）再停。 */
  var stopWebMedia = function(){
    __mediaPauseGuardUntil = Date.now() + 4000;   /* ★ 见 visibilitychange 处的闸门说明 */
    try{ if(window.NativeTV && NativeTV.pauseWebMedia) NativeTV.pauseWebMedia(); }catch(e){}
  };
  if(kept){
    requestAnimationFrame(function(){ requestAnimationFrame(stopWebMedia); });
  } else {
    stopWebMedia();
  }
  /* ★ 400ms 后把渲染恢复回来：媒体此刻已彻底清空（nativeFreeze + 下面
     v.pause/load），恢复渲染不会复活声音，但能让列表动画/滚动恢复正常。 */
  setTimeout(function(){
    try{ if(window.NativeTV && NativeTV.resumeWebMedia) NativeTV.resumeWebMedia(); }catch(e){}
    try{ window.dispatchEvent(new Event("resize")); }catch(e){}
  }, 400);
  webState = 0;
  /* ★ status 已移出 #player 到 body 层（z600），不再随 player 隐藏而消失，
     退出播放时必须主动收掉，否则回到列表页后会残留状态页。 */
  hideStatus();
  window.__lastReason = "";
  hideErrCard();
  try{ if(window.NativeTV && NativeTV.closePage) NativeTV.closePage(); }catch(e){}
  $("webmask").classList.remove("show");
  var v=$("v"); try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
  /* ★ v2.10.6：旧列表页已删除 —— 「退出播放」没有列表可回，播放层保留
     （保帧画面垫底），直接唤出频道列表浮层让用户换台；退出 App 走 BACK 确认卡 */
  $("player").classList.remove("fs");
  closeLinePanel();
  $("epg").classList.remove("show");
  openChOv();
}
function toggleFs(){
  var v=$("v");
  /* 优先走原生横屏（安卓手机竖屏时 WebView 全屏 API 不会旋转屏幕，视频仍很小）。
     原生桥由 MainActivity 注入，window.NativeTV.setLandscape(true) 会
     真正 setRequestedOrientation(SENSOR_LANDSCAPE) 并隐藏系统栏。 */
  if(window.NativeTV && NativeTV.setLandscape){
    var toFs = !isFsMode();
    setFsMode(toFs);
    return;
  }
  /* 桌面 / 其它环境：走标准全屏 API */
  if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  else { (v.requestFullscreen||v.webkitRequestFullscreen||v.webkitEnterFullscreen).call(v); }
}

/* ---------- 全屏状态管理（原生 + 网页双通道） ----------
   竖屏手机点全屏 → 原生旋转成横屏 + 视频铺满整屏；
   再点一次 → 转回竖屏 + 恢复「上视频下控制条」布局。 */
function isFsMode(){ return $("player").classList.contains("fs"); }

function setFsMode(on){
  var p=$("player"), btn=$("btnFs");
  if(on){
    p.classList.add("fs");
    if(btn){ btn.querySelector(".ic").textContent="⛶"; btn.querySelector(".lb").textContent="退出全屏"; }
    try{ if(window.NativeTV && NativeTV.setLandscape) NativeTV.setLandscape(true); }catch(e){}
    /* 部分设备原生旋转有延迟，兜底再触发一次 resize 让视频重排 */
    setTimeout(function(){ try{ window.dispatchEvent(new Event("resize")); }catch(e){} }, 260);
  }else{
    p.classList.remove("fs");
    if(btn){ btn.querySelector(".ic").textContent="⛶"; btn.querySelector(".lb").textContent="全屏"; }
    try{ if(window.NativeTV && NativeTV.setLandscape) NativeTV.setLandscape(false); }catch(e){}
    setTimeout(function(){ try{ window.dispatchEvent(new Event("resize")); }catch(e){} }, 260);
  }
  hideCtrlLater();
}
function resetCtrlTimer(){
  clearTimeout(ctrlTimer);
  ctrlTimer=setTimeout(function(){
    var p=$("player");
    if(p.classList.contains("show") && !$("epg").classList.contains("show") && !$("linePanel").classList.contains("show")){
      $("ctrl").classList.add("hide");
      if($("ctrl").contains(document.activeElement)){ try{ $("v").focus(); }catch(e){} }
    }
  }, 6000);
}
/* 点一下屏幕唤出控制条，6 秒无操作自动隐藏 */
function hideCtrlLater(){
  $("ctrl").classList.remove("hide");
  resetCtrlTimer();
}

/* ---------- 触屏手势（手机，电视家风格）----------
   · 单击屏幕：唤出/收起控制条（★ 绑定在 #player 整层，原生模式下 #vwrap 隐藏也能响应）
   · 双击屏幕：进/出全屏
   · 左半边上下滑：调亮度；右半边上下滑：调音量（带手势指示）
   判定：click 的坐标与 target 都可靠（touch 的 clientX 在 WebView 常为 NaN）。 */
var touchState = { x:0, y:0, mode:null, timer:null, lastTap:0, lastPointer:0, moved:false,
                   lp:false, lpT:null, lpUsed:false };   /* lp=长按已确认 lpUsed=长按滑动已消费(v2.10) */
function bindTouchGestures(){
  var wrap=$("player");
  function inCtrl(t){ return t && t.closest && (t.closest("#ctrl")||t.closest(".ctlbtn")||t.closest(".line-item")); }
  function inOv(t){ return t && t.closest && (t.closest(".ov")); }

  /* 单击 / 双击判定（click + pointerup 兜底） */
  function onTap(e){
    if(inCtrl(e.target)) return;
    /* v2.10.9：原生单击唤浮层的手势，同一次 click 不再切控制条 */
    if(Date.now() - (window.__nativeTapAt||0) < 400) return;
    /* v2.10：浮层开着时不在这里处理 —— 点击交给 .ov 自己的 click listener
       （频道项 onclick 换台 / 空白处关闭）。★ 不能在这里 closeAllOv：
       pointerup 先把浮层 display:none 的话，后续 click 落不到频道项上，
       「点浮层里的频道换台」就整个失灵（实测踩到）。 */
    if(anyOvOpen()) return;
    if(inOv(e.target)) return;
    /* v2.10：长按滑动唤出过浮层的手势，收手时不当作单击 */
    if(touchState.lpUsed || touchState.lp){ touchState.lp=false; touchState.lpUsed=false; return; }
    var now=Date.now();
    if(now-touchState.lastTap < 320){          /* 双击 → 全屏 */
      clearTimeout(touchState.timer); touchState.lastTap=0;
      toggleFs();
    }else{
      touchState.lastTap=now;
      clearTimeout(touchState.timer);
      touchState.timer=setTimeout(function(){    /* 单击 → 切换控制条 */
        if($("linePanel").classList.contains("show") || $("epg").classList.contains("show")){
          closeLinePanel(); $("epg").classList.remove("show");
        } else {
          var c=$("ctrl");
          if(c.classList.contains("hide")) hideCtrlLater(); else c.classList.add("hide");
        }
      }, 320);
    }
  }
  wrap.addEventListener("pointerup", function(e){
    touchState.lastPointer = Date.now();
    onTap(e);
  });
  wrap.addEventListener("click", function(e){
    if(Date.now() - touchState.lastPointer < 350) return;   /* pointerup 已处理 */
    onTap(e);
  });

  /* 亮度/音量手势：触摸移动跟踪 */
  wrap.addEventListener("touchstart", function(e){
    if(e.touches.length!==1) return;
    if(inCtrl(e.target)) return;
    if(anyOvOpen()) return;                       /* 浮层开着：里面的滚动交给自己 */
    touchState.x=e.touches[0].clientX; touchState.y=e.touches[0].clientY;
    touchState.mode=null; touchState.moved=false;
    touchState.lp=false; touchState.lpUsed=false;
    touchState.startX=touchState.x; touchState.startY=touchState.y;
    /* v2.10 长按判定：按住 450ms 不动 → 进入「长按待滑」状态，
       之后水平滑 >40px 往右开频道列表 / 往左开设置 */
    clearTimeout(touchState.lpT);
    var sx=touchState.startX, sy=touchState.startY;
    touchState.lpT=setTimeout(function(){
      if(touchState.mode) return;                 /* 已进入亮度/音量手势 */
      touchState.lp=true;
      showGestureInd("📡", "← 列表 · 设置 →", 0.5);   /* 轻提示（700ms 自隐） */
    }, 450);
  });
  wrap.addEventListener("touchmove", function(e){
    if(e.touches.length!==1 || !touchState.startX) return;
    var x=e.touches[0].clientX, y=e.touches[0].clientY;
    var dx=x-touchState.startX, dy=y-touchState.startY;
    /* v2.10：长按确认后水平滑 → 唤出浮层（先于亮度/音量手势判定） */
    if(touchState.lp && !touchState.lpUsed){
      if(Math.abs(dx) > 40){
        touchState.lpUsed=true; clearTimeout(touchState.lpT); hideGestureInd();
        if(dx>0){ openChOv(); } else { openSetOv(); }
        e.preventDefault(); return;
      }
      /* 长按后竖向滑走了 → 取消长按，仍可走亮度/音量 */
      if(Math.abs(dy) > 40){ touchState.lp=false; clearTimeout(touchState.lpT); hideGestureInd(); }
      e.preventDefault(); return;
    }
    if(Math.abs(dy) < 14 && Math.abs(dx) < 14) return;
    if(!touchState.mode){
      /* 只认竖向滑（亮度/音量）。横向滑动保留给长按浮层手势 ——
         旧代码这里有个 mode="seek" 分支，但后面从没有处理它的代码，
         是死代码，还只在长按手势起手阶段帮倒忙（v2.10 删除）。 */
      if(Math.abs(dy) > Math.abs(dx)){
        touchState.mode = (touchState.startX < window.innerWidth/2) ? "bright" : "vol";
      }
    }
    touchState.moved = true;
    if(touchState.mode==="bright") adjustBrightness(-dy/200);
    else if(touchState.mode==="vol") adjustVolume(-dy/200);
    e.preventDefault();
  });
  wrap.addEventListener("touchend", function(){
    clearTimeout(touchState.lpT);
    if(touchState.lp && !touchState.lpUsed) hideGestureInd();   /* 长按但没滑走 */
    if(touchState.mode || touchState.lp) hideGestureInd();
    touchState.mode=null; touchState.lp=false; touchState.startX=0;
  });
}

/* 亮度/音量手势：调系统亮度（需原生桥）或音量 */
var brightLevel = 0.5, volLevel = 0.5;
function adjustBrightness(delta){
  brightLevel = Math.max(0.05, Math.min(1, brightLevel + delta));
  try{ if(window.NativeTV && NativeTV.setBrightness) NativeTV.setBrightness(brightLevel); }catch(e){}
  showGestureInd("🔆", Math.round(brightLevel*100)+"%", brightLevel);
}
function adjustVolume(delta){
  volLevel = Math.max(0, Math.min(1, volLevel + delta));
  try{ if(window.NativeTV && NativeTV.setVolume) NativeTV.setVolume(volLevel); }catch(e){}
  showGestureInd("🔊", Math.round(volLevel*100)+"%", volLevel);
}
function showGestureInd(icon, val, frac){
  $("gIcon").textContent=icon; $("gVal").textContent=val;
  $("gBar").style.width=Math.round(frac*100)+"%";
  $("gestureInd").classList.add("show");
  clearTimeout(touchState.gTimer);
  touchState.gTimer=setTimeout(hideGestureInd, 700);
}
function hideGestureInd(){ $("gestureInd").classList.remove("show"); }

/* ---------- 列表渲染 ----------
   ★ 分块渲染：官网源一个分组可以有几百个频道（全源 904 个），一次性建 DOM
     在手机端有明显卡顿与内存占用。策略 = 首屏先出几十条，滚动/焦点接近末尾
     再追加下一块；首 10 条做 stagger 入场，其余不做（全做反而卡）。 */
var RENDER = { arr:[], n:0, chunk:48, io:null };

/* ★ v2.10.6：旧列表页渲染代码（skeleton/renderChannels/appendChunk/observeMore/
   ensureRenderedFor）随 DOM 一起删除。RENDER 数组保留 —— 自动跳台（nextChannelTarget）
   与遥控器切台仍然需要「当前频道列表」这一数据；由 loadCat / pickGroup /
   renderChOvChs 负责填充。 */

/* 本机源分类（含收藏）。官网源不走这里，见 setSrc → loadWvt */
function loadCat(tid){
  /* v2.10.6：只维护数据（allChans / RENDER.arr），渲染交给 chOv 浮层 */
  curCat=tid;
  if(tid==="fav"){ allChans=favArr().slice(); RENDER.arr=allChans; return; }
  C.fetchChannels(tid).then(function(arr){
    allChans=arr||[];
    if(srcMode!=="wvt" && curCat===tid) RENDER.arr=allChans;
  }).catch(function(){});
}

/* ---------- 官网源：加载 / 分组 / 渲染 ---------- */
function applyWvt(res){
  var chans=res.channels||[];
  if(!chans.length) throw new Error("无频道数据");
  WVT.chans=chans; WVT.adapters=res.adapters||[];
  /* 央视频付费频道标记（限免/VIP）：快照里 pid->tag 的静态表，纯字典查询零开销 */
  var TAGS=(window.WVT_SNAPSHOT && window.WVT_SNAPSHOT.tags)||{};
  var groups=[], byId={}, byGroup={}, flat=[], i;
  for(i=0;i<chans.length;i++){
    var c=chans[i], key=c.name, k=1;
    while(byId[key]){ k++; key=c.name+"#"+k; }        /* 同名频道加后缀区分 */
    var tag="";
    if(c.tag==="vip"||c.tag==="mianfei"){ tag=c.tag; }
    else{
      var us=c.urls||[];
      for(var j=0;j<us.length;j++){
        var mu=/yangshipin\.cn\/tv\/home\?pid=(\d+)/.exec((us[j]&&us[j].url)||"");
        if(mu&&TAGS[mu[1]]){ tag=TAGS[mu[1]]; break; }
      }
    }
    byId[key]={ id:key, name:c.name, group:c.group, urls:c.urls||[], tag:tag };
    flat.push({ id:key, name:c.name, group:c.group, tid:"wvt", tag:tag });
    if(groups.indexOf(c.group)<0){ groups.push(c.group); byGroup[c.group]=[]; }
    byGroup[c.group].push(key);
  }
  WVT.byId=byId; WVT.byGroup=byGroup; WVT.groups=groups; WVT.list=flat; WVT.ready=true;
  if(groups.indexOf(WVT.cur)<0) WVT.cur = (groups.indexOf("央视")>=0) ? "央视" : groups[0];
  pickGroup(WVT.cur);
  return chans.length;
}

function loadWvt(){
  if(WVT.ready){ pickGroup(WVT.cur); return; }
  if(WVT.loading) return;
  WVT.loading=true;
  WVTCore.load({refresh:true}).then(function(res){
    var n=applyWvt(res);
    WVT.loading=false;
    console.log("[WVT] "+n+" 个频道 / "+WVT.groups.length+" 个分组，来源="+res.from);
    autoStartFirst();       /* ★ v2.10：频道表就绪 → 自动起播上次/第一个频道 */
    /* 用的是缓存/内置快照 -> 后台静默拉一次最新的，变了就刷新列表 */
    if(res.from!=="network"){
      WVTCore.refresh().then(function(r2){
        if(!r2 || !r2.channels) return;
        if(r2.channels.length!==WVT.chans.length){
          toast("官网源已更新");
          applyWvt(r2);
        }
      }).catch(function(e){ console.log("[WVT] 后台刷新失败: "+e); });
    }
  }).catch(function(e){
    WVT.loading=false;
    toast("官网源加载失败："+e, {type:"warn"});
  });
}

function pickGroup(g){
  WVT.cur=g; curCat="wvt";
  var ids=(WVT.byGroup && WVT.byGroup[g]) || [];
  allChans=ids.map(function(id){ return { id:id, name:WVT.byId[id].name, tid:"wvt" }; });
  RENDER.arr=allChans;
}

/* ==========================================================================
 * v2.10 半透明浮层：频道列表 / 设置（WebView电视风格）
 *   打开 App → 自动起播上次/第一个频道，全程全屏播放为主界面。
 *   长按屏幕中间往右滑 = 频道列表浮层；往左滑 = 设置浮层。
 *   浮层只是「盖」在画面上（z-index 高于 #ctrl），播放不中断；
 *   BACK 优先关浮层（MainActivity 注入 JS 先问 __overlayBack）。
 * ========================================================================*/
function ovOpen(which){
  return which==="ch" ? $("chOv").classList.contains("show")
                      : $("setOv").classList.contains("show");
}
function anyOvOpen(){ return ovOpen("ch") || ovOpen("set"); }
function closeChOv(){ $("chOv").classList.remove("show"); }
function closeSetOv(){ $("setOv").classList.remove("show"); }
function closeAllOv(){
  var was = anyOvOpen();
  clearTimeout(__ovAutoT); __ovAutoT=null;
  closeChOv(); closeSetOv();
  /* 官网页层（pageView）为浮层让位时被藏了 -> 关浮层恢复它 */
  if(was){ try{ if(window.NativeTV && NativeTV.setPageOverlay) NativeTV.setPageOverlay(false); }catch(e){} }
}
/* 借鉴 WebTvLive：浮层 12 秒无操作自动关闭（播放不中断，随时可再唤出） */
var __ovAutoT=null;
function ovAutoKeep(){
  clearTimeout(__ovAutoT);
  if(anyOvOpen()) __ovAutoT=setTimeout(closeAllOv, 12000);
}

/* BACK 优先级（由 MainActivity 的注入 JS 调用）：返回 '1' 表示已消费 */
window.__overlayBack = function(){
  if(anyOvOpen()){ closeAllOv(); return "1"; }
  return "0";
};

/* 浮层空白处点击 = 关闭（频道项/设置项的 onclick 在 target 阶段先执行，
   冒泡到这里时已处理完，重复 closeAllOv 无害）。
   __ovGuardUntil：原生长按手势唤出浮层后的防误触窗 —— 同一手势抬起产生的
   click 落在浮层空白处，不设窗的话浮层刚打开就被这个 click 关掉（实测踩到）。 */
function ovClickClose(e){
  if(Date.now() < (window.__ovGuardUntil||0)) return;
  if(e.target.closest && (e.target.closest(".chi") || e.target.closest(".cat") || e.target.closest(".opt") || e.target.closest(".sec") || e.target.closest(".sopt"))) return;
  closeAllOv();
}
try{ $("chOv").addEventListener("click", ovClickClose); $("setOv").addEventListener("click", ovClickClose); }catch(e){}

/* ---------- v2.10.9 原生单击唤浮层的落点判定 ----------
   原生 dispatchTouchEvent 短按抬起时问这里：「这一点会不会点在可交互 UI 上？」
   命中控制条 / 确认卡 / 线路面板 / 节目单 / 浮层本身 → 返回 false 不唤浮层
   （浮层是 alpha0.35 的 pageView 在最上层，一旦弹出这些 UI 就点不到了）。
   坐标是原生物理像素，要按 devicePixelRatio 换算成 CSS 像素。 */
window.__nativeTapOverlay = function(px, py){
  try{
    var dpr = window.devicePixelRatio || 1;
    var el = document.elementFromPoint(px / dpr, py / dpr);
    if(!el) return true;                     /* 视频区空白 → 唤 */
    if(inCtrl(el) || inOv(el)) return false; /* 控制条 / 浮层 */
    if(el.closest && el.closest("#errCard,#linePanel,#epg")) return false; /* 确认卡/面板 */
    return true;
  }catch(e){ return true; }
};

/* TV：BACK = 确认退出卡（用户定稿）。由 MainActivity doBack 的 TV 分支调用，
   返回 '1' 表示已消费（浮层关闭 / 确认卡已弹）。 */
window.__tvBack = function(){
  if(anyOvOpen()){ closeAllOv(); return "1"; }
  if($("player").classList.contains("show")){
    /* ★ 确认卡画在主 WebView 里，官方页 pageView 盖在上面会把它挡住 ——
       弹卡前先藏官方页，「继续观看」时恢复（实测踩到：卡弹了但看不见）。 */
    try{ if(window.NativeTV && NativeTV.setPageOverlay) NativeTV.setPageOverlay(true); }catch(e){}
    showErrCard({ title:"确定退出纯净电视？", desc:"退出后将停止播放",
      btns:[{label:"退 出", primary:true, fn:function(){ try{ NativeTV.exitApp(); }catch(e){} }},
            {label:"继续观看", fn:function(){ try{ if(window.NativeTV && NativeTV.setPageOverlay) NativeTV.setPageOverlay(false); }catch(e){} }}] });
    return "1";
  }
  return "0";
};

/* ---------- 频道列表浮层：左分组 + 右编号频道，当前频道橙色高亮 ---------- */
var CHOV = { group:"", src:"" };   /* 浮层自己的分组视图（不动底层列表状态） */
function chOvGroups(){
  /* 返回 [源, 分组key, 显示名] 三元组（本机分类的 key 是 tid，显示名要查 CATS） */
  if(srcMode==="wvt" && WVT.ready && WVT.groups.length) return WVT.groups.map(function(g){ return ["wvt", g, g]; });
  var a=[["local","fav","⭐ 收藏"]]; CATS.forEach(function(c){ a.push(["local", c[0], c[1]]); });
  return a;
}
function chOvChans(src, key){  if(src==="wvt"){
    var ids=(WVT.byGroup && WVT.byGroup[key]) || [];
    return ids.map(function(id,i){ return { tid:"wvt", id:id, name:WVT.byId[id].name, no:i+1 }; });
  }
  if(key==="fav"){
    return favArr().map(function(f,i){ return { tid:f.tid, id:f.id, name:f.name, no:i+1 }; });
  }
  /* 本机分类：用已缓存的 allChans（当前分类一致时零开销），否则现拉 */
  if(curCat===key && allChans.length){
    return allChans.map(function(c,i){ return { tid:key, id:c.id, name:c.name, no:i+1 }; });
  }
  return null;   /* 交给异步 fetchChannels 回填 */
}
function renderChOvCats(){
  var w=$("chOvCats"); w.innerHTML="";
  chOvGroups().forEach(function(g){
    var on = (g[0]===CHOV.src && g[1]===CHOV.group);
    var d=document.createElement("div");
    d.className="cat"+(on?" on":"");
    d.textContent=g[2];
    d.tabIndex=0;
    d.onclick=function(){ CHOV.src=g[0]; CHOV.group=g[1]; renderChOvCats(); renderChOvChs(); ovAutoKeep(); };
    w.appendChild(d);
  });
}
function renderChOvChs(asyncArr){
  var w=$("chOvChs"); w.innerHTML="";
  var arr = asyncArr || chOvChans(CHOV.src, CHOV.group);
  if(!arr){
    w.innerHTML='<div class="chi"><span class="nm" style="color:var(--fg-mute)">加载中…</span></div>';
    if(srcMode!=="wvt"){
      /* ★ v2.10.10 修复「除综合外全在加载中」：浮层分组点击只更新 CHOV.group、
         不更新底层 curCat，而 fetch 回调原来无参调 renderChOvChs() → 内部
         chOvChans 再判 curCat===key 永远为假 → 返回 null → 再进异步 —— 死循环。
         现在回调显式构造频道数组传入渲染，并把 curCat 一并同步（换台兜底 tid
         与缓存命中条件随之一致）。 */
      var reqGroup = CHOV.group;
      C.fetchChannels(reqGroup).then(function(res){
        if(!ovOpen("ch") || CHOV.src!=="local" || CHOV.group!==reqGroup) return;
        allChans=res||[]; curCat=reqGroup;
        renderChOvChs((res||[]).map(function(c,i){ return { tid:reqGroup, id:c.id, name:c.name, no:i+1 }; }));
      }).catch(function(){ var b=$("chOvChs"); if(b) b.innerHTML=""; });
    }
    return;
  }
  arr.forEach(function(c){
    var on = (c.tid===cur.tid && String(c.id)===String(cur.id));
    var d=document.createElement("div");
    d.className="chi"+(on?" on":"");
    d.innerHTML='<span class="no"></span><span class="nm"></span>';
    d.tabIndex=0;
    d.dataset.cid=c.id; d.dataset.tid=c.tid;    /* 遥控器数字选台定位用 */
    d.querySelector(".no").textContent=String(c.no||"");
    d.querySelector(".nm").textContent=c.name;
    d.onclick=function(){ closeAllOv(); openChannel(c.tid, c.id, c.name); };
    w.appendChild(d);
  });
  RENDER.arr=arr;    /* 供 nextChannelTarget（自动跳台）与遥控器切台使用 */
  /* 当前频道滚进可视区并聚焦（TV 遥控器直接从这里开始按上下键） */
  var curEl=w.querySelector(".chi.on") || w.querySelector(".chi");
  if(curEl){
    if(IS_TV){ try{ curEl.focus(); }catch(e){} }
    if(curEl.scrollIntoView) try{ curEl.scrollIntoView({block:"center"}); }catch(e){ curEl.scrollIntoView(); }
  }
}
/* 浮层顶部源选择：官网源 / 本机源（旧列表页退役后的唯一源入口）。
   setSrc 同步全局状态（旧列表页在底层隐藏着，重建无感）；分组与频道列随之切换。 */
function renderChOvSrc(){
  var w=$("chOvSrc"); w.innerHTML="";
  SRC_TABS.forEach(function(t){
    var d=document.createElement("div");
    d.className="sopt"+(CHOV.src===t[0]?" on":"");
    d.textContent=t[1]; d.tabIndex=0;
    d.onclick=function(){
      if(CHOV.src===t[0]) return;
      CHOV.src=t[0];
      CHOV.group = (t[0]==="wvt") ? (WVT.cur||"央视") : (curCat==="fav"?"tv":curCat);
      try{ setSrc(t[0]); }catch(e){}
      renderChOvSrc(); renderChOvCats(); renderChOvChs();
    };
    w.appendChild(d);
  });
}
function openChOv(){
  if(ovOpen("ch")) return;                /* 已开着（原生手势会重复触发） */
  CHOV.src = (srcMode==="wvt" && WVT.ready) ? "wvt" : "local";
  CHOV.group = (CHOV.src==="wvt") ? WVT.cur : curCat;
  closeSetOv();
  $("chOv").classList.add("show");
  /* 官网页盖在浮层上面：临时藏掉（只停绘制，页面媒体继续跑） */
  try{ if(window.NativeTV && NativeTV.setPageOverlay) NativeTV.setPageOverlay(true); }catch(e){}
  renderChOvSrc(); renderChOvCats(); renderChOvChs();
  ovAutoKeep();
}

/* ---------- 设置浮层：右侧面板（源/比例/信息/时钟/网速） ---------- */
function openSetOv(){
  if(ovOpen("set")) return;
  closeChOv();
  renderSetPanel();
  $("setOv").classList.add("show");
  try{ if(window.NativeTV && NativeTV.setPageOverlay) NativeTV.setPageOverlay(true); }catch(e){}
  ovAutoKeep();
}
function renderSetPanel(){
  var p=$("setPanel"); p.innerHTML="";
  function sec(title){
    var s=document.createElement("div"); s.className="sec";
    var t=document.createElement("div"); t.className="t"; t.textContent=title;
    var o=document.createElement("div"); o.className="opts";
    s.appendChild(t); s.appendChild(o); p.appendChild(s); return o;
  }
  function opt(box, label, on, fn){
    var d=document.createElement("div"); d.className="opt"+(on?" on":"");
    d.textContent=label; d.tabIndex=0; d.onclick=function(){ fn(); renderSetPanel(); };
    box.appendChild(d); return d;
  }
  /* 视频源 */
  var srcBox=sec("视频源");
  SRC_TABS.forEach(function(t){
    opt(srcBox, t[1], srcMode===t[0], function(){
      if(srcMode!==t[0]){ closeAllOv(); setSrc(t[0]); }
    });
  });
  /* 画面比例（与 btnRatio 同一套 contain/cover/fill） */
  var ratios=[["contain","适应"],["cover","铺满"],["fill","拉伸"]];
  var ri=($("v").dataset.ri|0);
  var rBox=sec("画面比例");
  ratios.forEach(function(r,i){
    opt(rBox, r[1], i===ri, function(){
      $("v").dataset.ri=i; $("v").style.objectFit=r[0]; toast("画面比例："+r[1]);
    });
  });
  /* 播放信息：分辨率/码率（读 v2.8 的统计缓存，不额外打扰播放器） */
  var infoBox=sec("播放信息");
  var st = NATIVE.lastStats || {};
  var resTxt = (st.width && st.height) ? (st.width+"x"+st.height)
             : (($("v").videoWidth && $("v").videoHeight) ? $("v").videoWidth+"x"+$("v").videoHeight : "—");
  var brTxt = st.bandwidth ? Math.round(st.bandwidth/1000)+" kbps" : "—";
  var d1=document.createElement("div"); d1.className="opt"; d1.style.cursor="default";
  d1.textContent="尺寸 "+resTxt; infoBox.appendChild(d1);
  var d2=document.createElement("div"); d2.className="opt"; d2.style.cursor="default";
  d2.textContent="码率 "+brTxt; infoBox.appendChild(d2);
  /* 底部：图标 + 时钟(秒级) + 网速（码率折算） */
  var foot=document.createElement("div"); foot.className="foot";
  var netBps = (st.bandwidth ? st.bandwidth/8 : 0);   /* bit/s */
  var netTxt = netBps>0 ? (netBps>1048576 ? (netBps/1048576).toFixed(1)+" MB/s"
                            : Math.round(netBps/1024)+" KB/s") : "—";
  foot.innerHTML='<span class="ic">🌐</span><span class="net"></span>'+
                 '<span class="ic">⚙️</span><span class="res"></span>'+
                 '<span class="ic">🕐</span><span class="clk"></span>';
  foot.querySelector(".net").textContent=netTxt;
  foot.querySelector(".res").textContent=resTxt;
  var clkEl=foot.querySelector(".clk");
  function tick(){ var d=new Date(); clkEl.textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2); }
  tick();
  clearInterval(renderSetPanel._t);
  renderSetPanel._t=setInterval(function(){ if(!ovOpen("set")){ clearInterval(renderSetPanel._t); return; } tick(); }, 1000);
  p.appendChild(foot);
  if(IS_TV){ var f0=p.querySelector(".opt"); if(f0){ try{ f0.focus(); }catch(e){} } }
}

/* ---------- 启动自动起播（v2.10）----------
   官网源快照就绪后：优先恢复上次频道（localStorage），否则当前分组第一个。
   只自动起播一次（__autoStarted 挡住后台静默刷新的 applyWvt 二次触发）。 */
var __autoStarted = false;
function autoStartFirst(){
  if(__autoStarted || !WVT.ready) return;
  __autoStarted = true;
  var last=null;
  try{ last=JSON.parse(localStorage.getItem("tv_last_ch")||"null"); }catch(e){}
  var id = (last && last.id && WVT.byId[last.id]) ? last.id : (WVT.byGroup[WVT.cur]||[])[0];
  if(id){
    var ch=WVT.byId[id];
    console.log("[AUTO] 自动起播: "+ch.name);
    openChannel("wvt", ch.id, ch.name);
  }
}

/* ---------- 初始化 ---------- */
function init(){
  if(IS_TV) document.body.classList.add("tv");
  /* v2.10.6：旧列表页删除 —— 启动即全屏播放；源切换/换台全在 chOv 浮层 */
  $("btnFs").onclick=toggleFs;
  $("btnEpg").onclick=function(){
    var b=$("epg"); b.classList.toggle("show");
    closeLinePanel();
    if(b.classList.contains("show")) renderEpg();
    $("btnEpg").className="ctlbtn"+(b.classList.contains("show")?" act":"");
    resetCtrlTimer();
  };
  $("btnLines").onclick=function(){
    var p=$("linePanel");
    $("epg").classList.remove("show"); $("btnEpg").className="ctlbtn";
    p.classList.toggle("show");
    $("btnLines").className="ctlbtn"+(p.classList.contains("show")?" act":"");
    resetCtrlTimer();
  };
  $("btnPlay").onclick=function(){
    /* 播放/暂停切换 */
    if(NATIVE.active){ if(window.NativeTV && NativeTV.nativePause && !isNativePaused){ NativeTV.nativePause(); isNativePaused=true; } else if(window.NativeTV && NativeTV.nativeResume){ NativeTV.nativeResume(); isNativePaused=false; } }
    else { var v=$("v"); if(v.paused){ v.play(); } else { v.pause(); } }
    setPlayBtnUI();
    resetCtrlTimer();
  };
  $("btnRatio").onclick=function(){
    var v=$("v"), ratios=["contain","cover","fill"], i=(v.dataset.ri|0)+1;
    if(i>=ratios.length) i=0;
    v.dataset.ri=i; v.style.objectFit=ratios[i];
    toast("画面比例："+ratios[i]);
    resetCtrlTimer();
  };
  $("btnFav").onclick=function(){ toggleFav(cur.tid,cur.id,cur.name); setFavBtnUI(); };
  /* 播放档位：秒开 ⇄ 稳定（原生缓冲门槛 + 软解缓冲一起切） */
  $("btnTune").onclick=function(){ setTune(TUNE === "fast" ? "stable" : "fast"); resetCtrlTimer(); };
  /* 播放信息角标：点一下在 关 → 简 → 详 之间循环（v2.8） */
  $("statBadge").onclick=function(){ cycleStatsMode(); resetCtrlTimer(); };

  /* 触屏手势：双击全屏 / 单击唤出控制条 / 亮度音量（手机端） */
  bindTouchGestures();

  /* ★ 后台暂停：切后台/锁屏时暂停播放，回前台恢复（软解 + 原生双通道）
     ★ 恢复前必须确认还在播放层 —— closePlayer 后 visibilitychange 也会来，
        那时把已清理的空 video play() 会把音频通道重新挂起来（实测真坑）。
     ★ 注意：Activity.onPause 时 WebView 里 document.hidden 不会变 true
        （View 仍 attached），visibilitychange 根本不触发 —— 所以真正的
        后台暂停由原生 onPause 直接调 __appPause()（实测 HOME 残声根因）。 */
  /* ★ __sessionClosed / __appWasPlaying 已提升为全局 var（见文件头部声明区）。
     之前 var 声明在 init 里 → 与全局函数们读写的是两个不同变量，闸门失效。 */
  window.__appPause = function(){
    try{
      window.__appPauseCount = (window.__appPauseCount || 0) + 1;   /* CDP 可验证执行 */
      __appWasPlaying = $("player").classList.contains("show") &&
                        (NATIVE.active ? !isNativePaused : ($("v") && !$("v").paused));
      /* ★ 后台 = 彻底卸载播放引擎。实测（Android 9 / Chromium 91）：
         v.pause()/muted/web.onPause()/web.pauseTimers()/detach 全都停不掉——
         因为卸载会触发 mpegts 的 error/ended 回调 → nextLine() 又把下一条
         线路拉起来（ExoPlayer 重新起播）。必须：① 先落下 __sessionClosed
         闸门挡住所有自动重连；② 清掉 stall 定时器；③ 无条件释放原生通道。 */
      __sessionClosed = true;
      clearTimeout(stall.timer);
      /* ★ 只有「确实还有东西在播」才需要拆播放引擎。
         这道判断是保帧功能的第二重保险：我们自己调的 web.onPause()（退播放层
         清音频）会触发 visibilitychange → 这里，那时 NATIVE.active 已是 false、
         mpegts 实例也已 destroy —— 没有会话可拆，却会把刚钉好的保帧
         release 掉。真的切后台时 NATIVE.active / player 都还在，照拆不误。 */
      if(NATIVE.active || player){
        if(window.NativeTV && NativeTV.nativeStop){
          NativeTV.nativeStop();                     /* 无条件释放 ExoPlayer */
          NATIVE.active = false;
          clearInterval(NATIVE.timer);
        }
      }
      var v=$("v");
      if(player){ try{player.destroy();}catch(e){} player=null; }
      if(v){ try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){} }
    }catch(e){}
  };
  window.__appResume = function(){
    try{
      var v=$("v"); if(v) v.muted = false;
      if(__appWasPlaying && $("player").classList.contains("show") &&
         cur && cur.urls && cur.urls.length){
        __sessionClosed = false;                   /* 显式重连：重新开闸 */
        playIdx(cur.idx);                          /* 重新连流（重新选路） */
      }
    }catch(e){}
    __appWasPlaying = false;
  };
  document.addEventListener("visibilitychange", function(){
    var hidden = document.hidden || document.visibilityState==="hidden";
    var playing = $("player").classList.contains("show");
    if(hidden){
      /* ★ 闸门：我们自己为「退播放层清音频」调的 web.onPause() 也会让页面变成
         hidden，和真的切后台长得一模一样，而且这个事件**可能晚到 400ms 以上**
         （所以用时间窗，不用「调完就复位」的布尔量 —— 那把实测被迟到事件绕过）。
         不加闸门时：退播放层被误判成切后台 → __appPause → nativeStop → 保帧刚
         钉好就被 release 清掉（v2.5.1 实测 logcat：FrozenFrame hide 紧跟
         surface detached）。
         ★ 真的 HOME/锁屏不依赖这里 —— 原生 onUserLeaveHint/onPause 会直接
         驱动 __appPause，所以挡掉不会漏掉后台停声。 */
      if(Date.now() < __mediaPauseGuardUntil) return;
      window.__appPause();
    } else if(playing) {
      window.__appResume();
    }
  });

  /* 时钟刷新 */
  updateClock(); setInterval(updateClock, 30000);

  /* ===== 遥控器 / 键盘方向键导航（TV 版核心） ===== */
  /* ★ 只取真正可见的元素：切数据源会整行隐藏 tabs / grpbar，
     不过滤的话遥控器会 focus 到看不见的分类上 */
  function listOf(sel){
    return [].slice.call(document.querySelectorAll(sel)).filter(function(e){
      return e.getClientRects().length > 0;
    });
  }
  var OK=[23,13,66,160];
  var CHUP=[33,166], CHDN=[34,167];      /* 遥控器 频道+ / 频道- */
  document.addEventListener("keydown", function(e){
    var k=e.keyCode, ae=document.activeElement, inPlayer=$("player").classList.contains("show");

    /* ---- 遥控器数字键直选频道（0-9，TV 版）----
       输入数字后 1.2 秒内无后续数字 → 跳到该序号频道。
       与「方向键导航 + OK」并存，互不干扰。 */
    /* chanArr()：当前「频道清单」（RENDER.arr，由 loadCat/pickGroup/renderChOvChs 维护）。
       v2.10.6 起旧列表 DOM 已删，遥控器切台全部走这份数据。 */
    function chanArr(){ return (window.RENDER && RENDER.arr) || []; }
    function hopChan(dir){
      var arr=chanArr(); if(!arr.length) return;
      var pos=-1;
      for(var z=0;z<arr.length;z++){ if(String(arr[z].id)===String(cur.id)){ pos=z; break; } }
      if(pos<0) pos=0;
      var np=(pos+dir+arr.length)%arr.length;   /* 首尾循环 */
      var nc=arr[np];
      if(nc) openChannel(nc.tid||curCat, nc.id, nc.name);
    }
    /* ★ v2.10.13：数字选台随时可用（原来被 (!inPlayer||anyOvOpen) 包住 ——
       播放中无浮层按遥控器数字键没反应，TV 用户实测反馈） */
    if(!(ae && ae.tagName==="INPUT")){
      if(k>=7 && k<=16 || (k>=48 && k<=57)){  /* KEYCODE_0..9 数字选台 */
        e.preventDefault();
        /* ★ v2.10.13：DOM keyCode 与 Android keycode 两套并存 —— WebView 把
           主键盘数字翻成 DOM 标准（'1'=49…'9'=57,'0'=48），只认 7..16 时
           永远匹配不上（实测播放中按「1」无反应）。两套都收。 */
        var digit = (k>=48) ? ((k===48) ? 0 : k-48) : (k-7);
        numBuf = (numBuf + digit).slice(-3);
        clearTimeout(numTimer);
        var idx = parseInt(numBuf,10) - 1;
        var arr0=chanArr();
        if(idx>=0 && idx<arr0.length){
          toast("跳转第 "+(idx+1)+" 个频道");
          var el=document.querySelectorAll("#chOv.show .chi")[idx];
          if(el) el.focus();
        } else { toast("无第 "+(idx+1)+" 个频道"); }
        numTimer=setTimeout(function(){
          var c=chanArr()[parseInt(numBuf,10)-1];
          if(c) openChannel(c.tid||curCat, c.id, c.name);
          numBuf="";
        }, 1200);
        return;
      }
    }
    if((!inPlayer || anyOvOpen()) && !(ae && ae.tagName==="INPUT")){
      /* ---- 遥控器 频道+/- 切台 ---- */
      if(CHUP.indexOf(k)>=0 || CHDN.indexOf(k)>=0){
        e.preventDefault();
        hopChan(CHUP.indexOf(k)>=0 ? 1 : -1);
        return;
      }
    }
    /* ---- 播放中（浮层未开）：频道+/- 与 DPAD 上下切台，首尾循环 ---- */
    if(inPlayer && !anyOvOpen() && (CHUP.indexOf(k)>=0 || CHDN.indexOf(k)>=0 || k===38 || k===40)){
      var ctlF = ae && ae.closest && ae.closest("#ctrl");
      if(!ctlF){
        e.preventDefault();
        hopChan(CHUP.indexOf(k)>=0 || k===40 ? 1 : -1);
        return;
      }
    }

    /* ---- v2.10 浮层打开时：方向键在浮层内导航，OK 点击 ---- */
    if(inPlayer && anyOvOpen()){
      e.preventDefault();
      ovAutoKeep();      /* 有操作就重置 12s 自动关闭计时 */
      if(OK.indexOf(k)>=0){ if(ae && typeof ae.click==="function" && ae.tagName!=="INPUT") ae.click(); return; }
      if(k===38 || k===40){
        var ovCont = ae && ae.closest && (ae.closest(".cats")||ae.closest(".chs")||ae.closest(".panel"));
        if(!ovCont){
          var f0=document.querySelector("#chOv.show .chi.on, #chOv.show .chi, #setOv.show .opt");
          if(f0) f0.focus();
          return;
        }
        var ovs=[].slice.call(ovCont.querySelectorAll(".cat,.chi,.opt")).filter(function(x){ return x.getClientRects().length>0; });
        var oi=ovs.indexOf(ae), on1=ovs[oi+(k===40?1:-1)];
        if(on1) on1.focus();
        return;
      }
      /* 左右：频道列表浮层的 分组列 ↔ 频道列 */
      if((k===37 || k===39) && ovOpen("ch")){
        var inCats = ae && ae.closest && ae.closest(".cats");
        var pool=[].slice.call(document.querySelectorAll(inCats?"#chOv.show .chi":"#chOv.show .cat"))
          .filter(function(x){ return x.getClientRects().length>0; });
        var tgt = pool[pool.indexOf(ae)<0 ? 0 : pool.indexOf(ae)];
        if(tgt) tgt.focus();
        return;
      }
      return;
    }
    /* ---- v2.10 播放中（TV）：菜单键=设置浮层；OK=频道列表浮层（控制条无焦点时） ---- */
    if(inPlayer && k===82){ e.preventDefault(); openSetOv(); return; }
    if(inPlayer && OK.indexOf(k)>=0){
      var ctlFocus = ae && ae.closest && ae.closest("#ctrl");
      if(!ctlFocus){ e.preventDefault(); openChOv(); return; }
    }

    if(inPlayer){ $("ctrl").classList.remove("hide"); resetCtrlTimer();
      /* 全屏时按「返回」先退全屏；这里用 KEYCODE_BACK 由原生接管，不重复处理 */
      var plist=listOf(".ctlbtn").concat(listOf("#lineGrid .line-item"));
      if(plist.indexOf(ae)<0){
        var fl=listOf("#lineGrid .line-item")[cur.idx]||listOf("#lineGrid .line-item")[0]; if(fl){ fl.focus(); return; }
      }
      var pi=plist.indexOf(ae);
      if(OK.indexOf(k)>=0){ if(ae&&typeof ae.click==="function"&&ae.tagName!=="INPUT"){ ae.click(); } e.preventDefault(); return; }
      if(k===37||k===38||k===39||k===40){ e.preventDefault();
        if(pi<0){ if(plist[0]) plist[0].focus(); return; }
        var np=plist[pi+((k===39||k===40)?1:-1)]; if(np) np.focus(); return; }
      return;
    }
    /* v2.10.7：旧列表页已整体退役，焦点只可能落在播放层或浮层内，
       上面各分支已全部覆盖，不再有列表页四行导航。 */
  });
  /* 播放档位：把上次选的口味同步到原生侧（Java 用 SharedPreferences 也存了一份），
     并刷新按钮文案 */
  applyTuneToNative(); syncTuneUI();

  setSrc("wvt");                         /* 默认官网源（官网源在第一位） */
}

/* 数字键缓冲（遥控器直选频道用） */
var numBuf="", numTimer=null;

/* 原生旋转完成后回调：横屏时确保视频铺满，竖屏时恢复默认布局 */
window.onOrientationChanged = function(isLandscape){
  try{
    if(isLandscape && $("player").classList.contains("show") && !IS_TV) setFsMode(true);
  }catch(e){}
};
window.addEventListener("load", init);
</script>
