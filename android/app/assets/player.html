<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>纯净电视直播</title>
<!-- 共享核心：频道/解密/EPG/台标/收藏，与桌面端 shared/core.py 逻辑对齐 -->
<script src="logos.js"></script>
<script src="mpegts.js"></script>
<script src="tv_core.js"></script>
<!-- 官网源（WebViewTV）：内置快照 + AES-256-CBC 解密 + 镜像回退，见 shared/wvt.py -->
<script src="wvt_channels.js"></script>
<script src="wvt.js"></script>
<style>
  /* ==========================================================================
     设计令牌 —— 现代深色媒体应用语言
     层次：bg(最底) < surface(卡) < surface2(悬浮) ；品牌色为红→暖橙渐变
     ========================================================================*/
  :root{
    --bg:#0a0b0f;
    --bg-grad:radial-gradient(120% 80% at 50% -10%, #1b1220 0%, #0a0b0f 58%);
    --surface:rgba(255,255,255,.045);
    --surface-2:rgba(255,255,255,.085);
    --surface-solid:#16181f;
    --line:rgba(255,255,255,.075);
    --line-strong:rgba(255,255,255,.14);
    --fg:#f2f4f8;
    --fg-dim:#a2a9b8;
    --fg-mute:#6b7385;
    --brand:#ff2d55;
    --brand-2:#ff6b35;
    --brand-grad:linear-gradient(135deg,#ff2d55 0%,#ff6b35 100%);
    --gold:#ffc531;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 20px -6px rgba(0,0,0,.55);
    --shadow-lg:0 18px 48px -12px rgba(0,0,0,.7);
    --glow:0 0 0 1px rgba(255,45,85,.4), 0 6px 22px -4px rgba(255,45,85,.45);
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* 页面骨架：header 自适应高度，列表区 flex 吃满剩余空间
     —— 顶栏里加减内容都不用再去改 #scroller 的魔法数字 */
  body{display:flex;flex-direction:column;}
  html,body{margin:0;height:100%;background:var(--bg);background-image:var(--bg-grad);
    background-attachment:fixed;color:var(--fg);overflow:hidden;letter-spacing:.01em;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  /* ★ 全局禁文本选择（v2.10.8）：长按唤浮层的手势会连带触发 WebView 文本选择，
     弹出系统「复制/分享/全选」气泡，遮挡频道列表（模拟器实测踩到）。 */
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}

  /* v2.10.7：旧列表页（顶栏/搜索/源切换条/分类/频道网格）已整体退役，
     相关 DOM、JS 与样式全部移除；换台走 #chOv 浮层，源切换走浮层顶部 .sopt。 */

  /* 官网源网页线路：整屏交给原生 WebView 加载官方页面 */
  /* ★ v2.10.14：全屏层一律用 left/top/right/bottom 显式定位 —— `inset:0` 简写
     要 Chromium 87+ 才支持，真机 TV 的老 WebView 不认，#status/#webmask/#player/
     .ov 全部塌缩成内容大小挤在左上角（真机实测：加载页缩在角上、浮层开了
     也「看不见」）。模拟器 WebView 新（87+）看不出来，别回退。 */
  #webmask{display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:400;background:#000;
           color:var(--fg-dim);align-items:center;justify-content:center;
           flex-direction:column;gap:14px;font-size:15px;}
  #webmask.show{display:flex;}
  #webmask .sp{width:34px;height:34px;border-radius:50%;border:3px solid var(--line-strong);
               border-top-color:var(--brand);animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 焦点环（TV/键盘） */
  .ctlbtn:focus,.line-item:focus{outline:none;}
  .ctlbtn:focus-visible,.line-item:focus-visible{
    outline:2.5px solid var(--gold);outline-offset:2px;background:var(--surface-2);}

  /* ---------------- 播放层 ---------------- */
  #player{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:50;display:none;flex-direction:column;
    /* ★ 关键：播放层整体接收触摸，手势/点按绑定在它上面，而不是 #vwrap。
       原生硬解模式下 #vwrap 是 visibility:hidden，点按落在 #vwrap 上会失效。 */
    touch-action:manipulation;}
  #player.show{display:flex;}
  #vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex:0 0 auto;overflow:hidden;
    transition:aspect-ratio .18s var(--ease);}
  #vwrap::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;
    box-shadow:inset 0 0 60px rgba(0,0,0,.6);}
  video{width:100%;height:100%;background:#000;display:block;object-fit:contain;}
  /* ★ v2.10.8 状态页（参考 WebViewTV 的「黑底信息渐进」美学）：
     不再是状态文字条，而是整屏黑底频道页 —— 大号频道号 + 频道名 + 渐进状态行 +
     底部品牌字。视频首帧出来后整层 0.45s 淡出，视觉主线「黑底不动、文字更新、
     画面淡入」，消灭「转圈→播放图标→视频」的状态跳变。 */
  #status{position:fixed;left:0;top:0;right:0;bottom:0;z-index:600;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:#000;opacity:1;
    transition:opacity .45s var(--ease);pointer-events:none;}
  #status.hide{opacity:0;}
  #status .chno{font-size:72px;font-weight:800;color:#fff;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
    text-shadow:0 6px 40px rgba(255,45,85,.35);}
  #status .chname{font-size:24px;font-weight:600;color:#e6e9f0;letter-spacing:.02em;}
  #status .sub{display:flex;align-items:center;gap:8px;font-size:13px;
    color:var(--fg-mute);margin-top:6px;}
  #status .sp{display:inline-block;width:11px;height:11px;
    border:2px solid rgba(255,255,255,.2);border-top-color:var(--brand);
    border-radius:50%;animation:spin .9s linear infinite;}
  #status .foot{position:absolute;bottom:6%;font-size:11px;
    color:rgba(255,255,255,.25);letter-spacing:.14em;}

  /* ================= 手机全屏模式（点「全屏」后） =================
     视频铺满 100% 屏高，控制条分上下两栏（电视家风格）：顶部返回+标题，底部功能钮。 */
  #player.fs #vwrap{position:absolute;left:0;top:0;right:0;bottom:0;width:100%;height:100%;aspect-ratio:auto;flex:none;}
  #player.fs #ctrl{position:absolute;left:0;right:0;top:0;bottom:0;z-index:2;border-top:none;
    background:transparent;pointer-events:none;}
  #player.fs #ctrl.hide .ctlbar{opacity:0;pointer-events:none;}
  #player.fs #epg{max-height:44vh;}

  /* 控制条容器：上下两条半透明渐变栏，中间区域透明可穿透（点画面用） */
  #ctrl{display:block;transition:opacity .3s var(--ease);}
  .ctlbar{pointer-events:auto;transition:opacity .28s var(--ease),transform .28s var(--ease);}
  /* 顶部栏：返回 + 频道名 + 收藏 */
  #topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
    padding:14px 16px 30px;z-index:3;
    background:linear-gradient(180deg,rgba(8,9,13,.9) 0%,rgba(8,9,13,.5) 60%,transparent 100%);}
  #topbar .cname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
    font-size:15px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8);}
  /* 底部栏：进度提示 + 节目单/线路/播放/比例/全屏/返回 */
  #botbar{position:absolute;bottom:0;left:0;right:0;z-index:3;
    background:linear-gradient(0deg,rgba(8,9,13,.92) 0%,rgba(8,9,13,.55) 60%,transparent 100%);
    padding:30px 16px 16px;}
  #botbar .row1{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  #botbar .live-tag{flex:0 0 auto;font-size:10px;font-weight:700;color:#fff;background:var(--brand-grad);
    border-radius:4px;padding:2px 7px;letter-spacing:.03em;}
  #botbar .prog{flex:1;color:var(--fg-dim);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;}
  #botbar .clock{flex:0 0 auto;color:var(--fg-mute);font-size:12px;font-variant-numeric:tabular-nums;}
  /* 播放信息角标（v2.8）：分辨率 / 帧率 / 码率 / 缓冲。默认「简」，点击循环 关→简→详。
     关闭态留一个很淡的 ⓘ 作为入口，否则关掉之后就再也点不开了。 */
  #botbar .statbadge{flex:0 0 auto;color:var(--fg-mute);font-size:11.5px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap;
    padding:2px 8px;border-radius:999px;border:1px solid var(--line);cursor:pointer;
    transition:background .18s var(--ease),color .18s var(--ease),opacity .18s var(--ease);}
  #botbar .statbadge.off{opacity:.4;padding:2px 6px;border-color:transparent;}
  #botbar .statbadge.warn{color:var(--gold);border-color:rgba(255,197,49,.32);}
  #botbar .statbadge:active{background:rgba(255,255,255,.1);}
  body.tv #botbar .statbadge{font-size:15px;padding:4px 12px;}
  #botbar .row2{display:flex;align-items:center;gap:8px;}
  .ctlbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;
    border-radius:var(--r-sm);color:var(--fg);background:transparent;border:none;cursor:pointer;
    font-size:11px;transition:background .18s var(--ease),transform .18s var(--ease);}
  .ctlbtn:active{background:rgba(255,255,255,.1);transform:scale(.94);}
  .ctlbtn .ic{font-size:20px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));}
  .ctlbtn.act .ic{color:var(--brand);}
  .ctlbtn.act .lb{color:var(--brand);font-weight:600;}

  /* ================= 原生硬解模式（v1.4） =================
     画面由原生 TextureView 输出（挂在 WebView 之下，全屏铺满）。
     此时网页这一层要整体透明化：html/body 透明、频道列表隐藏、<video> 隐藏，
     只保留控制条浮层可见可点 —— 否则会盖住原生画面。
     依赖 MainActivity 侧 WebView.setBackgroundColor(TRANSPARENT)。

     ★ frame-on（v2.5.1 拆分）：退出播放层时原生会抓下最后一帧钉在屏幕下方
     （FrozenFrame），开台时要把 WebView 转透明让那一帧透出来。这一步要的
     只是「透明 + 藏列表」，**不能**连 <video> 一起隐藏 —— 因为有些频道最后
     会走软解，那时画面就在网页的 <video> 里。所以拆成两个类：
       frame-on  = 透明 + 藏列表/顶栏（保帧透出、软解 <video> 也能用）
       native-on = frame-on 的效果 + 彻底隐藏网页播放器（原生硬解才用） */
  html.frame-on, body.frame-on,
  html.native-on, body.native-on{background:transparent;background-image:none;}
  body.frame-on #player, body.native-on #player{background:transparent;}
  body.frame-on #vwrap, body.native-on #vwrap{background:transparent;}
  /* <video> 默认自带 #000 底 —— 保帧模式下必须也透明，否则它会盖住下面的帧 */
  body.frame-on #vwrap video, body.native-on #vwrap video{background:transparent;}
  /* 保帧/原生模式：FrozenFrame 在底下透出来，状态层必须变透明（只留文字） */
  body.frame-on #status, body.native-on #status{background:transparent;}
  body.native-on #vwrap{visibility:hidden;}

  /* 线路选择弹层（电视家风格：底部滑出面板） */
  #linePanel{position:absolute;left:0;right:0;bottom:0;z-index:4;
    background:rgba(12,13,18,.96);-webkit-backdrop-filter:blur(20px) saturate(160%);
    backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--line-strong);
    border-radius:16px 16px 0 0;padding:14px 16px 18px;display:none;
    transform:translateY(100%);transition:transform .28s var(--ease);}
  #linePanel.show{display:block;transform:translateY(0);}
  #linePanel .ttl{font-size:13px;font-weight:600;color:var(--fg-dim);margin:0 0 12px 4px;}
  #linePanel .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  #linePanel .line-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;
    border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);cursor:pointer;
    transition:all .18s var(--ease);}
  #linePanel .line-item .ic{font-size:22px;}
  #linePanel .line-item .lb{font-size:12px;color:var(--fg-dim);font-weight:500;}
  #linePanel .line-item.on{background:var(--brand-grad);border-color:transparent;}
  #linePanel .line-item.on .lb{color:#fff;font-weight:600;}

  /* EPG 节目单（电视家风格：右侧滑出或底部弹出，此处底部弹出） */
  #epg{display:none;overflow:auto;max-height:46vh;position:absolute;left:0;right:0;bottom:0;
    z-index:4;background:rgba(12,13,18,.96);-webkit-backdrop-filter:blur(20px) saturate(160%);
    backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--line-strong);
    border-radius:16px 16px 0 0;padding:6px 0 12px;}
  #epg.show{display:block;}
  #epg .row{display:flex;gap:12px;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.045);
    font-size:13px;transition:background .2s var(--ease);}
  #epg .row.now{background:linear-gradient(90deg,rgba(255,45,85,.16),rgba(255,45,85,.03));
    color:#fff;box-shadow:inset 3px 0 0 var(--brand);}
  #epg .row .tm{color:var(--fg-mute);flex:0 0 48px;font-variant-numeric:tabular-nums;font-weight:500;}
  #epg .row.now .tm{color:var(--gold);font-weight:600;}
  #epg .row .pg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #epg .row .rb{color:#fff;font-size:10.5px;font-weight:700;background:var(--brand-grad);
    border-radius:999px;padding:2px 8px;letter-spacing:.03em;align-self:center;}

  /* 亮度/音量手势指示条 */
  #gestureInd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    z-index:5;display:none;flex-direction:column;align-items:center;gap:8px;
    background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    padding:16px 22px;border-radius:14px;pointer-events:none;}
  #gestureInd.show{display:flex;}
  #gestureInd .ic{font-size:30px;}
  #gestureInd .val{color:#fff;font-size:13px;font-weight:600;min-width:48px;text-align:center;}
  #gestureInd .bar{width:120px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;}
  #gestureInd .bar i{display:block;height:100%;background:var(--brand-grad);width:50%;border-radius:2px;}

  /* Toast 样式见文件末尾「v2.5 · 过渡动效 / 状态反馈」一节（已升级为可堆叠的分类组件） */

  /* ================= TV（大屏 10-foot）模式 ================= */
  body.tv{font-size:18px;}
  body.tv #player{display:none;}
  body.tv #player.show{display:block;}
  body.tv #vwrap{position:absolute;left:0;top:0;right:0;bottom:0;height:100%;aspect-ratio:auto;}
  body.tv #status .chno{font-size:120px;}
  body.tv #status .chname{font-size:36px;}
  body.tv #status .sub{font-size:19px;}
  body.tv #ctrl{position:absolute;left:0;right:0;top:0;bottom:0;border-top:none;
    background:transparent;pointer-events:none;}
  body.tv #ctrl.hide .ctlbar{opacity:0;pointer-events:none;}
  body.tv .ctlbar{pointer-events:auto;}
  body.tv #topbar{padding:20px 40px 40px;}
  body.tv #topbar .cname{font-size:24px;}
  body.tv .ctlbtn{font-size:15px;padding:12px 8px;}
  body.tv .ctlbtn .ic{font-size:28px;}
  body.tv #botbar{padding:40px 40px 24px;}
  body.tv #botbar .prog{font-size:17px;}
  body.tv #botbar .clock{font-size:16px;}
  body.tv #linePanel .grid{grid-template-columns:repeat(6,1fr);gap:14px;}
  body.tv #linePanel .line-item .ic{font-size:28px;}
  body.tv #linePanel .line-item .lb{font-size:15px;}
  body.tv #linePanel .ttl{font-size:17px;}
  body.tv #epg{max-height:48vh;font-size:20px;background:rgba(6,7,10,.82);}
  body.tv #epg .row{padding:16px 40px;}
  body.tv #epg .row .tm{flex:0 0 76px;}
  body.tv .ctlbtn:focus{box-shadow:var(--glow);}
  body.tv #linePanel .line-item:focus{box-shadow:var(--glow);}

  /* ==========================================================================
     v2.5 · 过渡动效 / 状态反馈
     原则：时长 ≤300ms、只动 transform 与 opacity（不触发布局重排，低端机不掉帧）
     ========================================================================*/
  /* 播放层进出场（进场用 keyframes：不依赖额外的类，绝无「忘了加类导致不可见」的风险） */
  @keyframes layerIn{from{opacity:0;transform:scale(.985);}to{opacity:1;transform:none;}}
  #player.show{animation:layerIn .22s var(--ease);}
  #player.closing{opacity:0;transform:scale(.99);pointer-events:none;
    transition:opacity .16s var(--ease),transform .16s var(--ease);}
  /* 官方页遮罩淡入（转圈动画已有） */
  #webmask.show{animation:layerIn .18s var(--ease);}

  /* Toast 堆叠容器（替代单条 #toast） */
  #toasts{position:fixed;left:0;right:0;bottom:112px;z-index:800;display:flex;flex-direction:column;
    align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
  body.tv #toasts{bottom:auto;top:32px;}
  .tst{display:flex;align-items:center;gap:9px;max-width:92%;max-width:min(520px,92%);
    background:rgba(24,26,33,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:500;
    border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);
    opacity:0;transform:translateY(10px);
    transition:opacity .22s var(--ease),transform .22s var(--ease);}
  .tst.in{opacity:1;transform:none;}
  .tst.out{opacity:0;transform:translateY(-6px);}
  .tst .ic{font-size:15px;line-height:1;flex:0 0 auto;}
  .tst .tx{flex:1;min-width:0;line-height:1.45;}
  .tst .act{flex:0 0 auto;pointer-events:auto;border:none;background:var(--brand-grad);color:#fff;
    font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;cursor:pointer;}
  .tst.ok{border-color:rgba(61,220,132,.5);}
  .tst.warn{border-color:rgba(255,197,49,.5);}
  .tst.err{border-color:rgba(255,45,85,.55);}
  body.tv .tst{font-size:18px;padding:14px 24px;border-radius:18px;}

  /* 播放失败占位卡（替代一行冷文字）：图标 + 原因 + 可操作按钮 */
  #errCard{position:fixed;left:50%;top:50%;z-index:750;width:86%;width:min(360px,86%);
    transform:translate(-50%,-50%);background:rgba(18,20,26,.96);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:22px 20px 18px;
    text-align:center;display:none;box-shadow:var(--shadow-lg);}
  /* ★ 失败卡的居中靠 transform:translate(-50%,-50%)，所以入场动画必须把
     这个位移写进每个关键帧 —— 直接复用只动 transform 的 layerIn 会在动画期间
     把居中覆盖掉，卡片会瞬间跳到屏幕右下（实测踩到过）。 */
  @keyframes cardIn{
    from{opacity:0;transform:translate(-50%,-50%) scale(.96);}
    to{opacity:1;transform:translate(-50%,-50%) scale(1);}
  }
  #errCard.show{display:block;animation:cardIn .22s var(--ease);}
  #errCard .eic{font-size:30px;line-height:1;margin-bottom:10px;}
  #errCard .et{font-size:15px;font-weight:600;color:#fff;margin-bottom:6px;}
  #errCard .ed{font-size:12.5px;color:var(--fg-dim);line-height:1.6;margin-bottom:16px;
    white-space:pre-line;word-break:break-all;}
  #errCard .eb{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}

<div id="player">
  <!-- ★ <video> 的两个属性都别动（v2.9.1 修「退出横屏时闪一下播放器」）：
       · 不带 controls —— 带了的话，只要 #vwrap 可见而 <video> 还没挂上流
         （换线路的间隙、退出横屏播放时 closePlayer 先撤 native-on 再清空 src
         的那几十到几百毫秒），Chromium 就会画出自带的控制条：0:00 + 进度条。

         默认海报（一个巨大的播放键），只有「设了 poster」才能压掉它；
         设成透明就等于什么都不画。实测：poster 一清空，大播放键立刻回来。
       两件事叠加起来，用户看到的「过渡」就彻底没了（原来是大播放键 + 0:00
       进度条盖在 #player 黑底上，再叠加旋转动画，几百毫秒必然被看到）。

       从来不需要浏览器原生控件。 -->
  <div id="vwrap"><video id="v" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" playsinline webkit-playsinline preload="auto" x5-video-player-type="h5-page" tabindex="0"></video></div>

<!-- ★ v2.10.13：浮层/失败卡移出 #player 到 body 层 —— #player 是 z50 的层叠上下文，

<script>
/* ==========================================================================
 * UI 层：只负责渲染 / 交互 / 播放器
 * 业务逻辑全部来自 TVCore（shared/web/tv_core.js），与桌面端 core.py 对齐
 * ========================================================================*/
var C = window.TVCore;
var CATS = C.CATS;
var IS_TV = /[?&]tv=1/.test(location.search) || window.innerWidth >= 960 || window.innerHeight >= 960;
var cur = { tid:null, id:null, name:null, urls:[], idx:0, epg:[], extra:[] };
var player = null, ctrlTimer = null;
/* ★ 会话关闭闸门（必须全局！）：openChannel/playSoft/playWebLine/nextLine/closePlayer
   是全局函数，__appPause/__appResume 在 init 里定义 —— 若把闸门 var 声明在 init
   内部，__appPause 写的是闭包变量、闸门读的是全局变量，两个变量互不相通，
   闸门完全失效（实测 HOME 残声 8 轮修复无效的真正根因，2026-10-11）。 */
var __sessionClosed = false;
var __appWasPlaying = false;
var __freezeT = null;            /* 保帧超时（见 nativeFreeze）：停在列表太久就把画面层也收掉 */
var __mediaPauseGuardUntil = 0;  /* 我们自己按下 web.onPause 的时间窗，用来挡误判的「切后台」 */
var __startWatchT = null;        /* 起播看门狗定时器（见 armStartWatch） */
var __autoHopN = 0;              /* 连续自动跳台次数（见 autoNextChannel）：防整源故障时刷穿列表 */
var MAX_AUTO_HOP = 5;
var curCat = "tv", allChans = [];
var isNativePaused = false;      /* 原生播放器是否被手动暂停 */

/* ---------- 数据源：local=本机直播源 / wvt=官网源（WebViewTV） ----------
   两边频道表结构完全不同，各自记一份「上次看到哪儿」，来回切不迷路：
     localCat   本机源下的分类 tid（含 fav）
     WVT.cur    官网源下的分组名
   ---------------------------------------------------------------------- */
var srcMode = "local";
var localCat = "tv";
var SRC_TABS = [["wvt", "官网源"], ["local", "本机源"]];   /* 官网源放第一位 */

/* ---------- 官网源（WebViewTV）状态 ---------- */
var WVT = { ready:false, chans:[], adapters:[], groups:[], byId:{}, list:[], cur:"", loading:false };

function $(id){ return document.getElementById(id); }

/* ======================================================================
 * 轻量 UI 组件：Toast / 失败占位卡 / 失败原因文案
 *   toast("已切换到官网源")                        —— 旧签名照旧可用
 *   toast("线路均不可用", {type:"err", action:{label:"重试", fn:retry}})
 *   showErrCard({title, reason, btns, retrySec, onRetry})
 * ==================================================================== */
var TST_ICON = { info:"ℹ️", ok:"✅", warn:"⚠️", err:"⛔" };
function toast(text, opt){
  opt = opt || {};
  var box = $("toasts"); if(!box) return;
  var type = opt.type || "info";
  /* 内容完全相同的提示不重复堆叠：先清掉旧的那条再放新的 */
  var olds = box.querySelectorAll(".tst");
  for(var i=0;i<olds.length;i++){
    if(olds[i].dataset.txt === String(text)){ clearTimeout(olds[i]._t); olds[i].remove(); }
  }
  var el = document.createElement("div");
  el.className = "tst " + type;
  el.dataset.txt = String(text);
  var icon = opt.icon || TST_ICON[type] || "";
  el.innerHTML = (icon ? '<span class="ic">'+icon+'</span>' : '') + '<span class="tx"></span>';
  el.querySelector(".tx").textContent = text;
  function dismiss(){
    clearTimeout(el._t);
    el.classList.remove("in"); el.classList.add("out");
    setTimeout(function(){ try{ el.remove(); }catch(e){} }, 240);
  }
  if(opt.action && opt.action.label){
    var b = document.createElement("button");
    b.className = "act"; b.textContent = opt.action.label; b.tabIndex = -1;
    b.onclick = function(){ dismiss(); try{ opt.action.fn && opt.action.fn(); }catch(e){} };
    el.appendChild(b);
  }
  box.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add("in"); });
  /* 最多同时 3 条，多了把最早的挤掉 */
  var all = box.querySelectorAll(".tst");
  for(var j=0;j<all.length-3;j++){ clearTimeout(all[j]._t); all[j].remove(); }
  var dur = opt.duration || (opt.action ? 5200 : 2200);
  el._t = setTimeout(dismiss, dur);
  return dismiss;
}

/* ---------- 失败原因 → 用户可读文案 ----------
   原因来源有三处：注入脚本回传的站点原文（__onWebPageFailed / __wvt_reason）、
   原生 PlaybackException 的 errorCodeName、以及网络异常文本。
   词表只收「完整说法」，避免「VIP」「限制」这类短词误杀正常提示。 */
var REASON_MAP = [
  [/会员|专享|付费|VIP|vip/,              "该内容为会员专享，源站限制了播放", "🔒"],
  [/播出安排|暂不支持|暂停服务|未开始|已下线/, "该时段源站不提供此节目",        "🕒"],
  [/地域|地区|仅限|版权/,                 "该节目有地区／版权播放限制",      "🌐"],
  [/403|429|限流|访问频繁|too many/i,     "源站限流，请稍后再试",           "🚦"],
  [/404|找不到|不存在|空频道/,            "源站已下线该频道",               "🚫"],
  [/超时|timeout|连接|network|网络|unreachable|EAI|ENOTFOUND/i,
                                          "网络连接异常，请检查网络",        "📡"],
  [/解码|decoder|codec|DecoderInit/i,     "当前设备解码不支持该流",          "🎞"],
  [/令牌|token|重进|过期/,                "播放令牌已过期，返回重进可刷新",   "🔑"]
];
function humanReason(raw){
  var s = String(raw == null ? "" : raw).trim();
  if(!s || s === "undefined" || s === "null") return null;
  for(var i=0;i<REASON_MAP.length;i++){
    if(REASON_MAP[i][0].test(s)) return { text: REASON_MAP[i][1], icon: REASON_MAP[i][2] };
  }
  return { text: s, icon: "⚠️" };
}

/* ---------- 播放失败占位卡 ----------
   btns: [{label, primary, fn}]；retrySec>0 且给了 onRetry 时显示自动重试倒计时 */
var __errCountdown = null;
/* 清掉所有 Toast —— 失败卡出现时它才是主角，别让浮动的提示压住按钮
   （横屏只有 360px 高，card 与底部的 toast 一定会打架） */
function clearToasts(){
  var box=$("toasts"); if(!box) return;
  var all=box.querySelectorAll(".tst");
  for(var i=0;i<all.length;i++){ clearTimeout(all[i]._t); all[i].remove(); }
}
function showErrCard(o){
  o = o || {};
  clearToasts();
  var r = humanReason(o.reason);
  $("ecIc").textContent = r ? r.icon : "⚠️";
  $("ecTitle").textContent = o.title || "该频道暂时无法播放";
  $("ecDesc").textContent = o.desc || (r ? r.text : "线路连接失败，可以重试或换一条线路");
  var box = $("ecBtns"); box.innerHTML = "";
  (o.btns || []).forEach(function(b){
    var el = document.createElement("button");
    el.className = b.primary ? "p" : "s";
    el.textContent = b.label; el.tabIndex = 0;
    el.onclick = function(){ hideErrCard(); try{ b.fn && b.fn(); }catch(e){} };
    box.appendChild(el);
  });
  clearInterval(__errCountdown);
  var rt = $("ecRetry");
  if(o.retrySec > 0 && o.onRetry){
    var left = o.retrySec, lb = o.retryLabel || "自动重试";
    rt.style.display = "block";
    rt.textContent = "将在 " + left + "s 后" + lb + "…";
    __errCountdown = setInterval(function(){
      left--;
      if(left <= 0){
        clearInterval(__errCountdown);
        hideErrCard(); try{ o.onRetry(); }catch(e){}
        return;
      }
      rt.textContent = "将在 " + left + "s 后" + lb + "…";
    }, 1000);
  } else { rt.style.display = "none"; rt.textContent = ""; }
  $("errCard").classList.add("show");
  resetCtrlTimer();
}
function hideErrCard(){
  clearInterval(__errCountdown); __errCountdown = null;
  var c = $("errCard"); if(c) c.classList.remove("show");
}

/* 播放层状态页（v2.10.8）：黑底整屏「频道号 + 频道名 + 渐进状态行」。

   busy=true 时状态行带小转圈（只在这一行，不再有整屏大转圈/播放图标）。 */

/* ---------- 播放层显示/隐藏（带过渡） ----------
   进场靠 CSS keyframes（挂在 .show 上，不会出现「忘了加类导致不可见」）；
   出场要先加 .closing 淡出 170ms 再摘 .show —— display:none 是没法过渡的。 */
var __layerHideT = null;
/* 播放层可见时把网页整体转透明（见 CSS 里 frame-on / native-on 的说明）。
   这样下层无论是「保帧画面」还是「原生 TextureView」都能透出来。 */
function setFrameOn(){
  try{ document.documentElement.classList.add("frame-on"); document.body.classList.add("frame-on"); }catch(e){}
}
function clearFrameOn(){
  try{ document.documentElement.classList.remove("frame-on"); document.body.classList.remove("frame-on"); }catch(e){}
}
function showPlayerLayer(){
  var p=$("player");
  clearTimeout(__layerHideT);
  p.classList.remove("closing");
  p.classList.add("show");
  setFrameOn();
  startStatWatch();     /* 底栏播放信息角标（v2.8）随之开始刷新 */
}

/* ---------- 播放 ---------- */
function openChannel(tid, id, name){
  __sessionClosed = false;      /* ★ 用户显式开新频道：重新开闸 */
  /* v2.10：浮层里点频道 —— 先关浮层并拆掉上一频道的官方页层。
     closePage 是延迟 150ms 的 seq 防御拆除：若接下来 playWebLine 又开了
     新官方页（pageSeq 已 ++），旧拆除自动失效；本机源/直链频道则真正拆掉。 */
  closeAllOv();
  /* ★ v2.10.2：closePage 拆掉旧官方页会回调 __onWebPageClosed，而它在 webState===0
     时会 closePlayer() 弹回旧列表 —— 从官网源切到本机源点频道必踩（官网源放的
     时候 pageView 还活着）。先打「换台拆页」标记，回调见到就只拆页不动播放层；
     1s 后自动清（wvt→wvt 换台时 showPage 会 pageSeq++ 令 hidePage 失效，
     回调根本不来，不留陈旧标记吞掉之后真正的退出）。 */
  window.__pageSwap = true;
  setTimeout(function(){ window.__pageSwap = false; }, 1000);
  try{ if(window.NativeTV && NativeTV.closePage) NativeTV.closePage(); }catch(e){}
  /* v2.10：记住上次频道（重启自动恢复起播用） */
  try{ localStorage.setItem("tv_last_ch", JSON.stringify({tid:String(tid), id:String(id), name:String(name)})); }catch(e){}
  cur.tid=tid; cur.id=id; cur.name=name; cur.urls=[]; cur.idx=0; cur.epg=[];
  NATIVE.deadIdx = {};          /* ★ 新频道：清空「哪几条线路硬解失败过」，全部重新允许原生 */
  NATIVE.lastStats = null;      /* ★ 新频道：丢弃上一个频道的统计缓存，角标别显示旧分辨率 */
  hideErrCard();
  /* ★ 无缝换台：showPlayerLayer() 会把 WebView 转透明（frame-on），
     Java 侧上一次退出时钉下的那一帧立刻透出来当背景 —— 用户看到的是
     「画面还在，下面一行正在解析线路…」，而不是一块黑。不必在这里判断
     有没有帧：没有帧时露出的就是原来的黑，和旧行为一致。 */
  $("cname").textContent=name;
  setFavBtnUI();
  $("btnEpg").className="ctlbtn"; $("epg").classList.remove("show");
  closeLinePanel();
  $("ctrl").classList.remove("hide"); resetCtrlTimer();
  showPlayerLayer();
  /* ★ 手机端：进入播放自动转横屏全屏，避免竖屏下视频只占上面一小条。
     竖屏手机屏宽有限，横屏才能让 16:9 视频真正铺满可视面积。
     TV（IS_TV）本身就横屏，不需要切。 */
  if(!IS_TV && window.NativeTV && NativeTV.setLandscape) setFsMode(true);
  /* ★ v2.10.8：状态页抬头 —— 大号频道号 + 频道名（参考 WebViewTV 排版）。
     频道号取当前清单里的序号（1 起，两位补零）；找不到就不显示号。 */
  (function(){
    var no="";
    try{
      var arr=(window.RENDER && RENDER.arr)||[];
      for(var z=0;z<arr.length;z++){ if(String(arr[z].id)===String(id)){ no=("0"+(z+1)).slice(-2); break; } }
    }catch(e){}
    setStChannel(no, name);
  })();
  setStatus("正在连接…", true);
  $("lineGrid").innerHTML="";
  /* ★ 官网源：线路表本地就有，不需要请求接口，也不需要测速 */
  if(tid==="wvt"){
    var ch=WVT.byId[id];
    if(!ch){ setStatus("频道信息缺失"); return; }
    cur.urls=ch.urls.map(function(u){return u.url;});
    cur.extra=ch.urls.map(function(u){return u.extra||"";});
    renderLines(); updateProgNow(); setLineUI();
    var directN=cur.urls.filter(function(u){return WVTCore.isDirect(u);}).length;
    setStatus(directN ? "官网源 · 直连线路" : "官网源 · 正在打开官方页面…", !directN);
    playIdx(0);
    return;
  }
  C.fetchPlay(tid, id).then(function(res){
    /* ★ 请求在途时用户已经退出播放层 → 整条链作废。
       没有这道闸门的话，下面的 playIdx() 会在用户退回列表之后
       把频道重新拉起来（resumeWebMedia + 起播），即「按了返回却又冒出声音」。
       与 nextLine()/playSoft()/playWebLine() 的闸门是同一类问题（v2.4.7 残留的变体）。 */
    if(__sessionClosed) return;
    cur.epg = res.epg || [];
    if(!res.urls.length){
      setStatus(null);
      showErrCard({ title:"线路解析失败", reason:"播放令牌已过期，返回重进可刷新",
        btns:[{label:"重试", primary:true, fn:function(){ openChannel(tid,id,name); }},
              {label:"换频道", fn:closePlayer}] });
      return;
    }
    cur.urls=res.urls; renderLines(); updateProgNow();
    if(IS_TV){ var f=document.querySelector("#lineGrid .line-item"); if(f) f.focus(); }
    /* ★ 选路结果缓存 5 分钟：同一个频道再进来直接命中，省掉整轮测速
       （实测「换台慢」里最容易被感知的等待，就是这段并发探测） */
    var key = tid+"/"+id, hit = LINE_CACHE[key];
    if(hit && Date.now()-hit.ts < 300000 && hit.best < cur.urls.length){
      playIdx(hit.best);
      return;
    }
    setStatus("正在测速选路…", true);
    pickBestLine(cur.urls).then(function(best){
      if(__sessionClosed) return;         /* ★ 测速也可能跑很久，同样要复查闸门 */
      cacheLine(key, best);
      playIdx(best);
    }).catch(function(){ if(!__sessionClosed) playIdx(0); });
  }).catch(function(e){
    /* ★ 同上：别把失败卡弹到用户已经退回去的列表上（实测踩到） */
    if(__sessionClosed) return;
    setStatus(null);
    showErrCard({ title:"网络连接异常", reason:String(e),
      btns:[{label:"重试", primary:true, fn:function(){ openChannel(tid,id,name); }},
            {label:"换频道", fn:closePlayer}],
      retrySec:8, onRetry:function(){ openChannel(tid,id,name); } });
  });
}

/* 选路结果缓存（key → {best, ts}）：5 分钟 TTL，最多留 40 条 */
var LINE_CACHE = {};
function cacheLine(key, best){
  LINE_CACHE[key] = { best: best, ts: Date.now() };
  var ks = Object.keys(LINE_CACHE);
  if(ks.length > 40){
    ks.sort(function(a,b){ return LINE_CACHE[a].ts - LINE_CACHE[b].ts; })
      .slice(0, ks.length-40).forEach(function(k){ delete LINE_CACHE[k]; });
  }
}
