<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>纯净电视直播</title>
<style>
  :root {
    /* ── 液态玻璃 · 浅色（参考 Bilibili NEXT macOS 客户端） ──
       macOS 液态玻璃三要素：半透明白底 + 大面积 backdrop-filter 磨砂 +
       1px 亮色描边（上亮下暗）+ 顶部柔和高光 + 圆角卡片 + 柔和弥散阴影。 */
    --bg-top: #f4f6fb;
    --bg-mid: #eef1f8;
    --bg-bot: #e7ebf4;
    --line: rgba(255,255,255,.55);          /* 亮色描边主色（玻璃高光边） */
    --line-soft: rgba(120,132,168,.16);      /* 柔和分隔线（浅灰蓝） */
    --line-strong: rgba(120,132,168,.28);    /* 稍强的分隔线 */
    --fg: #1d2333;                            /* 主文字：近黑蓝 */
    --fg-dim: #5c6478;                        /* 次级文字 */
    --hi: #ff4d6d;                            /* 品牌主色（保留既有红橙渐变） */
    --lo: #ff6b35;
    /* 玻璃面板：半透明白 + 磨砂 + 高光描边 */
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.72);
    --glass-soft: rgba(255,255,255,.40);
    --glass-shadow: 0 8px 28px rgba(60,74,124,.10), 0 2px 8px rgba(60,74,124,.08);
    /* 亮色描边用双层：外发光高光 + 内描边 */
    --glass-border: inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 0 1px rgba(255,255,255,.35),
                     inset 0 -1px 0 rgba(120,132,168,.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    /* 浅色液态玻璃背景：柔和渐变 + 两团弥散彩色光斑，营造「玻璃后方有光」的景深感 */
    background:
      radial-gradient(1200px 600px at 12% -8%, rgba(255,138,101,.20), transparent 60%),
      radial-gradient(1000px 700px at 88% 108%, rgba(122,140,255,.18), transparent 60%),
      radial-gradient(700px 500px at 78% -6%, rgba(255,196,61,.12), transparent 55%),
      linear-gradient(180deg, var(--bg-top), var(--bg-mid) 45%, var(--bg-bot));
    background-attachment: fixed;
    color: var(--fg);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; }

  /* ── 顶栏（还原早前 exe：58px 高，标题 + 源切换 + 版本） ── */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px; height: 58px;
    border-bottom: 1px solid var(--line-soft);
    /* 顶栏玻璃：半透明白磨砂，让背景光斑晕进来 */
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    flex: 0 0 58px;
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--hi), var(--lo));
    box-shadow: 0 0 0 3px rgba(255,77,109,.14), 0 2px 6px rgba(255,77,109,.35);
    flex: 0 0 auto;
  }
  h1 {
    margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .3px;
    background: linear-gradient(90deg, var(--hi), var(--lo));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap;
  }
  /* 数据源切换：官网源 / 本机源（PillBar，玻璃胶囊） */
  .srcbar {
    display: flex; gap: 4px; margin-left: 20px;
    background: var(--glass-soft); border-radius: 11px; padding: 4px;
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    box-shadow: var(--glass-border);
  }
  .src {
    padding: 4px 18px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: var(--fg-dim); white-space: nowrap; user-select: none;
    transition: background .18s, color .18s, box-shadow .18s;
  }
  .src:hover { color: var(--fg); background: rgba(255,255,255,.5); }
  .src.active {
    color: #fff;
    background: linear-gradient(135deg, var(--hi), var(--lo));
    box-shadow: 0 3px 10px rgba(255,77,109,.35), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .spacer { flex: 1 1 auto; }
  .ver { color: var(--fg-dim); font-size: 12px; }
  /* 沉浸式窗口控制按钮（关系统标题栏后接管 最小化/关闭） */
  .winbtns {
    display: flex; gap: 6px; flex: 0 0 auto; margin-left: 10px;
    /* 按钮不属于拖拽区：点按钮不能被当成拖窗口 */
    -webkit-app-region: no-drag; app-region: no-drag;
  }
  .wbtn {
    width: 28px; height: 26px; border-radius: 8px;
    border: 1px solid var(--line-soft); background: var(--glass-strong);
    color: var(--fg-dim); font-size: 13px; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: var(--glass-border);
    transition: color .15s, background .15s, box-shadow .15s;
  }
  .wbtn:hover { color: var(--fg); background: rgba(255,255,255,.85); }
  .wbtn.wclose:hover {
    color: #fff; background: #e5484d; border-color: #e5484d;
    box-shadow: 0 2px 8px rgba(229,72,77,.4);
  }

  /* ── 主体：左列表(344px) + 右播放区 ── */
  main { flex: 1 1 auto; display: flex; min-height: 0; }

  aside {
    width: 344px; flex: 0 0 344px;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line-soft);
    min-height: 0;
    /* 玻璃侧边栏：半透明白磨砂，与顶栏同一材质 */
    background: var(--glass);
    backdrop-filter: blur(26px) saturate(160%);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
  }
  /* 分类/分组选择器（下拉） */
  .selbar { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); flex: 0 0 auto; }
  .selrow { display: flex; align-items: center; gap: 8px; }
  .sellabel { color: var(--fg-dim); font-size: 13px; flex: 0 0 auto; }
  .selbar select {
    flex: 1 1 auto; min-width: 0; padding: 8px 10px; border-radius: 9px;
    background: var(--glass-strong); color: var(--fg);
    border: 1px solid var(--line-soft); font-size: 13px; outline: none;
    box-shadow: var(--glass-border);
    transition: border-color .15s, box-shadow .15s;
  }
  .selbar select:hover { border-color: var(--line-strong); }
  .selbar select:focus { border-color: var(--hi); box-shadow: 0 0 0 3px rgba(255,77,109,.14); }
  .selbar select option { background: #ffffff; color: var(--fg); }
  #chans { flex: 1 1 auto; overflow-y: auto; margin: 0; padding: 10px 10px 12px; list-style: none; }
  #chans li {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 9px; border-radius: 10px; margin-bottom: 3px; cursor: pointer;
    background: transparent; border: 1px solid transparent;
    transition: background .15s, box-shadow .15s;
  }
  #chans li:hover { background: rgba(255,255,255,.55); }
  #chans li.on {
    border-color: rgba(255,255,255,.7);
    background: linear-gradient(90deg, rgba(255,77,109,.14), rgba(255,107,53,.07)),
                rgba(255,255,255,.7);
    box-shadow: var(--glass-border), var(--glass-shadow);
  }
  .idx {
    width: 22px; height: 22px; border-radius: 6px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 11px;
    font-family: ui-monospace, monospace;
    background: linear-gradient(135deg, var(--hi), var(--lo)); color: #fff;
  }
  /* ── 频道彩色方块（对齐参考 UI：CCTV 显示台号，其它显示首字）── */
  .tile {
    width: 24px; height: 24px; border-radius: 7px; flex: 0 0 auto;
    display: grid; place-items: center;
    color: #fff; font-size: 11.5px; font-weight: 600;
    letter-spacing: -.2px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.26), 0 2px 5px rgba(0,0,0,.12);
  }
  /* 收藏星：默认淡，已收藏高亮，hover 放大一点 */
  .star {
    flex: 0 0 auto; width: 22px; text-align: center;
    color: #b6bccd; font-size: 14px; cursor: pointer;
    transition: color .15s, transform .15s;
  }
  .star:hover { color: var(--fg); transform: scale(1.15); }
  .star.on { color: #f5a623; }
  .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dim { color: var(--fg-dim); font-size: 12px; }
  .chinfo {
    color: var(--fg-dim); font-size: 12px; margin-right: 14px;
    font-family: ui-monospace, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── 右侧播放区（黑视频区） ── */
  section { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .stage {
    flex: 1 1 auto; display: grid; place-items: center;
    position: relative; min-height: 0; background: #0b0d12;
  }
  .stage .ph {
    color: var(--fg-dim); font-size: 15px; text-align: center; line-height: 2;
    /* ★ 频道刚点下去时不要「啪」地弹出一行字：淡入 + 轻微上浮，观感连贯 */
    animation: phIn .34s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes phIn {
    from { opacity: 0; transform: translateY(10px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  /* 旋转指示器：只在新频道加载中显示（初始「点左侧频道」占位不带） */
  .spin {
    width: 26px; height: 26px; margin: 0 auto 16px;
    border: 2px solid rgba(28,35,48,.14);
    border-top-color: var(--hi);
    border-right-color: var(--lo);
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stage .ph b {
    display: block; font-size: 22px;
    background: linear-gradient(90deg, var(--hi), var(--lo));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .info {
    flex: 0 0 auto; padding: 10px 18px;
    border-top: 1px solid var(--line-soft); color: var(--fg-dim); font-size: 12px;
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    font-family: ui-monospace, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── 底部控制条（频道名 / 线路切换 / 全屏）──────────────────────────
     ★ 位置说明：它紧贴 .stage 下方、**不在**播放区内部。
       本机源是 mpv 原生子窗口、官网源是 WebView2 直播窗，两者都会盖住
       播放区里的 HTML；控制条放在播放区之外才点得到。 */
  .ctrl {
    flex: 0 0 auto; height: 46px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px;
    border-top: 1px solid var(--line-soft);
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    font-size: 12.5px; color: var(--fg-dim);
    user-select: none;
  }
  .c-l { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  .cdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #c3c9d8; flex: 0 0 auto; transition: background .2s, box-shadow .2s;
  }
  .cdot.on { background: var(--hi); box-shadow: 0 0 8px var(--hi); }
  .cname {
    color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cstat { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-m { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .cline {
    min-width: 78px; text-align: center;
    font-family: ui-monospace, Consolas, monospace;
  }
  .cbtn {
    border: 1px solid var(--line-soft); background: var(--glass-strong); color: var(--fg);
    border-radius: 8px; height: 27px; min-width: 28px; padding: 0 9px;
    font-size: 12.5px; line-height: 1; cursor: pointer;
    box-shadow: var(--glass-border);
    transition: border-color .15s, color .15s, opacity .15s, box-shadow .15s;
  }
  .cbtn:hover:not(:disabled) { border-color: var(--hi); color: var(--hi); box-shadow: 0 0 0 3px rgba(255,77,109,.12); }
  .cbtn:disabled { opacity: .4; cursor: default; }
  .cbtn.wide { padding: 0 13px; }
  /* 全屏时收起顶栏和左侧列表，只留画面 + 控制条 */
  body.fs header, body.fs aside { display: none; }

  /* ── 控制条扩展：音量 / 画面适应 / 节目单 ── */
  .vol { display: flex; align-items: center; gap: 6px; }
  .vol input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 84px; height: 4px; border-radius: 2px;
    background: rgba(120,132,168,.28); outline: none; cursor: pointer;
  }
  .vol input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--hi); border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(255,77,109,.4); cursor: pointer;
  }
  select.cbtn { padding: 0 6px; height: 27px; }
  select.cbtn option { background: #ffffff; color: var(--fg); }
  .c-r { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

  /* ── 节目单弹层 ── */
  .epg-mask {
    position: fixed; inset: 0; z-index: 9998;
    background: rgba(24,28,40,.32);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 60px;
  }
  .epg-card {
    width: min(520px, 88vw); max-height: 62vh; display: flex; flex-direction: column;
    border-radius: 16px; background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(170%);
    -webkit-backdrop-filter: blur(30px) saturate(170%);
    box-shadow: var(--glass-border), var(--glass-shadow);
    color: var(--fg);
  }
  .epg-head {
    padding: 14px 18px 10px; font-size: 15px; font-weight: 600;
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between;
  }
  .epg-head span { font-size: 12px; color: var(--fg-dim); font-weight: 400; }
  .epg-body { overflow-y: auto; padding: 8px 10px 12px; }
  .epg-row {
    display: flex; gap: 12px; padding: 8px 10px; border-radius: 10px;
    font-size: 13px; line-height: 1.5;
  }
  .epg-row:nth-child(odd) { background: rgba(120,132,168,.06); }
  .epg-row .t {
    flex: 0 0 52px; color: var(--hi);
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  }
  .epg-row .n { flex: 1 1 auto; color: var(--fg); }
  .epg-empty { padding: 26px 0; text-align: center; color: var(--fg-dim); font-size: 13px; }

  /* ── 线路耗尽弹窗（本机源 / 官网源各自独立） ── */
  .exhaust-mask {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(24,28,40,.36);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
  }
  .exhaust-card {
    width: min(360px, 86vw); padding: 22px 22px 18px;
    border-radius: 16px; background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(170%);
    -webkit-backdrop-filter: blur(30px) saturate(170%);
    box-shadow: var(--glass-border), var(--glass-shadow);
    color: var(--fg);
  }
  .exhaust-card b {
    display: block; font-size: 17px; margin-bottom: 8px;
    background: linear-gradient(90deg, var(--hi), var(--lo));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .exhaust-card p { margin: 0 0 6px; color: var(--fg-dim); font-size: 13px; line-height: 1.7; }
  .exhaust-card .btns { display: flex; gap: 10px; margin-top: 16px; }
  .exhaust-card button {
    flex: 1 1 auto; padding: 9px 0; border: 1px solid var(--line-soft); border-radius: 10px;
    background: rgba(255,255,255,.55); color: var(--fg); font-size: 14px; cursor: pointer;
    box-shadow: var(--glass-border);
  }
  .exhaust-card button:hover { background: rgba(255,255,255,.8); }
  .exhaust-card button.primary {
    border: none; color: #fff; font-weight: 600;
    background: linear-gradient(135deg, var(--hi), var(--lo));
    box-shadow: 0 4px 14px rgba(255,77,109,.4), inset 0 1px 0 rgba(255,255,255,.35);
  }
</style>
</head>
<body>
  <header data-tauri-drag-region>
    <span class="brand-dot"></span>
    <h1>纯净电视直播</h1>
    <!-- 数据源切换（对齐早前 desktop）：本机源（api 分类）/ 官网源（cctv·央视频·地方 分组） -->
    <div class="srcbar" id="srcbar">
      <span class="src active" data-src="local">本机源</span>
      <span class="src" data-src="official">官网源</span>
    </div>
    <span class="spacer"></span>
    <span class="chinfo" id="chinfo"></span>
    <span class="ver" id="ver">加载中…</span>
    <!-- 沉浸式窗口控制（关系统标题栏后，由这里接管 最小化/关闭） -->
    <div class="winbtns">
      <button class="wbtn" id="minBtn" title="最小化" aria-label="最小化">─</button>
      <button class="wbtn wclose" id="closeBtn" title="关闭" aria-label="关闭">✕</button>
    </div>
  </header>

  <main>
    <aside>
      <div class="selbar">
        <div class="selrow">
          <span class="sellabel" id="selLabel">分类</span>
          <select id="catsel"></select>
        </div>
      </div>
      <ul id="chans"><li class="dim">加载中…</li></ul>
    </aside>

    <section>
      <div class="stage" id="stage">
        <div class="ph">
          <b>纯净电视直播</b>
          <span>点左侧频道开始播放</span>
        </div>
      </div>
      <div class="ctrl" id="ctrl">
        <div class="c-l">
          <span class="cdot" id="cdot"></span>
          <span class="cname" id="cname">未播放</span>
          <span class="cstat" id="cstat"></span>
        </div>
        <div class="c-m">
          <button class="cbtn wide" id="fsBtn" title="全屏（F11）">⛶ 全屏</button>
          <button class="cbtn wide" id="epgBtn" title="节目单">节目单</button>
          <div class="vol">
            <button class="cbtn" id="muteBtn" title="静音">🔊</button>
            <input type="range" id="volRange" min="0" max="100" value="80" title="音量">
          </div>
          <select class="cbtn" id="fitSel" title="画面适应">
            <option value="fit">画面适应</option>
            <option value="crop">裁剪填满</option>
            <option value="stretch">拉伸铺满</option>
          </select>
        </div>
        <div class="c-r">
          <button class="cbtn wide" id="linePrev" title="上一条线路（←）">◀ 上一线路</button>
          <button class="cbtn wide" id="pauseBtn" title="暂停 / 继续（空格）">⏸ 暂停</button>
          <button class="cbtn wide" id="lineNext" title="下一条线路（→）">下一线路 ▶</button>
          <span class="cline" id="cline">—</span>
          <button class="cbtn" id="favBtn" title="收藏本频道">☆</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 节目单弹层（默认隐藏） -->
  <div class="epg-mask" id="epgMask" style="display:none">
    <div class="epg-card">
      <div class="epg-head">
        <span id="epgTitle">节目单</span>
        <span id="epgSub"></span>
      </div>
      <div class="epg-body" id="epgBody"></div>
    </div>
  </div>

<script>
  // ★ 顶部自检：不依赖 __TAURI__，先确认页面加载 + __TAURI__ 是否注入。
  (function () {
    try {
      const flag = !!window.__TAURI__ && !!window.__TAURI__.core;
      document.title = 'TV_' + (flag ? 'TAURI_OK' : 'TAURI_MISSING');
    } catch (e) {
      document.title = 'TV_TOP_ERR';
    }
  })();
  const { invoke } = window.__TAURI__.core;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 数据源维度（与后端 Category.src 对齐，见早前 desktop 的两源结构）：
  //   local    = 本机源（api 分类：综合/体育/央视/卫视/极速港澳台/港澳台）
  //   official = 官网源（WebViewTvLive 分组：央视/央视数字/国家/… 共 51 组）
  let curSrc = 'local';
  let curTid = '';          // 分类 tid（本机源=裸 tid，官网源=`w|分组`）
  let autoplayFired = false;

  // 分类数据（缓存，供切源时重建下拉）。
  let catsBySrc = { local: [], official: [] };

  // 选择器左侧文字：本机源叫「分类」、官网源叫「分组」（对齐旧版）。
  function selLabelText() { return curSrc === 'official' ? '分组' : '分类'; }

  async function loadCats() {
    try {
      const cats = await invoke('list_categories');
      catsBySrc.local = cats.filter((c) => c.src === 'local');
      catsBySrc.official = cats.filter((c) => c.src === 'official');
      rebuildCats();
    } catch (e) {
      document.getElementById('catsel').innerHTML =
        `<option>分类加载失败</option>`;
    }
  }

  /// 「★ 收藏」伪分类的 tid 标识（收藏跨源，所以不挂在任何真实 tid 下）
  const FAV_TID = '__fav__';

  /// 把「★ 收藏」项追加到下拉末尾（数量实时变）。
  function appendFavOption(sel) {
    const n = favArr().length;
    const o = document.createElement('option');
    o.value = FAV_TID;
    o.textContent = n ? `★ 收藏（${n}）` : '★ 收藏';
    sel.appendChild(o);
  }

  /// 刷新「★ 收藏」那一项的文字（收藏/取消后调用）。
  function syncFavOption() {
    const sel = document.getElementById('catsel');
    if (!sel) return;
    const o = sel.querySelector(`option[value="${FAV_TID}"]`);
    if (!o) return;
    const n = favArr().length;
    o.textContent = n ? `★ 收藏（${n}）` : '★ 收藏';
  }

  /// 渲染收藏列表：跨源汇总，条目点击会先切到它所属的源/分类再播。
  function renderFavList() {
    const list = document.getElementById('chans');
    const favs = favArr();
    if (!favs.length) {
      list.innerHTML = '<li class="dim">还没有收藏<br>在频道行右侧点 ☆ 即可加入</li>';
      const ci = document.getElementById('chinfo');
      if (ci) ci.textContent = '收藏 · 0 个频道';
      return;
    }
    renderChans(favs.map((f) => ({ id: f.id, name: f.name, tid: f.tid })), true);
  }

  // 按当前源重建下拉，并选中该源第一个分类。数据未就绪时给诚实提示。
  function rebuildCats() {
    const sel = document.getElementById('catsel');
    document.getElementById('selLabel').textContent = selLabelText();
    const cats = curSrc === 'official' ? catsBySrc.official : catsBySrc.local;
    if (!cats.length) {
      sel.innerHTML = `<option>加载中…</option>`;
      const list = document.getElementById('chans');
      list.innerHTML = curSrc === 'official'
        ? '<li class="dim">正在解密官网源频道表…<br>（GitHub 数据下载 + AES 解密，约数秒）</li>'
        : '<li class="dim">正在连接本机源接口…<br>（镜像回退 + 后台自动重试）</li>';
      curTid = '';
      return;
    }
    sel.innerHTML = cats.map((c) =>
      `<option value="${esc(c.tid)}">${esc(c.name)}</option>`
    ).join('');
    appendFavOption(sel);   // ★ 收藏永远排在最后
    curTid = cats[0].tid;
    loadChans();
  }

  function switchSrc(src) {
    if (src === curSrc) return;
    curSrc = src;
    // ★ 切源瞬间清空频道列表并失效 curTid：loadCats 是异步的，残留的旧源列表
    //   会被 autoplay/用户点击点到。清空后轮询自然等新源列表渲染。
    curTid = '';
    document.getElementById('chans').innerHTML = '<li class="dim">加载中…</li>';
    document.querySelectorAll('#srcbar .src').forEach((n) =>
      n.classList.toggle('active', n.dataset.src === src));
    document.getElementById('selLabel').textContent = selLabelText();
    // ★ 切源时重新拉一次分类：官网源分组由后台解密（可能比首屏晚到）。
    loadCats();
  }

  async function loadChans() {
    const list = document.getElementById('chans');
    // 「★ 收藏」是前端伪分类，不走后端
    if (curTid === FAV_TID) { renderFavList(); return; }
    // ★ 过期渲染防护：记录发起时的分类，返回时若已切走则丢弃结果——
    //   否则旧分类数据会带着新分类的 data-tid 渲染（renderChans 读全局 curTid）。
    const tidAtStart = curTid;
    list.innerHTML = '<li class="dim">加载中…</li>';
    if (!curTid) { list.innerHTML = '<li class="dim">（空）</li>'; return; }
    // ★ 预抓取在后台进行，提前打开分类会拿到「尚未预抓取完成」。
    //   自动重试直到就绪（最多 30 次 × 1s），失败才放弃。
    for (let attempt = 0; attempt < 30; attempt++) {
      try {
        const chans = await invoke('list_channels', { tid: tidAtStart });
        if (curTid !== tidAtStart) return;
        renderChans(chans);
        return;
      } catch (e) {
        const msg = String(e);
        if (msg.includes('尚未预抓取完成') && attempt < 29) {
          await new Promise((r) => setTimeout(r, 1000));
          continue;
        }
        list.innerHTML = `<li class="dim">加载失败：${esc(msg)}</li>`;
        return;
      }
    }
  }

  // ── 频道方块配色：按序号循环取色（对齐参考 UI 的多彩效果）──
  const TILE_COLORS = [
    '#22b8cf', '#4c6ef5', '#e03131', '#2f9e44', '#f08c00',
    '#7048e8', '#0ca678', '#c2255c', '#74b816', '#1971c2',
  ];

  /// 方块里的字：CCTV-N 取台号，其余取首字（去掉括号里的补充说明）。
  function tileText(name) {
    const s = String(name || '?').replace(/[（(].*?[)）]/g, '').trim();
    const m = s.match(/CCTV[-\s]?(\d+)/i);
    if (m) return m[1];
    if (/CGTN/i.test(s)) return 'G';
    return s.charAt(0) || '?';
  }

  // ── 收藏（本地持久化，跨源用 tid+id 标识）──
  const FAV_KEY = 'ctv_favs_v1';
  function favArr() {
    try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch (e) { return []; }
  }
  function isFav(tid, id) {
    return favArr().some((f) => f.tid === tid && String(f.id) === String(id));
  }
  function toggleFav(tid, id, name) {
    const a = favArr();
    const i = a.findIndex((f) => f.tid === tid && String(f.id) === String(id));
    if (i >= 0) a.splice(i, 1);
    else a.unshift({ tid, id, name });
    try { localStorage.setItem(FAV_KEY, JSON.stringify(a)); } catch (e) { /* 忽略 */ }
    return i < 0;
  }

  function renderChans(chans, isFavView) {
    const list = document.getElementById('chans');
    if (!chans || !chans.length) {
      list.innerHTML = '<li class="dim">（空）</li>';
      return;
    }
    list.innerHTML = chans.map((c, i) => {
      // 收藏视图里每项自带 tid（来自别的分组/源）；普通视图统一用 curTid
      const rowTid = c.tid || curTid;
      const fav = isFav(rowTid, c.id) ? ' on' : '';
      const color = TILE_COLORS[i % TILE_COLORS.length];
      return `<li data-id="${esc(c.id)}" data-name="${esc(c.name)}" data-tid="${esc(rowTid)}">
         <span class="tile" style="background:${color}">${esc(tileText(c.name))}</span>
         <span class="name">${esc(c.name)}</span>
         <span class="star${fav}" title="收藏">${fav ? '★' : '☆'}</span>
       </li>`;
    }).join('');
    // 顶栏信息：源 · 分组 · 频道数（对齐参考 UI 右上角那行）
    const ci = document.getElementById('chinfo');
    if (ci) {
      const sel = document.getElementById('catsel');
      const gname = sel && sel.selectedOptions && sel.selectedOptions[0]
        ? sel.selectedOptions[0].textContent : '';
      ci.textContent = isFavView
        ? `收藏 · ${chans.length} 个频道`
        : `${curSrc === 'official' ? '官网源' : '本机源'}`
          + (gname ? ` · ${gname}` : '')
          + ` · ${chans.length} 个频道`;
    }

    list.querySelectorAll('li').forEach((node) => {
      // 星标：只切收藏，不触发播放
      const star = node.querySelector('.star');
      if (star) {
        star.addEventListener('click', (e) => {
          e.stopPropagation();
          const on = toggleFav(node.dataset.tid, node.dataset.id, node.dataset.name);
          star.classList.toggle('on', on);
          star.textContent = on ? '★' : '☆';
          syncFavBtn();
          syncFavOption();
          // 在收藏视图里取消收藏 → 该项立即消失
          if (curTid === FAV_TID && !on) renderFavList();
        });
      }
      node.addEventListener('click', () => {
        list.querySelectorAll('li').forEach((n) => n.classList.remove('on'));
        node.classList.add('on');
        // ★ 收藏视图里条目可能来自别的分类/源：先把 curTid/curSrc 切到它所属的地方，
        //   否则 play_channel 会拿着「收藏」这个伪 tid 去请求，直接失败。
        const rowTid = node.dataset.tid || curTid;
        if (rowTid && rowTid !== curTid) {
          const wantSrc = rowTid.startsWith('w|') ? 'official' : 'local';
          curTid = rowTid;
          if (wantSrc !== curSrc) {
            curSrc = wantSrc;
            document.querySelectorAll('#srcbar .src').forEach((n) =>
              n.classList.toggle('active', n.dataset.src === curSrc));
            document.getElementById('selLabel').textContent = selLabelText();
            rebuildCats();
          }
          const sel = document.getElementById('catsel');
          if (sel && sel.querySelector(`option[value="${CSS.escape(rowTid)}"]`)) {
            sel.value = rowTid;
          }
        }
        syncFavBtn();
        play(node.dataset.id, node.dataset.name);
      });
    });
    maybeAutoplay();
  }

  // 当前播放频道名 / id（play-failed 回推定位、收藏判断都用）。
  let curPlayName = '';
  let curPlayId = '';

  // ★★ 把播放区（#stage）在**视口内**的位置上报给后端。
  // mpv 播在独立的承载窗口里（不能直接嵌主窗口：WebView2 会把视频整块盖住，
  // 表现为「有声音没图像」），那个窗口必须精确落在播放区上。
  //
  // ★ 只报 **CSS 像素的相对偏移** + 视口 CSS 尺寸，屏幕坐标换算交给 Rust：
  //   JS 的 CSS 像素与 Win32 窗口坐标是两套空间（DPI 缩放），前端自己乘
  //   devicePixelRatio 必然漂（125% 缩放下实测偏差正好一个 dpr）。
  let lastRectKey = '';
  async function reportStageRect() {
    try {
      const stage = document.getElementById('stage');
      if (!stage) return;
      const r = stage.getBoundingClientRect();
      if (r.width < 16 || r.height < 16) return;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const x = Math.round(r.left);
      const y = Math.round(r.top);
      const w = Math.round(r.width);
      const h = Math.round(r.height);
      // ★★ 主窗口拖动时（onMoved），#stage 相对视口的 CSS 偏移 x/y 与视口
      //   尺寸 vw/vh **都不变**，所以这里**不能**用「x,y,w,h,vw,vh」做去重 key
      //   —— 否则拖动窗口时 key 与上次完全相同，直接 return，坐标永不上报，
      //   后端拿不到新屏幕坐标 → mpv 承载窗/官网直播窗停在旧屏幕位置，
      //   「拖一下，视频画面与主窗体分离」（用户实测截图白框分离）。
      //   而后端 report_stage_rect 里是「客户区尺寸 ÷ 视口尺寸」求缩放比 +
      //   ClientToScreen 现算客户区屏幕原点，只要收到上报就会重新定位——
      //   关键是**拖动必须真的上报**。这里去掉纯字号去重，仅当「几何完全没变
      //   （含窗口可能移动）」时仍需上报，故直接放开（report_stage_rect 幂等，
      //   多报几次只是 SetWindowPos 到同一坐标，无害）。
      await invoke('report_stage_rect', { x, y, w, h, vw, vh });
      lastRectKey = `${x},${y},${w},${h},${vw},${vh}`;
    } catch (e) { /* 坐标上报失败不影响播放 */ }
  }

  // 播放区几何变化（窗口缩放/移动）时重新上报。
  // ★ 注意：**顶层不能用 await**（脚本非 module，顶层 await 是语法错误，
  //   会让整个前端脚本不执行 —— 表现为日志里连 boot:enter 都没有）。
  try {
    window.addEventListener('resize', () => { reportStageRect(); });
    if (window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.onMoved) {
      window.__TAURI__.window.onMoved(() => { reportStageRect(); });
    }
  } catch (e) { /* 忽略 */ }

  // ── 底部控制条：频道名 / 线路切换 / 全屏 ──────────────────────────
  const C = {
    dot: document.getElementById('cdot'),
    name: document.getElementById('cname'),
    stat: document.getElementById('cstat'),
    line: document.getElementById('cline'),
    prev: document.getElementById('linePrev'),
    next: document.getElementById('lineNext'),
    fs: document.getElementById('fsBtn'),
    pause: document.getElementById('pauseBtn'),
    epg: document.getElementById('epgBtn'),
    mute: document.getElementById('muteBtn'),
    vol: document.getElementById('volRange'),
    fit: document.getElementById('fitSel'),
    fav: document.getElementById('favBtn'),
  };

  function ctrlSet(stat, playing) {
    if (C.stat) C.stat.textContent = stat || '';
    if (C.dot) C.dot.classList.toggle('on', !!playing);
  }

  /// 从后端拉一次当前播放信息（线路 x/y、能否切换）。
  async function ctrlRefresh() {
    try {
      const n = await invoke('now_playing');
      if (C.name) C.name.textContent = n.name || '未播放';
      if (C.line) {
        if (n.total > 0) C.line.textContent = `线路 ${n.index + 1}/${n.total}`;
        else if (n.src === 'official') C.line.textContent = '官网源';
        else C.line.textContent = '—';
      }
      if (C.prev) C.prev.disabled = !n.can_switch;
      if (C.next) C.next.disabled = !n.can_switch;
    } catch (e) { /* 控制条出错不能影响播放 */ }
  }

  async function switchLine(delta) {
    try {
      ctrlSet('切换线路…', false);
      await invoke('switch_line', { delta });
      // 结果由 play-started / play-failed 事件回推后刷新
    } catch (e) {
      ctrlSet(String(e).slice(0, 60), false);
    }
  }

  async function toggleFs() {
    try {
      const on = await invoke('toggle_fullscreen');
      document.body.classList.toggle('fs', !!on);
      if (C.fs) C.fs.textContent = on ? '⛶ 退出全屏' : '⛶ 全屏';
      // ★ 全屏改变播放区几何 → 必须重新上报，mpv 承载窗 / 官网直播窗要跟着变。
      //   两次是有意的：一次赶在布局完成，一次兜住窗口尺寸动画结束。
      setTimeout(() => { reportStageRect(); }, 120);
      setTimeout(() => { reportStageRect(); }, 420);
    } catch (e) { /* 忽略 */ }
  }

  // 自动化测试钩子（CLEAN_TV_SWITCH_AT）：后端到点回推，切到指定频道
  try {
    window.__TAURI__.event.listen('auto-play', (ev) => {
      const parts = String(ev.payload || '').split('|');
      const tid = parts[0] || '';
      const cid = parts[1] || '';
      const nm = parts[2] || cid;
      if (!tid || !cid) return;
      const wantSrc = tid.startsWith('w|') ? 'official' : 'local';
      if (wantSrc !== curSrc) {
        curSrc = wantSrc;
        document.querySelectorAll('#srcbar .src').forEach((n) =>
          n.classList.toggle('active', n.dataset.src === curSrc));
        document.getElementById('selLabel').textContent = selLabelText();
        rebuildCats();
      }
      curTid = tid;
      const sel = document.getElementById('catsel');
      if (sel && sel.querySelector(`option[value="${CSS.escape(tid)}"]`)) sel.value = tid;
      // 打上选中态（列表可能还没渲染出这个频道，不打也不影响播放）
      const li = document.querySelector(`#chans li[data-id="${CSS.escape(String(cid))}"]`);
      if (li) {
        document.querySelectorAll('#chans li').forEach((n) => n.classList.remove('on'));
        li.classList.add('on');
      }
      play(cid, nm);
    });
  } catch (e) { /* 忽略 */ }

  // 自动化测试钩子（CLEAN_TV_AUTOFULLSCREEN）：后端到点回推，直接切全屏
  try {
    window.__TAURI__.event.listen('auto-fullscreen', () => { toggleFs(); });
  } catch (e) { /* 忽略 */ }

  if (C.prev) C.prev.onclick = () => switchLine(-1);
  if (C.next) C.next.onclick = () => switchLine(1);
  if (C.fs) C.fs.onclick = toggleFs;

  // ── 沉浸式窗口控制（最小化 / 关闭）───────────────────────────────
  const minBtn = document.getElementById('minBtn');
  const closeBtn = document.getElementById('closeBtn');
  if (minBtn) minBtn.onclick = () => { try { invoke('minimize_window'); } catch (e) {} };
  if (closeBtn) closeBtn.onclick = () => { try { invoke('close_window'); } catch (e) {} };

  // ── 暂停 / 音量 / 静音 / 画面适应 ────────────────────────────────
  let pausedNow = false;
  let mutedNow = false;
  let lastVol = 80;

  async function setPause(on) {
    pausedNow = !!on;
    if (C.pause) C.pause.textContent = pausedNow ? '▶ 继续' : '⏸ 暂停';
    try { await invoke('set_pause', { paused: pausedNow }); } catch (e) { /* 忽略 */ }
  }

  function syncMuteIcon() {
    if (C.mute) C.mute.textContent = mutedNow ? '🔇' : '🔊';
  }

  if (C.pause) C.pause.onclick = () => setPause(!pausedNow);

  if (C.vol) {
    C.vol.oninput = () => {
      const v = Number(C.vol.value);
      lastVol = v;
      mutedNow = v === 0;
      syncMuteIcon();
      invoke('set_volume', { v }).catch(() => {});
    };
    // 启动即给 mpv 一个初始音量，避免沿用系统默认导致过响/过轻
    invoke('set_volume', { v: Number(C.vol.value) }).catch(() => {});
  }
  if (C.mute) {
    C.mute.onclick = () => {
      mutedNow = !mutedNow;
      const v = mutedNow ? 0 : (lastVol || 80);
      if (C.vol) C.vol.value = String(v);
      syncMuteIcon();
      invoke('set_volume', { v }).catch(() => {});
    };
  }
  if (C.fit) {
    C.fit.onchange = () => {
      invoke('set_fit', { mode: C.fit.value }).catch(() => {});
    };
  }

  // ── 收藏（当前频道）─────────────────────────────────────────────
  function syncFavBtn() {
    if (!C.fav) return;
    const on = curTid && curPlayId && isFav(curTid, curPlayId);
    C.fav.textContent = on ? '★' : '☆';
    C.fav.style.color = on ? '#ffc53d' : '';
  }
  if (C.fav) {
    C.fav.onclick = () => {
      if (!curTid || !curPlayId) return;
      const on = toggleFav(curTid, curPlayId, curPlayName);
      syncFavBtn();
      syncFavOption();
      // 列表里的星标同步
      const li = document.querySelector(`#chans li[data-id="${CSS.escape(String(curPlayId))}"]`);
      const star = li && li.querySelector('.star');
      if (star) {
        star.classList.toggle('on', on);
        star.textContent = on ? '★' : '☆';
      }
    };
  }

  // ── 节目单弹层 ─────────────────────────────────────────────────
  async function openEpg() {
    const mask = document.getElementById('epgMask');
    const body = document.getElementById('epgBody');
    const sub = document.getElementById('epgSub');
    if (!mask || !body) return;
    mask.style.display = 'flex';
    if (sub) sub.textContent = curPlayName || '';
    body.innerHTML = '<div class="epg-empty">正在获取节目单…</div>';
    try {
      const list = await invoke('now_epg');
      if (!list || !list.length) {
        body.innerHTML = '<div class="epg-empty">该频道暂无节目单（官网源不提供）</div>';
        return;
      }
      body.innerHTML = list.map((it) =>
        `<div class="epg-row"><span class="t">${esc(it.time)}</span><span class="n">${esc(it.name)}</span></div>`
      ).join('');
    } catch (e) {
      body.innerHTML = `<div class="epg-empty">获取失败：${esc(String(e))}</div>`;
    }
  }
  if (C.epg) C.epg.onclick = openEpg;
  {
    const mask = document.getElementById('epgMask');
    if (mask) mask.addEventListener('click', (e) => {
      if (e.target === mask) mask.style.display = 'none';   // 点遮罩关闭
    });
  }

  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(tag);
    if (e.key === 'F11') { e.preventDefault(); toggleFs(); }
    else if (!typing && e.key === 'Escape') {
      const mask = document.getElementById('epgMask');
      if (mask && mask.style.display !== 'none') mask.style.display = 'none';
    }
    else if (!typing && e.key === ' ') { e.preventDefault(); setPause(!pausedNow); }
    else if (!typing && e.key === 'ArrowLeft') { switchLine(-1); }
    else if (!typing && e.key === 'ArrowRight') { switchLine(1); }
  });

  async function play(id, name) {
    const stage = document.getElementById('stage');
    curPlayName = name;
    curPlayId = id;
    // 换台视为新的播放会话：暂停态归零，收藏按钮跟着刷新
    pausedNow = false;
    if (C.pause) C.pause.textContent = '⏸ 暂停';
    syncFavBtn();
    if (C.name) C.name.textContent = name;
    ctrlSet('', false);
    // ★ 先上报播放区几何（承载窗口要落在这一块）。
    await reportStageRect();
    if (curSrc === 'official') {
      // 官网源：直连缓存命中零网络即播；网页线路频道自动按名切备用源。
      stage.innerHTML =
        `<div class="ph"><div class="spin"></div><b>${esc(name)}</b><span>正在加载官网源线路…</span></div>`;
      ctrlSet('正在加载官网源线路…', false);
    } else {
      // 本机源：抓播放页 XOR 解密出直链（约 1~3 秒），后台线程执行。
      stage.innerHTML =
        `<div class="ph"><div class="spin"></div><b>${esc(name)}</b><span>实时获取播放线路中…</span></div>`;
      ctrlSet('正在获取本机源线路（约 1~3 秒）…', false);
    }
    try {
      const r = await invoke('play_channel', { tid: curTid, cid: id, name: name });
      if (r.ok && (r.msg === 'streaming' || r.msg === 'fallback-streaming')) {
        // 后台取流中：成功 mpv 自动接管画面，失败走 play-failed 事件，这里不终态。
        ctrlSet(r.msg === 'fallback-streaming'
          ? '该频道无直连，已切备用线路，获取中…'
          : '正在获取播放线路…', false);
        return;
      }
      ctrlSet(r.ok
        ? `线路 ${r.index + 1}/${r.total} · 已接管画面`
        : `播放失败：${r.msg || '无线路'}`, r.ok);
      stage.innerHTML = r.ok
        ? ''
        : `<div class="ph"><b>${esc(name)}</b><span>播放失败</span></div>`;
      if (r.ok) ctrlRefresh();
    } catch (e) {
      ctrlSet(`播放失败：${e}`, false);
      stage.innerHTML =
        `<div class="ph"><b>${esc(name)}</b><span>播放失败：${esc(e)}</span></div>`;
    }
  }

  // 后台取流失败回推（789 取流在 Rust 后台线程执行，命令已先返回）。
  try {
    window.__TAURI__.event.listen('play-failed', (ev) => {
      const msg = String(ev.payload ?? '');
      const name = curPlayName || '频道';
      ctrlSet(`播放失败：${msg}`, false);
      document.getElementById('stage').innerHTML =
        `<div class="ph"><b>${esc(name)}</b><span>播放失败：${esc(msg)}</span></div>`;
    });
  } catch (e) { console.error('play-failed 监听注册失败', e); }

  // ★ 后台「真的出画」回推（Rust 的 wait_video 判据 = mpv 视频子窗口已创建）。
  //   出画后清掉播放区占位文字、更新底部信息栏。
  //   （承载窗是独立顶层窗口、盖在 #stage 上，占位文字其实被挡住了，
  //     但保留它会在窗口缩放/承载窗隐藏时露出来，信息栏文案也要跟上。）
  try {
    window.__TAURI__.event.listen('play-started', (ev) => {
      const name = String(ev.payload ?? '') || curPlayName || '';
      const stage = document.getElementById('stage');
      if (stage) {
        const ph = stage.querySelector('.ph');
        // 只清占位，不动别的内容
        if (ph) ph.remove();
      }
      if (name && C.name) C.name.textContent = name;
      ctrlSet('播放中', true);
      ctrlRefresh();   // 出画后才知道总线路数，这里补上「线路 x/y」
    });
  } catch (e) { console.error('play-started 监听注册失败', e); }

  // ★★ 线路耗尽弹窗（本机源 / 官网源各自独立，两源互不通）。
  //   Rust 侧在「本频道所有线路重试完仍失败 / 无可用线路」时回推
  //   `local-exhausted` 或 `official-exhausted`，payload = `tid|cid|name|reason`。
  //   弹两个按钮：① 继续重试本频道（重新走完整取流）② 切当前列表下一个频道。
  let lastExhaustKey = '';
  function showExhaustDialog(evName, tid, cid, name, reason) {
    // 去掉 Rust 侧把 label 里管道符当作分隔的歧义：payload 用前两个 | 切出 tid/cid，
    //   其余全算 name+reason（Rust 里 label 不含 `|`，故 tid|cid 一定是前两段）。
    // 防重：同一频道同一秒重复弹窗只保留一个。
    const key = evName + '|' + tid + '|' + cid;
    const now = Date.now();
    if (key === lastExhaustKey) return;   // 连续重复直接吞掉
    lastExhaustKey = key;
    // 关掉可能残留的旧弹窗
    document.querySelectorAll('.exhaust-mask').forEach((n) => n.remove());

    const srcName = evName === 'local-exhausted' ? '本机源' : '官网源';
    const mask = document.createElement('div');
    mask.className = 'exhaust-mask';
    mask.innerHTML = `
      <div class="exhaust-card">
        <b>${esc(name)}</b>
        <p>${srcName}所有线路都已尝试，仍无法播放。</p>
        <p style="font-size:12px;color:#6b7280;">${esc(reason || '')}</p>
        <div class="btns">
          <button class="retry">继续重试</button>
          <button class="primary next">下一个频道</button>
        </div>
      </div>`;
    document.body.appendChild(mask);

    // 继续重试：重新播放当前频道（完整重走取流）。
    mask.querySelector('.retry').addEventListener('click', () => {
      mask.remove();
      lastExhaustKey = '';   // 允许下次再弹
      play(cid, name);
    });
    // 下一个频道：定位当前列表里当前项的下一个 li；到底则回第一个。
    mask.querySelector('.next').addEventListener('click', () => {
      mask.remove();
      lastExhaustKey = '';
      const list = document.querySelectorAll(
        `#chans li[data-id][data-tid="${CSS.escape(curTid)}"]`);
      if (!list.length) return;
      let cur = -1;
      list.forEach((li, i) => { if (li.dataset.id === String(cid)) cur = i; });
      const next = cur >= 0 && cur + 1 < list.length ? list[cur + 1] : list[0];
      if (next) next.click();
    });
  }

  function wireExhaust(evName) {
    try {
      window.__TAURI__.event.listen(evName, (ev) => {
        const raw = String(ev.payload ?? '');
        const a = raw.split('|');
        const tid = a[0] || '';
        const cid = a[1] || '';
        const name = a[2] || curPlayName || '频道';
        const reason = a.slice(3).join('|');
        showExhaustDialog(evName, tid, cid, name, reason);
      });
    } catch (e) { console.error(evName + ' 监听注册失败', e); }
  }
  wireExhaust('local-exhausted');
  wireExhaust('official-exhausted');

  async function maybeAutoplay() {
    // ★ 防重入必须在任何 await 之前同步置位：renderChans 可能被两次渲染各调
    //   一次（loadCats 与验收钩子 loadChans 并发），若在 await invoke 之后才置
    //   autoplayFired，两次调用都会通过检查 → play_channel 派发两次（实测双份
    //   headless 取流，旧代次作废、白白浪费一条线路）。
    if (autoplayFired) return;
    autoplayFired = true;
    try {
      const env = await invoke('env_flag');
      if (env.autoplay) {
        // 可选：CLEAN_TV_AUTOPLAY_SRC=official 强制从官网源起播（验回落链路用）。
        try {
          const src = await invoke('env_flag_src');
          invoke('self_check', { report: JSON.stringify({ autoplay: 'src', src: String(src), v: 3 }) });
          // 支持 "official@ys" 格式：切官网源并选中指定分类（源站个别分类的
          // 播放页可能下线，如 tv 综合分类 404，验收时用正常分类）。
          const [srcName, wantTid] = String(src).split('@');
          if (srcName === 'official' && curSrc !== 'official') switchSrc('official');
          if (wantTid) {
            // 轮询等分类下拉出现目标分类（官网源分类晚到）再选中加载。
            let foundOpt = false;
            for (let i = 0; i < 40; i++) {
              const opt = document.querySelector(`#catsel option[value="${CSS.escape(wantTid)}"]`);
              if (opt) {
                foundOpt = true;
                curTid = wantTid;
                loadChans();
                break;
              }
              if (i === 5 || i === 15) {
                invoke('self_check', { report: JSON.stringify({ autoplay: 'wantTid-wait', i, opts: document.getElementById('catsel').innerHTML.slice(0, 200), v: 3 }) });
              }
              await new Promise((r) => setTimeout(r, 500));
            }
            if (!foundOpt) {
              invoke('self_check', { report: JSON.stringify({ autoplay: 'wantTid-timeout', wantTid, opts: document.getElementById('catsel').innerHTML.slice(0, 300), v: 3 }) });
            }
          }
        } catch (e) {
          invoke('self_check', { report: JSON.stringify({ autoplay: 'hook-error', err: String(e), v: 3 }) });
        }
        // ★ 定点验收钩子：CLEAN_TV_AUTOPLAY_CID=<n> —— 播当前分类里第 n 个频道
        //   （从 1 开始，按列表顺序）。缺省 = 第 1 个。
        //   用途：默认 autoplay 只播第 1 个（凤凰卫视中文台），而它恰被网络层
        //   封锁，测不出其它频道；定点钩子可指定 gt:6 / wintv123:NN 等。
        let wantCid = 0;
        try {
          const raw = String(await invoke('env_autoplay_cid') || '').trim();
          const n = parseInt(raw, 10);
          if (Number.isFinite(n) && n > 0) wantCid = n;
        } catch (e) { /* 老版本无此命令 → 取第 1 个 */ }
        // ★ 时序：switchSrc/loadChans 是异步的，立即点会点到「加载中…」占位
        //   （实测 chanCount=1 且无 data-id，点击落空、play_channel 根本不触发）。
        //   轮询等真实频道条目（带 data-id）出现再点，最长 10 秒。
        for (let i = 0; i < 60; i++) {
          // ★ 只认当前分类的条目：切源瞬间旧列表还在 DOM 里（loadCats 异步），
          //   不校验 data-tid 会点到旧源残留频道（实测点了本机源残留的 CCTV1）。
          const list = document.querySelectorAll(`#chans li[data-id][data-tid="${CSS.escape(curTid)}"]`);
          const li = wantCid > 0 ? list[wantCid - 1] : list[0];
          if (li) {
            li.click();
            invoke('self_check', { report: JSON.stringify({ autoplay: 'triggered', v: 3, src: curSrc, tid: curTid, chan: li.dataset.name, wantCid, total: list.length }) });
            return;
          }
          if (i === 20 && wantCid > 0) {
            invoke('self_check', { report: JSON.stringify({ autoplay: 'cid-wait', v: 3, wantCid, have: list.length }) });
          }
          await new Promise((r) => setTimeout(r, 500));
        }
        invoke('self_check', { report: JSON.stringify({ autoplay: 'timeout-no-chan', v: 3, src: curSrc, tid: curTid, wantCid }) });
      }
    } catch (e) { console.error('autoplay 钩子失败', e); }
  }

  async function boot() {
    await invoke('self_check', { report: JSON.stringify({ boot: 'enter' }) });
    // ★ 上报一次播放区几何（承载窗口初始定位）。
    await reportStageRect();
    try {
      const info = await invoke('app_info');
      document.getElementById('ver').textContent =
        `v${info.app_version} · ${info.profile}`;
      // 数据层信息不再占底部控制条（那里要放按钮），只在标题栏提示版本
      if (C.stat && !C.stat.textContent) C.stat.textContent = '';
    } catch (e) {
      document.getElementById('ver').textContent = `IPC 失败: ${e}`;
    }

    // 源切换事件
    document.querySelectorAll('#srcbar .src').forEach((n) =>
      n.addEventListener('click', () => switchSrc(n.dataset.src)));
    document.getElementById('catsel').addEventListener('change', (e) => {
      curTid = e.target.value;
      loadChans();
    });

    await loadCats();

    // ★ 验收钩子：CLEAN_TV_AUTOPLAY_TID=ys / w|央视 直接指定启动分类（绕开
    //   AUTOPLAY_SRC 的 switchSrc 轮询链路——实测该链路 wantTid 轮询静默卡住）。
    //   初始 loadChans(curTid=旧值) 的飞行结果由过期渲染防护丢弃。
    try {
      const at = await invoke('env_autoplay_tid');
      if (at) {
        curTid = at;
        curSrc = at.startsWith('w|') ? 'official' : 'local';
        document.querySelectorAll('#srcbar .src').forEach((n) =>
          n.classList.toggle('active', n.dataset.src === curSrc));
        document.getElementById('selLabel').textContent = selLabelText();
        const sel0 = document.getElementById('catsel');
        if (sel0.querySelector(`option[value="${CSS.escape(at)}"]`)) sel0.value = at;
        loadChans();
        invoke('self_check', { report: JSON.stringify({ autoplay: 'tid-set', tid: at, src: curSrc, v: 3 }) });
      }
    } catch (e) { /* 无该钩子则忽略 */ }

    // ★ 分类晚到补拉：两个源的预抓都在后台进行，可能比首屏晚到。
    //   每 5s 检查一次：用户停在当前源但分类仍为空，就重新拉分类（直到拉到）。
    setInterval(() => {
      if (!catsBySrc[curSrc].length) loadCats();
    }, 5000);

    // ★ 结构自检（延迟 9s，等两个源预抓都完成）：把两源完整分类名上报日志，
    //   供验收脚本判断「本机源 6 分类 / 官网源 51 分组」是否符合旧版结构。
    setTimeout(async () => {
      try {
        const cats = await invoke('list_categories');
        const pick = (s) => cats.filter((c) => c.src === s).map((c) => c.name);
        invoke('self_check', {
          report: JSON.stringify({ v: 4, local: pick('local'), official: pick('official') }),
        });
      } catch (e) { /* ignore */ }
    }, 9000);

    // 启动自检
    try {
      const aside = document.querySelector('aside');
      await invoke('self_check', {
        report: JSON.stringify({
          title: document.title,
          src: curSrc,
          catCount: document.querySelectorAll('#catsel option').length,
          chanCount: document.querySelectorAll('#chans li').length,
          hasStage: !!document.getElementById('stage'),
          asideBox: aside ? `${aside.clientWidth}x${aside.clientHeight}` : null,
          viewport: `${innerWidth}x${innerHeight}`,
        }),
      });
    } catch (e) { console.error('self_check 上报失败', e); }
  }

  boot();
</script>
