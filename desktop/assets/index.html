<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>纯净电视直播 · 电脑版</title>
<script src="/logos.js"></script>
<script src="/mpegts.js"></script>
<style>
  /* ==========================================================================
     设计令牌 —— 与安卓端同一套现代深色媒体语言（共享设计系统）
     ========================================================================*/
  :root{
    --bg:#0a0b0f;
    --bg-grad:radial-gradient(120% 80% at 50% -10%, #1b1220 0%, #0a0b0f 58%);
    --surface:rgba(255,255,255,.045);
    --surface-2:rgba(255,255,255,.085);
    --surface-solid:#16181f;
    --line:rgba(255,255,255,.075);
    --line-strong:rgba(255,255,255,.14);
    --fg:#f2f4f8;
    --fg-dim:#a2a9b8;
    --fg-mute:#6b7385;
    --brand:#ff2d55;
    --brand-2:#ff6b35;
    --brand-grad:linear-gradient(135deg,#ff2d55 0%,#ff6b35 100%);
    --gold:#ffc531;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 20px -6px rgba(0,0,0,.55);
    --shadow-lg:0 18px 48px -12px rgba(0,0,0,.7);
    --glow:0 0 0 1px rgba(255,45,85,.4), 0 6px 22px -4px rgba(255,45,85,.45);
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);background-image:var(--bg-grad);
    background-attachment:fixed;color:var(--fg);overflow:hidden;user-select:none;letter-spacing:.01em;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}

  /* ---------------- 顶栏（玻璃拟态） ---------------- */
  header{display:flex;align-items:center;gap:14px;padding:16px 24px 12px;
    background:linear-gradient(180deg,rgba(10,11,15,.9) 0%,rgba(10,11,15,.6) 78%,transparent 100%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid var(--line);}
  #brand{font-size:17px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:9px;
    letter-spacing:-.01em;}
  #brand::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand-grad);
    box-shadow:0 0 12px rgba(255,45,85,.85);}
  #brand b{display:none;}
  #cnt{color:var(--fg-mute);font-size:12px;font-weight:500;margin-left:2px;}
  #search{flex:1;max-width:360px;padding:10px 16px;border-radius:var(--r-md);border:1px solid var(--line);
    background:var(--surface);color:var(--fg);font-size:13.5px;outline:none;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease);}
  #search::placeholder{color:var(--fg-mute);}
  #search:focus{border-color:rgba(255,45,85,.5);background:var(--surface-2);box-shadow:var(--glow);}
  #spacer{flex:1;}
  .tip{color:var(--fg-mute);font-size:12px;white-space:nowrap;
    padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);}

  /* ---------------- 分类胶囊 ---------------- */
  #tabs{display:flex;gap:8px;padding:14px 24px 8px;overflow-x:auto;}
  #tabs::-webkit-scrollbar{height:0;}
  .tab{flex:0 0 auto;padding:8px 18px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--fg-dim);cursor:pointer;
    transition:all .22s var(--ease);}
  .tab:hover{background:var(--surface-2);color:var(--fg);transform:translateY(-1px);}
  .tab.on{background:var(--brand-grad);border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 4px 18px -5px rgba(255,45,85,.65);}

  /* ---------------- 频道网格 ---------------- */
  #scroller{height:calc(100% - 122px);overflow:auto;padding:10px 24px 44px;overscroll-behavior:contain;}
  #scroller::-webkit-scrollbar{width:11px;}
  #scroller::-webkit-scrollbar-track{background:transparent;}
  #scroller::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:999px;
    border:3px solid transparent;background-clip:padding-box;}
  #scroller::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:padding-box;
    border:3px solid transparent;}
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:12px;}
  .ch{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;
    display:flex;align-items:center;gap:11px;cursor:pointer;position:relative;min-height:58px;
    overflow:hidden;transition:background .2s var(--ease),border-color .2s var(--ease),
      transform .2s var(--ease),box-shadow .2s var(--ease);}
  .ch::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,45,85,.16),transparent 55%);
    opacity:0;transition:opacity .22s var(--ease);}
  .ch:hover{background:var(--surface-2);border-color:var(--line-strong);transform:translateY(-2px);
    box-shadow:var(--shadow-md);}
  .ch:hover::after{opacity:1;}
  .ch .lg,.ch .bd{width:44px;height:32px;flex:0 0 44px;border-radius:var(--r-sm);}
  .ch .lg{object-fit:contain;background:radial-gradient(circle at 50% 40%,#20222b,#0d0e13);
    padding:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
  .ch .bd{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
    color:#cfd4de;letter-spacing:.02em;overflow:hidden;
    background:linear-gradient(160deg,#2b303c,#1b1e26);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .ch .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:500;z-index:1;}
  .ch .star{position:absolute;right:6px;top:5px;font-size:13px;line-height:1;color:#33384a;
    padding:4px 6px;border-radius:var(--r-sm);z-index:2;transition:all .2s var(--ease);}
  .ch .star:hover{background:rgba(255,255,255,.09);color:var(--fg-dim);}
  .ch .star.on{color:var(--gold);text-shadow:0 0 10px rgba(255,197,49,.6);}
  #hint{color:var(--fg-mute);padding:60px 20px;text-align:center;grid-column:1/-1;font-size:14px;line-height:1.8;}

  /* ---------------- 播放层 ---------------- */
  #player{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;}
  #player.show{display:flex;}
  #vwrap{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;}
  #vwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 80px rgba(0,0,0,.55);}
  video{width:100%;height:100%;background:#000;display:block;}
  #status{position:absolute;left:0;right:0;top:45%;text-align:center;color:#e6e9f0;font-size:15px;
    font-weight:500;padding:0 30px;text-shadow:0 2px 14px rgba(0,0,0,.85);}
  #ctrl{background:rgba(12,13,18,.86);-webkit-backdrop-filter:blur(20px) saturate(160%);
    backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--line);
    transition:opacity .3s var(--ease);flex:0 0 auto;}
  #ctrl.hide{opacity:0;pointer-events:none;}
  #pbar{display:flex;align-items:center;gap:10px;padding:13px 24px 7px;}
  #cname{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    letter-spacing:-.01em;}
  .btn{padding:8px 15px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);
    color:var(--fg);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s var(--ease);}
  .btn:hover{background:var(--surface-2);border-color:var(--line-strong);transform:translateY(-1px);}
  .btn.act{background:var(--brand-grad);border-color:transparent;color:#fff;
    box-shadow:0 3px 16px -4px rgba(255,45,85,.7);}
  #lines{display:flex;gap:8px;overflow-x:auto;padding:3px 24px 14px;}
  #lines::-webkit-scrollbar{height:0;}
  .ln{flex:0 0 auto;padding:7px 15px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);color:var(--fg-dim);font-size:12.5px;font-weight:500;cursor:pointer;
    transition:all .2s var(--ease);}
  .ln:hover{background:var(--surface-2);color:var(--fg);transform:translateY(-1px);}
  .ln.on{background:var(--brand-grad);border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 3px 14px -4px rgba(255,45,85,.65);}
  #epg{display:none;overflow:auto;max-height:32vh;border-top:1px solid var(--line);
    background:rgba(9,10,14,.6);}
  #epg.show{display:block;}
  #epg::-webkit-scrollbar{width:10px;}
  #epg::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:999px;
    border:3px solid transparent;background-clip:padding-box;}
  #epg .row{display:flex;gap:14px;padding:11px 24px;border-bottom:1px solid rgba(255,255,255,.045);
    font-size:13px;transition:background .2s var(--ease);}
  #epg .row.now{background:linear-gradient(90deg,rgba(255,45,85,.16),rgba(255,45,85,.03));
    color:#fff;box-shadow:inset 3px 0 0 var(--brand);}
  #epg .row .tm{color:var(--fg-mute);flex:0 0 54px;font-variant-numeric:tabular-nums;font-weight:500;}
  #epg .row.now .tm{color:var(--gold);font-weight:600;}
  #epg .row .pg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #epg .row .rb{color:#fff;font-size:10.5px;font-weight:700;background:var(--brand-grad);
    border-radius:999px;padding:2px 9px;letter-spacing:.03em;align-self:center;}
  #toast{position:fixed;left:50%;bottom:50px;transform:translate(-50%,10px);
    background:rgba(24,26,33,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:500;z-index:99;
    border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);
    opacity:0;transition:opacity .26s var(--ease),transform .26s var(--ease);pointer-events:none;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<header>
  <div id="brand">纯净电视直播 <span id="cnt"></span></div>
  <input id="search" placeholder="搜索频道（Ctrl+F 聚焦）" autocomplete="off">
  <div id="spacer"></div>
  <div class="tip">空格 播放/暂停 · F 全屏 · Esc 返回</div>
</header>
<div id="tabs"></div>
<div id="scroller"><div id="list"><div id="hint">正在加载频道…</div></div></div>

<div id="player">
  <div id="vwrap">
    <video id="v" controls playsinline></video>
    <div id="status">正在解析线路…</div>
  </div>
  <div id="ctrl">
    <div id="pbar">
      <div id="cname">—</div>
      <button class="btn" id="btnEpg">节目单</button>
      <button class="btn" id="btnFs">全屏</button>
      <button class="btn" id="btnFav">☆ 收藏</button>
      <button class="btn" id="btnClose">返回</button>
    </div>
    <div id="lines"></div>
    <div id="epg"></div>
  </div>
</div>
<div id="toast"></div>

<script>
var cur = { tid:null, id:null, name:null, urls:[], idx:0, epg:[] };
var player=null, curCat="tv", allChans=[], favArr=[], loaded={};

function $(id){ return document.getElementById(id); }
function toast(t){ var e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove("show");},1700); }
function norm(s){ return (s||"").replace(/\s|　/g,""); }

/* ---------- 台标 ---------- */
function logoSrc(name){
  var n=norm(name); if(window.LOGOS && LOGOS[n]) return LOGOS[n];
  var alias=n.replace(/綜合|综合/,"").replace(/頻道|频道/,"").replace(/HD/ig,"");
  if(window.LOGOS && LOGOS[alias]) return LOGOS[alias];
  if(window.LOGOS) for(var k in LOGOS){ if(k.length>=3 && n.length>=2 && (n.indexOf(k)>=0||k.indexOf(n)>=0)) return LOGOS[k]; }
  return "";
}
/* ---------- 收藏（存服务端，换端口也不丢） ---------- */
function isFav(tid,id){ return favArr.some(function(f){ return f.tid===tid && f.id===id; }); }
function syncFav(){
  fetch("/api/fav",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fav:favArr})});
}
function toggleFav(tid,id,name){
  var i=-1; for(var k=0;k<favArr.length;k++){ if(favArr[k].tid===tid&&favArr[k].id===id){ i=k; break; } }
  if(i>=0) favArr.splice(i,1); else favArr.unshift({tid:tid,id:id,name:name});
  syncFav(); toast(i>=0?"已取消收藏":"已收藏");
  if(curCat==="fav") renderChannels();
}
/* ---------- 列表 ---------- */
function loadCat(tid){
  curCat=tid;
  [].forEach.call($("tabs").children,function(t){ t.className="tab"+(t.dataset.tid===tid?" on":""); });
  $("search").value="";
  if(tid==="fav"){ $("cnt").textContent=favArr.length+" 个收藏"; renderChannels(); return; }
  if(loaded[tid]){ allChans=loaded[tid]; renderChannels(); $("cnt").textContent=allChans.length+" 个频道"; return; }
  $("list").innerHTML='<div id="hint">正在加载…</div>';
  fetch("/api/list?tid="+encodeURIComponent(tid)).then(function(r){return r.json();}).then(function(j){
    allChans=j.channels||[]; loaded[tid]=allChans;
    renderChannels(); $("cnt").textContent=allChans.length+" 个频道";
  }).catch(function(e){ $("list").innerHTML='<div id="hint">加载失败，请检查网络</div>'; });
}
function renderChannels(){
  var kw=($("search").value||"").trim().toLowerCase();
  var src=(curCat==="fav")?favArr.map(function(f){return {id:f.id,name:f.name};}):allChans;
  var arr=src.filter(function(c){ return !kw || c.name.toLowerCase().indexOf(kw)>=0; });
  var list=$("list"); list.innerHTML="";
  if(!arr.length){ list.innerHTML='<div id="hint">'+(curCat==="fav"?"还没有收藏，点频道右上角 ★ 收藏":"无匹配频道")+'</div>'; return; }
  arr.forEach(function(c){
    var d=document.createElement("div"); d.className="ch";
    var lg=logoSrc(c.name);
    d.innerHTML=(lg?'<img class="lg" src="'+lg+'" onerror="this.outerHTML=\'<div class=&quot;bd&quot;>'+c.name.slice(0,2)+'</div>\'">'
                   :'<div class="bd">'+c.name.slice(0,2)+'</div>')
      +'<div class="nm">'+c.name+'</div>'
      +'<div class="star'+(isFav(curCat,c.id)?" on":"")+'">★</div>';
    d.onclick=function(){ openChannel(curCat,c.id,c.name); };
    var st=d.querySelector(".star");
    st.onclick=function(ev){ ev.stopPropagation(); toggleFav(curCat,c.id,c.name); };
    list.appendChild(d);
  });
}
/* ---------- 播放 ---------- */
function openChannel(tid,id,name){
  cur.tid=tid; cur.id=id; cur.name=name; cur.urls=[]; cur.idx=0; cur.epg=[];
  $("cname").textContent=name;
  $("btnFav").className="btn"+(isFav(tid,id)?" act":"");
  $("btnFav").textContent=isFav(tid,id)?"★ 已收藏":"☆ 收藏";
  $("epg").classList.remove("show"); $("btnEpg").className="btn";
  $("ctrl").classList.remove("hide");
  $("player").classList.add("show");
  $("status").style.display="block"; $("status").textContent="正在解析线路…";
  $("lines").innerHTML="";
  if(player){ try{player.destroy();}catch(e){} player=null; }
  var v=$("v"); try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
  fetch("/api/play?tid="+encodeURIComponent(tid)+"&id="+encodeURIComponent(id))
    .then(function(r){return r.json();}).then(function(j){
      cur.epg=j.epg||[];
      if(!j.ok || !j.urls.length){ $("status").textContent="线路解析失败（"+ (j.msg||"") +"），请返回重进"; return; }
      cur.urls=j.urls; renderLines();
      /* ★ 自动选线路：并发测速选最快的一条，避免默认走慢线路 */
      $("status").textContent="正在测速选路…";
      pickFastest(cur.urls).then(function(best){ playIdx(best); })
                          .catch(function(){ playIdx(0); });
    }).catch(function(e){ $("status").textContent="网络错误，请重试"; });
}
function renderLines(){
  var w=$("lines"); w.innerHTML="";
  cur.urls.forEach(function(u,i){
    var d=document.createElement("div"); d.className="ln"+(i===cur.idx?" on":""); d.textContent="线路"+(i+1);
    d.onclick=function(){ playIdx(i); };
    w.appendChild(d);
  });
}
function setLineUI(){ var ls=$("lines").children; for(var i=0;i<ls.length;i++) ls[i].className="ln"+(i===cur.idx?" on":""); }
/* ---------- 设备分级：决定软解缓冲策略 ---------- */
var TIER = (function(){
  try{
    var mem = navigator.deviceMemory || 8;
    var hc  = navigator.hardwareConcurrency || 8;
    if(mem <= 2 || hc <= 4) return "low";
    if(mem >= 8 && hc >= 8) return "high";
    return "mid";
  }catch(e){ return "mid"; }
})();
/* 桌面端 CPU 通常充裕，但仍要避免缓冲无限堆积导致的延迟累积 */
function mpegtsCfg(){
  if(TIER === "low"){
    return {enableWorker:false, lazyLoad:true, stashInitialSize:256,
            liveBufferLatencyChasing:true, liveBufferLatencyMaxLatency:1.2,
            liveBufferLatencyMinRemain:0.4, autoCleanupSourceBuffer:true,
            autoCleanupMaxBackwardDuration:14, autoCleanupMinBackwardDuration:8};
  }
  return {enableWorker:true, lazyLoad:true, stashInitialSize:512,
          liveBufferLatencyChasing:true, liveBufferLatencyMaxLatency:2.0,
          liveBufferLatencyMinRemain:0.7, autoCleanupSourceBuffer:true,
          autoCleanupMaxBackwardDuration:20, autoCleanupMinBackwardDuration:10};
}

/* ---------- 线路智能测速选优（延迟 + 码率） ---------- */
function probeLine(url, timeoutMs){
  return new Promise(function(resolve){
    var t0=Date.now(), done=false, xhr=new XMLHttpRequest();
    var finish=function(rtt, br){ if(done)return; done=true; try{xhr.abort();}catch(e){} resolve({rtt:rtt, br:br}); };
    var to=setTimeout(function(){ finish(1e9, 0); }, timeoutMs);
    try{
      xhr.open("GET", url, true);
      xhr.responseType="arraybuffer";
      xhr.onprogress=function(ev){
        if(!done && ev.loaded >= 2048){
          clearTimeout(to);
          var dt=(Date.now()-t0)/1000;
          finish(Date.now()-t0, dt>0 ? Math.round(ev.loaded*8/1000/dt) : 0);
        }
      };
      xhr.onerror=function(){ clearTimeout(to); finish(1e9, 0); };
      try{ xhr.setRequestHeader("Range","bytes=0-65535"); }catch(e){}
      xhr.send();
    }catch(e){ clearTimeout(to); finish(1e9, 0); }
  });
}
function pickBestLine(urls){
  var n=Math.min(urls.length, 8), tasks=[];
  for(var i=0;i<n;i++) tasks.push(probeLine(urls[i], 2500));
  return Promise.all(tasks).then(function(rs){
    var wBr = (TIER === "low") ? 3.0 : 0.6;
    var best=0, bestScore=Infinity;
    for(var i=0;i<n;i++){
      var r=rs[i], score;
      if(r.rtt>=1e9) score = 1e7 + i;
      else score = r.rtt/1000 + (r.br/1000)*wBr;
      if(score<bestScore){ bestScore=score; best=i; }
    }
    return best;
  });
}
function pickFastest(urls){ return pickBestLine(urls); }

/* 播放中卡顿看护：短时间密集 waiting → 判定线路不稳，自动切下一条 */
var stall = {n:0, t:0, timer:null};
function bindStallWatch(v){
  stall.n=0; stall.t=Date.now();
  v.onwaiting = function(){
    stall.n++;
    if(stall.n>=4 && Date.now()-stall.t < 5000){
      toast("线路"+(cur.idx+1)+"卡顿，切换下一条");
      clearTimeout(stall.timer);
      stall.timer=setTimeout(function(){ nextLine(); }, 300);
    }
  };
}

function playIdx(i){
  cur.idx=i; setLineUI();
  var url=cur.urls[i]; if(!url) return;
  if(player){ try{player.destroy();}catch(e){} player=null; }
  var v=$("v"); try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
  $("status").style.display="block"; $("status").textContent="连接线路"+(i+1)+"…";
  if(!window.mpegts || !mpegts.getFeatureList().mseLivePlayback){ $("status").textContent="当前浏览器不支持 FLV 直播"; return; }
  try{
    player=mpegts.createPlayer({type:"flv",isLive:true,url:url,cors:true}, mpegtsCfg());
    v.onplaying=function(){ stall.n=0; stall.t=Date.now(); $("status").style.display="none"; };
    v.onended=function(){ nextLine(); };
    v.onerror=function(){ nextLine(); };
    bindStallWatch(v);
    player.on(mpegts.Events.ERROR, function(){ nextLine(); });
    player.attachMediaElement(v);
    player.load();
    var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){});
  }catch(e){ nextLine(); }
}
function nextLine(){
  if(cur.idx+1<cur.urls.length){ toast("线路"+(cur.idx+1)+"不通，自动切换"); playIdx(cur.idx+1); }
  else { $("status").style.display="block"; $("status").textContent="全部线路暂时不通，请返回重进刷新"; }
}
function closePlayer(){
  if(player){ try{player.destroy();}catch(e){} player=null; }
  var v=$("v"); try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
  $("player").classList.remove("show");
}
function renderEpg(){
  var box=$("epg"); box.innerHTML="";
  if(!cur.epg.length){ box.innerHTML='<div class="row"><div class="pg">暂无节目单</div></div>'; return; }
  var now=new Date(), hm=("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2), idx=-1;
  for(var i=0;i<cur.epg.length;i++){ if(cur.epg[i].time<=hm) idx=i; }
  cur.epg.forEach(function(p,i){
    var d=document.createElement("div"); d.className="row"+(i===idx?" now":"");
    d.innerHTML='<div class="tm">'+p.time+'</div><div class="pg">'+p.name+'</div>'+(i===idx?'<div class="rb">直播中</div>':'');
    box.appendChild(d);
  });
}
function toggleFs(){
  var v=$("v");
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else { (v.requestFullscreen||v.webkitRequestFullscreen).call(v); }
}
/* 双击画面切换全屏（与安卓端一致的交互） */
function bindDblClickFs(){
  var wrap=$("vwrap"), last=0, t=null;
  wrap.addEventListener("click", function(e){
    if(e.target.closest && (e.target.closest("#ctrl")||e.target.closest(".btn")||e.target.closest(".ln"))) return;
    var now=Date.now();
    if(now-last<320){ clearTimeout(t); last=0; toggleFs(); }
    else{ last=now; }
  });
}
/* ---------- 初始化 ---------- */
function init(){
  favArr=[]; 
  var t=$("tabs");
  var fav=document.createElement("div"); fav.className="tab"; fav.textContent="⭐ 收藏"; fav.dataset.tid="fav";
  fav.onclick=function(){ loadCat("fav"); }; t.appendChild(fav);
  fetch("/api/meta").then(function(r){return r.json();}).then(function(j){
    (j.cats||[]).forEach(function(c){
      var d=document.createElement("div"); d.className="tab"; d.textContent=c.name; d.dataset.tid=c.tid;
      d.onclick=function(){ loadCat(c.tid); }; t.appendChild(d);
    });
    loadCat("tv");
  }).catch(function(){ $("list").innerHTML='<div id="hint">无法连接本地服务</div>'; });

  fetch("/api/fav").then(function(r){return r.json();}).then(function(j){ favArr=j.fav||[]; });

  $("search").oninput=renderChannels;
  $("btnClose").onclick=closePlayer;
  $("btnFs").onclick=toggleFs;
  $("btnEpg").onclick=function(){
    var b=$("epg"); b.classList.toggle("show");
    if(b.classList.contains("show")) renderEpg();
    $("btnEpg").className="btn"+(b.classList.contains("show")?" act":"");
  };
  $("btnFav").onclick=function(){
    toggleFav(cur.tid,cur.id,cur.name);
    $("btnFav").className="btn"+(isFav(cur.tid,cur.id)?" act":"");
    $("btnFav").textContent=isFav(cur.tid,cur.id)?"★ 已收藏":"☆ 收藏";
  };
  /* 快捷键 */
  var numBuf="", numTimer=null;
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ if($("player").classList.contains("show")) closePlayer(); return; }
    if(e.key===" " && $("player").classList.contains("show")){ e.preventDefault(); var v=$("v"); v.paused?v.play():v.pause(); return; }
    if((e.key==="f"||e.key==="F") && !/[input]/i.test(e.target.tagName) && $("player").classList.contains("show")){ toggleFs(); return; }
    if((e.ctrlKey) && (e.key==="f"||e.key==="F")){ e.preventDefault(); $("search").focus(); $("search").select(); return; }
    /* 数字键直选频道（与安卓遥控器一致，1.2 秒无后续数字则跳转） */
    if(/^[0-9]$/.test(e.key) && !/[input]/i.test(e.target.tagName) && !$("player").classList.contains("show")){
      e.preventDefault();
      numBuf=(numBuf+e.key).slice(-3);
      clearTimeout(numTimer);
      var idx=parseInt(numBuf,10)-1, chs=[].slice.call(document.querySelectorAll("#list .ch"));
      if(idx>=0 && idx<chs.length){ toast("跳转第 "+(idx+1)+" 个频道"); if(chs[idx]) chs[idx].scrollIntoView({block:"center"}); }
      numTimer=setTimeout(function(){
        var c=document.querySelectorAll("#list .ch")[parseInt(numBuf,10)-1];
        if(c && typeof c.click==="function") c.click();
        numBuf="";
      }, 1200);
      return;
    }
    /* 播放中：↑/↓ 切台 */
    if($("player").classList.contains("show") && $("lines").children.length && e.key==="ArrowUp"){ return; }
  });
  bindDblClickFs();
  /* 心跳：关闭窗口后 25 秒进程自动退出 */
  setInterval(function(){ fetch("/api/ping").catch(function(){}); }, 5000);
  fetch("/api/ping").catch(function(){});
}
window.addEventListener("load", init);
</script>
</body>
</html>
